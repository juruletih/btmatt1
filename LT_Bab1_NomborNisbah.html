<style>
  :root{

  header.top p{margin:0;font-size:0.78rem;color:var(--muted);}

  .progresslabel{font-size:0.72rem;color:var(--muted);margin-top:4px;display:flex;justify-content:space-between;}
  .toc{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 18px;}
  .toc button{border:1px solid var(--border);background:#fff;border-radius:8px;padding:5px 9px;font-size:0.72rem;color:var(--text);cursor:pointer;}
  .toc button.active{background:var(--primary);color:#fff;border-color:var(--primary);}
  section.group{margin-bottom:8px;}
  .group h2{font-size:0.95rem;background:#eaf1fb;color:var(--primary-dark);padding:8px 12px;border-radius:10px;margin:20px 0 10px;border-left:4px solid var(--primary);}

  .qhead{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:6px;}
  .qnum{font-weight:800;color:var(--primary-dark);font-size:0.88rem;flex-shrink:0;}
  .qstatus{font-size:1.05rem;}
  .stem{font-size:0.92rem;margin:2px 0 10px;white-space:pre-line;}
  .stem .math{font-family:"Cambria Math","Georgia",serif;}
  .part{display:flex;align-items:center;gap:8px;margin:7px 0;flex-wrap:wrap;}
  .part label{font-size:0.85rem;font-weight:700;color:var(--muted);min-width:22px;}
  .part input{flex:1;min-width:110px;padding:7px 9px;border:1.5px solid var(--border);border-radius:8px;font-size:0.9rem;font-family:inherit;}
  .part input.correct{border-color:var(--ok);background:var(--ok-bg);}
  .part input.wrong{border-color:var(--bad);background:var(--bad-bg);}
  .part .mark{font-size:1rem;width:20px;text-align:center;}
  .btnrow{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  button.semak{background:var(--primary);color:#fff;border:none;border-radius:8px;padding:8px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
  button.semak:active{background:var(--primary-dark);}
  button.toggle{background:#fff;color:var(--primary-dark);border:1.5px solid var(--primary);border-radius:8px;padding:8px 14px;font-size:0.85rem;font-weight:700;cursor:pointer;}
  .solution{display:none;margin-top:12px;background:#f8fafc;border:1px dashed var(--border);border-radius:10px;padding:10px 12px;font-size:0.86rem;}
  .solution.show{display:block;}
  .solution h4{margin:0 0 6px;font-size:0.8rem;color:var(--primary-dark);}
  .solution ol{margin:0;padding-left:18px;}
  .solution li{margin-bottom:4px;}
  .solution .final{margin-top:8px;font-weight:800;color:var(--ok);}
  .note{font-size:0.72rem;color:var(--muted);font-style:italic;margin-top:6px;}
  .badge-open{display:inline-block;background:#fef3c7;color:#92400e;font-size:0.68rem;padding:2px 7px;border-radius:999px;font-weight:700;margin-left:6px;}
  footer.foot{text-align:center;color:var(--muted);font-size:0.75rem;margin-top:30px;padding-top:16px;border-top:1px solid var(--border);}
  #backTop{position:fixed;bottom:16px;right:16px;background:var(--primary);color:#fff;border:none;border-radius:50%;width:44px;height:44px;font-size:1.2rem;cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,0.2);display:none;}
</style>

, "rm9 200 kerugian", "kerugian 9200"], "steps": ["Tahun 1: +16 800. Tahun 2: –6 500. Tahun 3: –6 500.", "Tahun 4 = 2 × (–6 500) = –13 000.", "Jumlah = 16 800 – 6 500 – 6 500 – 13 000 = –9 200.", "Kedai mengalami KERUGIAN sebanyak RM9 200."]}], "open": false, "sample": null}, {"num": 2, "stem": "Suhu di Kuching dari pukul 7:00 p.m. hari pertama hingga 5:00 a.m. hari kedua telah menurun sebanyak 4°C. Suhu kemudian meningkat 8°C pada pukul 11:00 a.m., dan terus meningkat 2°C tiga jam kemudian. Jika suhu pada pukul 11:00 a.m. ialah 30°C, hitung suhunya pada\n(a) pukul 7:00 p.m. hari pertama\n(b) pukul 2:00 p.m. hari kedua", "parts": [{"label": "a", "ans": ["26"], "steps": ["Biar x = suhu pada 7:00 p.m. Selepas turun 4°C, suhu = x – 4 (pada 5:00 a.m.).", "Suhu terus naik 8°C menjadi 30°C pada 11:00 a.m.: (x – 4) + 8 = 30.", "x + 4 = 30 → x = 26°C."]}, {"label": "b", "ans": ["32"], "steps": ["Pada pukul 2:00 p.m. (3 jam selepas 11:00 a.m.), suhu naik lagi 2°C.", "30 + 2 = 32°C."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 1.2", "title": "Mahir Diri 1.2", "questions": [{"num": 1, "stem": "Dengan menggunakan nombor –12, 6, 2, –3, –2, 8, 11, 5, 15, tulis SATU pengiraan (guna sekurang-kurangnya dua nombor) yang memberikan hasil –14.", "parts": [], "open": true, "sample": "Contoh: –12 + (–2) = –14; 6 × (–2) – 2 = –14; 5 – 11 – 8 = –14; –2 × (–3) – 15 – 5 = –14; 8 × (–2) + 2 = –14 (atau jawapan lain yang sah)."}, {"num": 2, "stem": "Isikan tanda operasi ('+', '–', '×' atau '÷') yang sesuai pada petak kosong.\n(a) –8 [ ] (–6) = –3 × (–6 [ ] 10)\n(b) 5 + (–9) [ ] 3 = –5 [ ] (–7)", "parts": [{"label": "a", "ans": ["×,-"], "steps": ["Cuba × pada bahagian kiri: –8 × (–6) = 48.", "Bahagian kanan mesti = 48 juga: –3 × (–6 [ ] 10) = 48 → (–6 [ ] 10) = –16 → operasi mesti '–' kerana –6 – 10 = –16.", "Jawapan: × , –."]}, {"label": "b", "ans": ["÷,-"], "steps": ["Cuba ÷ pada bahagian kiri: 5 + (–9) ÷ 3 = 5 + (–3) = 2.", "Bahagian kanan mesti = 2: –5 [ ] (–7) = 2 → operasi '–' kerana –5 – (–7) = –5 + 7 = 2.", "Jawapan: ÷ , –."]}], "open": false, "sample": null}, {"num": 3, "stem": "Lengkapkan pola nombor berikut.\n(a) –9, –7, __, –3, __, 1, __\n(b) –2, 4, __, 16, –32, __, __", "parts": [{"label": "a", "ans": ["-5,-1,3"], "steps": ["Corak: setiap nombor bertambah 2 daripada nombor sebelumnya.", "–9, –7, –5, –3, –1, 1, 3.", "Tempat kosong: –5, –1, 3."]}, {"label": "b", "ans": ["-8,64,-128"], "steps": ["Corak: setiap nombor didarab dengan (–2).", "–2, 4, –8, 16, –32, 64, –128.", "Tempat kosong: –8, 64, –128."]}], "open": false, "sample": null}, {"num": 4, "stem": "Suhu di sebuah bandar ialah 12°C pada suatu ketika. Suhunya menurun sehingga –6°C. Suhu kemudian meningkat 3°C dan akhirnya menurun 8°C. Tentukan\n(a) perubahan suhu di bandar itu (daripada suhu awal ke suhu akhir)\n(b) suhu akhir di bandar itu.", "parts": [{"label": "b", "ans": ["-11"], "steps": ["Suhu akhir = –6 + 3 – 8 = –11°C."]}, {"label": "a", "ans": ["-23"], "steps": ["Perubahan suhu = suhu akhir – suhu awal = –11 – 12 = –23°C (suhu menurun sebanyak 23°C)."]}], "open": false, "sample": null}, {"num": 5, "stem": "Seorang penyelam berada 50 m di bawah aras laut. Penyelam itu berenang naik 2 m setiap 5 saat. Tentukan sama ada penyelam itu dapat mencapai aras laut selepas 2 minit (120 saat) atau tidak.", "parts": [{"label": null, "ans": ["-2,belum", "belum mencapai, -2 m", "-2m belum"], "steps": ["Bilangan selang 5 saat dalam 120 saat = 120 ÷ 5 = 24 kali.", "Jarak dinaiki = 24 × 2 = 48 m.", "Kedudukan selepas 2 minit = –50 + 48 = –2 m.", "Oleh kerana kedudukan masih –2 m (di bawah aras laut), penyelam BELUM mencapai aras laut."]}], "open": false, "sample": null}, {"num": 6, "stem": "Akaun semasa Encik Hafidz mempunyai baki RM1 238. Dia menandatangani dua keping cek bernilai RM890 dan RM1 730.\n(a) Tentukan cek yang manakah akan menjadi 'cek tendang' apabila dikreditkan.\n(b) Berapakah ringgit yang perlu ditampung oleh Encik Hafidz supaya KEDUA-DUA cek tidak menjadi cek tendang?", "parts": [{"label": "a", "ans": ["cek rm1730", "cek bernilai rm1 730", "rm1730"], "steps": ["Cek tendang berlaku apabila baki akaun tidak mencukupi untuk cek tersebut.", "RM1 238 < RM1 730, maka cek bernilai RM1 730 akan menjadi cek tendang."]}, {"label": "b", "ans": ["1382"], "steps": ["Jumlah kedua-dua cek = 890 + 1 730 = RM2 620.", "Baki semasa = RM1 238.", "Ringgit yang perlu ditampung = 2 620 – 1 238 = RM1 382."]}], "open": false, "sample": null}]}, {"group": "1.3a", "title": "Latih Diri 1.3a — Susun Pecahan pada Garis Nombor", "questions": [{"num": 1, "stem": "Susun pecahan berikut mengikut tertib menaik (kedudukan dari kiri ke kanan pada garis nombor).\n(a) 1/10, –3/5, 1/2, –1/5\n(b) –1/3, 1/6, 1/2, –1 2/3", "parts": [{"label": "a", "ans": ["-3/5,-1/5,1/10,1/2"], "steps": ["Samakan penyebut (10): 1/10, –6/10, 5/10, –2/10.", "Susun menaik: –6/10, –2/10, 1/10, 5/10.", "Iaitu: –3/5, –1/5, 1/10, 1/2."]}, {"label": "b", "ans": ["-1 2/3,-1/3,1/6,1/2"], "steps": ["–1 2/3 ialah pecahan paling negatif, jadi paling kiri.", "Samakan penyebut (6): –2/6, 1/6, 3/6, –10/6.", "Susun menaik: –1 2/3, –1/3, 1/6, 1/2."]}], "open": false, "sample": null}]}, {"group": "1.3b", "title": "Latih Diri 1.3b — Banding dan Susun Pecahan", "questions": [{"num": 1, "stem": "Banding dan susun pecahan berikut mengikut tertib menaik.\n(a) –5/6, –5/12, –1/4, 7/24, 3/8\n(b) 1/3, –5/6, 5/8, –2/3, –13/18, –15/24", "parts": [{"label": "a", "ans": ["-5/6,-5/12,-1/4,7/24,3/8"], "steps": ["Samakan penyebut (24): –20/24, –10/24, –6/24, 7/24, 9/24.", "Susun menaik: –20/24, –10/24, –6/24, 7/24, 9/24.", "Iaitu: –5/6, –5/12, –1/4, 7/24, 3/8."]}, {"label": "b", "ans": ["-5/6,-13/18,-2/3,-15/24,1/3,5/8"], "steps": ["Samakan penyebut (72): 24/72, –60/72, 45/72, –48/72, –52/72, –45/72.", "Susun menaik: –60/72, –52/72, –48/72, –45/72, 24/72, 45/72.", "Iaitu: –5/6, –13/18, –2/3, –15/24, 1/3, 5/8."]}], "open": false, "sample": null}, {"num": 2, "stem": "Banding dan susun pecahan berikut mengikut tertib menurun.\n(a) 3/5, –7/20, –5/12, –1/8, 5/6\n(b) –1/2, 2/9, –5/9, –7/12, –7/18, 11/18", "parts": [{"label": "a", "ans": ["5/6,3/5,-1/8,-7/20,-5/12"], "steps": ["Samakan penyebut (60): 36/60, –21/60, –25/60, –7.5/60, 50/60.", "Susun menurun: 50/60, 36/60, –7.5/60, –21/60, –25/60.", "Iaitu: 5/6, 3/5, –1/8, –7/20, –5/12."]}, {"label": "b", "ans": ["11/18,2/9,-7/18,-1/2,-5/9,-7/12"], "steps": ["Samakan penyebut (36): –18/36, 8/36, –20/36, –21/36, –14/36, 22/36.", "Susun menurun: 22/36, 8/36, –14/36, –18/36, –20/36, –21/36.", "Iaitu: 11/18, 2/9, –7/18, –1/2, –5/9, –7/12."]}], "open": false, "sample": null}]}, {"group": "1.3c", "title": "Latih Diri 1.3c — Gabungan Operasi Pecahan", "questions": [{"num": 1, "stem": "Nilaikan setiap yang berikut.\n(a) 1 1/6 × (3/4 + 1/5)\n(b) –5/6 + 2/3 ÷ (–3/7)\n(c) –2 1/2 ÷ (–3 1/3) + (–1/6)\n(d) –6 × (3 2/7 – 4 1/2)\n(e) –1/3 + 2 5/6 – 3/8 × 1 2/3\n(f) –1/4 + (–4/5) × 2 1/6 – 5/16", "parts": [{"label": "a", "ans": ["1 13/120"], "steps": ["Kurungan dahulu: 3/4 + 1/5 = 15/20 + 4/20 = 19/20.", "1 1/6 × 19/20 = 7/6 × 19/20 = 133/120 = 1 13/120."]}, {"label": "b", "ans": ["-2 7/18"], "steps": ["Bahagi dahulu: 2/3 ÷ (–3/7) = 2/3 × (–7/3) = –14/9.", "–5/6 + (–14/9): samakan penyebut 18 → –15/18 – 28/18 = –43/18 = –2 7/18."]}, {"label": "c", "ans": ["7/12"], "steps": ["Bahagi dahulu: –2 1/2 ÷ (–3 1/3) = (–5/2) ÷ (–10/3) = (–5/2) × (–3/10) = 15/20 = 3/4.", "3/4 + (–1/6) = 9/12 – 2/12 = 7/12."]}, {"label": "d", "ans": ["7 2/7"], "steps": ["Kurungan dahulu: 3 2/7 – 4 1/2 = 23/7 – 9/2 = 46/14 – 63/14 = –17/14.", "–6 × (–17/14) = 102/14 = 51/7 = 7 2/7."]}, {"label": "e", "ans": ["1 7/8"], "steps": ["Darab dahulu: 3/8 × 1 2/3 = 3/8 × 5/3 = 15/24 = 5/8.", "–1/3 + 2 5/6 – 5/8: samakan penyebut 24 → –8/24 + 68/24 – 15/24 = 45/24 = 1 7/8."]}, {"label": "f", "ans": ["-2 71/240"], "steps": ["Darab dahulu: (–4/5) × 2 1/6 = (–4/5) × 13/6 = –52/30 = –26/15.", "–1/4 + (–26/15) – 5/16: samakan penyebut 240 → –60/240 – 416/240 – 75/240 = –551/240 = –2 71/240."]}], "open": false, "sample": null}]}, {"group": "1.3d", "title": "Latih Diri 1.3d — Menyelesaikan Masalah Pecahan", "questions": [{"num": 1, "stem": "Seorang pembuat kek biasanya menggunakan 3 3/4 cawan gula untuk sebiji kek span. Dia mengurangkan 1 1/2 cawan gula untuk kek span kurang manis. Seorang pelanggan menempah 3 biji kek span (biasa) dan 5 biji kek span kurang manis. Berapa cawan gula diperlukan untuk kesemua tempahan itu?", "parts": [{"label": null, "ans": ["22 1/2", "22.5"], "steps": ["Gula bagi kek kurang manis = 3 3/4 – 1 1/2 = 15/4 – 6/4 = 9/4 cawan.", "Jumlah gula untuk 3 kek biasa = 3 × 15/4 = 45/4 cawan.", "Jumlah gula untuk 5 kek kurang manis = 5 × 9/4 = 45/4 cawan.", "Jumlah keseluruhan = 45/4 + 45/4 = 90/4 = 22 1/2 cawan."]}], "open": false, "sample": null}, {"num": 2, "stem": "Adam mempunyai RM40. Susan memberikan 1/3 daripada wangnya kepada Adam. Selepas Adam memberikan 1/8 daripada jumlah wangnya kepada Gopal, dia masih ada RM350. Cari jumlah asal wang Susan.", "parts": [{"label": null, "ans": ["1080", "rm1080", "rm1 080"], "steps": ["Biar wang asal Susan = S. Susan beri 1/3 S kepada Adam.", "Jumlah wang Adam sekarang = 40 + 1/3 S.", "Selepas beri 1/8 kepada Gopal, baki = 7/8 daripada jumlah itu = 350.", "7/8 × (40 + S/3) = 350 → 40 + S/3 = 400 → S/3 = 360 → S = RM1 080."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 1.3", "title": "Mahir Diri 1.3", "questions": [{"num": 1, "stem": "Dengan menggunakan TIGA pecahan berlainan dan DUA operasi berlainan (+, –, ×, ÷), tulis satu pengiraan yang memberikan hasil –1/2.", "parts": [], "open": true, "sample": "Contoh: 1/5 – 4/5 + 1/10 = –1/2; 3/10 ÷ 2/5 × (–2/3) = –1/2; 3/2 ÷ 6/5 – 1 3/4 = –1/2 (atau jawapan lain yang sah)."}, {"num": 2, "stem": "Bagi setiap pola nombor berikut, lengkapkan dengan pecahan yang sesuai.\n(a) –1/3, 1/6, __, 1 1/6\n(b) –5/8, 5/24, –5/72, __", "parts": [{"label": "a", "ans": ["2/3"], "steps": ["Corak: setiap nombor bertambah 1/2.", "–1/3, 1/6, 2/3, 1 1/6 (semak: 2/3 + 1/2 = 7/6 = 1 1/6 ✓).", "Tempat kosong: 2/3."]}, {"label": "b", "ans": ["5/216"], "steps": ["Corak: setiap nombor didarab dengan (–1/3).", "5/24 × (–1/3) = –5/72; –5/72 × (–1/3) = 5/216.", "Tempat kosong: 5/216."]}], "open": false, "sample": null}, {"num": 3, "stem": "Lengkapkan dengan pecahan yang sesuai.\n(a) –1/3 – 5/6 = 1/2 × [ ]\n(b) –2/3 + 5/8 = 1/3 ÷ [ ]", "parts": [{"label": "a", "ans": ["-2 1/3"], "steps": ["Kira sebelah kiri: –1/3 – 5/6 = –2/6 – 5/6 = –7/6.", "1/2 × x = –7/6 → x = –7/6 × 2 = –7/3 = –2 1/3."]}, {"label": "b", "ans": ["-8"], "steps": ["Kira sebelah kiri: –2/3 + 5/8 = –16/24 + 15/24 = –1/24.", "1/3 ÷ x = –1/24 → x = 1/3 ÷ (–1/24) = 1/3 × (–24) = –8."]}], "open": false, "sample": null}, {"num": 4, "stem": "Aras air di dalam sebuah tangki ialah 2 2/5 m pada pukul 4:00 p.m. Aras air menurun 1/6 m setiap jam bagi 5 jam berikutnya. Menjelang 12:00 tengah malam, aras air naik 1 2/3 m. Hitung aras air pada tengah malam.", "parts": [{"label": null, "ans": ["3 7/30"], "steps": ["Penurunan dalam 5 jam = 5 × 1/6 = 5/6 m.", "Aras selepas turun = 2 2/5 – 5/6 = 12/5 – 5/6 = 72/30 – 25/30 = 47/30 m.", "Aras pada tengah malam = 47/30 + 1 2/3 = 47/30 + 50/30 = 97/30 = 3 7/30 m."]}], "open": false, "sample": null}, {"num": 5, "stem": "Bekas A mengandungi 60 ml air. 3/8 daripada air di dalam bekas B dituangkan ke dalam bekas A. Kemudian 5/12 daripada air di dalam bekas A (yang baharu) dituangkan ke dalam bekas C yang kosong. Jika bekas C kini mengandungi 45 ml air, cari isi padu air asal di dalam bekas B.", "parts": [{"label": null, "ans": ["128"], "steps": ["Biar isi padu B = B ml. Air dituang ke A = 3/8 B.", "Jumlah air di A selepas dituang = 60 + 3/8 B.", "5/12 daripada jumlah ini dituang ke C = 45 ml.", "5/12 × (60 + 3B/8) = 45 → 60 + 3B/8 = 108 → 3B/8 = 48 → B = 128 ml."]}], "open": false, "sample": null}]}, {"group": "1.4a", "title": "Latih Diri 1.4a — Susun Perpuluhan pada Garis Nombor", "questions": [{"num": 1, "stem": "Susun perpuluhan berikut mengikut tertib menaik (kedudukan dari kiri ke kanan).\n(a) 0.6, –0.7, 0.2, –0.3\n(b) 0.7, –0.4, 0.3, –1.3", "parts": [{"label": "a", "ans": ["-0.7,-0.3,0.2,0.6"], "steps": ["Susun menaik mengikut nilai perpuluhan.", "–0.7, –0.3, 0.2, 0.6."]}, {"label": "b", "ans": ["-1.3,-0.4,0.3,0.7"], "steps": ["Susun menaik: –1.3 paling kecil.", "–1.3, –0.4, 0.3, 0.7."]}], "open": false, "sample": null}, {"num": 2, "stem": "Susun setiap kumpulan perpuluhan berikut mengikut tertib menaik.\n(a) –1.46, –1.84, –1.20, –1.62\n(b) –0.25, –0.08, –0.39, –0.17", "parts": [{"label": "a", "ans": ["-1.84,-1.62,-1.46,-1.20"], "steps": ["Bandingkan magnitud nombor negatif: makin besar magnitud, makin kecil nilainya.", "Susun menaik: –1.84, –1.62, –1.46, –1.20."]}, {"label": "b", "ans": ["-0.39,-0.25,-0.17,-0.08"], "steps": ["Susun menaik: –0.39, –0.25, –0.17, –0.08."]}], "open": false, "sample": null}]}, {"group": "1.4b", "title": "Latih Diri 1.4b — Banding dan Susun Perpuluhan", "questions": [{"num": 1, "stem": "Banding dan susun setiap yang berikut mengikut tertib menaik.\n(a) –1.23, –1.48, 0.34, –0.034, 1.034\n(b) –1.456, –1.546, 1.456, –1.654, 1.564", "parts": [{"label": "a", "ans": ["-1.48,-1.23,-0.034,0.34,1.034"], "steps": ["Susun daripada paling negatif hingga paling positif.", "–1.48, –1.23, –0.034, 0.34, 1.034."]}, {"label": "b", "ans": ["-1.654,-1.546,-1.456,1.456,1.564"], "steps": ["Susun menaik.", "–1.654, –1.546, –1.456, 1.456, 1.564."]}], "open": false, "sample": null}, {"num": 2, "stem": "Banding dan susun setiap yang berikut mengikut tertib menurun.\n(a) –2.005, –2.505, –2.052, 2.522, 2.452\n(b) 0.065, –0.647, –0.639, –0.068, 0.621", "parts": [{"label": "a", "ans": ["2.522,2.452,-2.005,-2.052,-2.505"], "steps": ["Susun daripada paling positif hingga paling negatif.", "2.522, 2.452, –2.005, –2.052, –2.505."]}, {"label": "b", "ans": ["0.621,0.065,-0.068,-0.639,-0.647"], "steps": ["Susun menurun.", "0.621, 0.065, –0.068, –0.639, –0.647."]}], "open": false, "sample": null}]}, {"group": "1.4c", "title": "Latih Diri 1.4c — Gabungan Operasi Perpuluhan", "questions": [{"num": 1, "stem": "Nilaikan setiap yang berikut.\n(a) 4.7 – 7.8 × 0.3\n(b) (8.36 + 3.89) ÷ (–0.28)\n(c) –3.48 + (7.36 + 1.24) × 0.6\n(d) 0.36 – (–8.67) ÷ (–0.3) + 0.82\n(e) –2.65 – 1.44 ÷ (–1.2) + 3.22\n(f) 2.34 + 3.1 × (–0.1) + 0.2", "parts": [{"label": "a", "ans": ["2.36"], "steps": ["Darab dahulu: 7.8 × 0.3 = 2.34.", "4.7 – 2.34 = 2.36."]}, {"label": "b", "ans": ["-43.75"], "steps": ["Kurungan dahulu: 8.36 + 3.89 = 12.25.", "12.25 ÷ (–0.28) = –43.75."]}, {"label": "c", "ans": ["1.68"], "steps": ["Kurungan dahulu: 7.36 + 1.24 = 8.6.", "–3.48 + (8.6 × 0.6) = –3.48 + 5.16 = 1.68."]}, {"label": "d", "ans": ["-27.72"], "steps": ["Bahagi dahulu: (–8.67) ÷ (–0.3) = 28.9.", "0.36 – 28.9 + 0.82 = –27.72."]}, {"label": "e", "ans": ["1.77"], "steps": ["Bahagi dahulu: 1.44 ÷ (–1.2) = –1.2.", "–2.65 – (–1.2) + 3.22 = –2.65 + 1.2 + 3.22 = 1.77."]}, {"label": "f", "ans": ["2.23"], "steps": ["Darab dahulu: 3.1 × (–0.1) = –0.31.", "2.34 + (–0.31) + 0.2 = 2.23."]}], "open": false, "sample": null}]}, {"group": "1.4d", "title": "Latih Diri 1.4d — Menyelesaikan Masalah Perpuluhan", "questions": [{"num": 1, "stem": "Aisah membeli sehelai baju berharga RM19.90 dan DUA helai seluar panjang yang sama harganya. Apabila dia membayar RM55, bayaran tidak mencukupi. Aisah membayar lagi RM10 dan menerima baki RM5.40. Hitung harga bagi SEHELAI seluar yang dibelinya.", "parts": [{"label": null, "ans": ["19.85"], "steps": ["Jumlah bayaran sebenar = 55 + 10 – 5.40 = RM59.60.", "Harga 2 seluar = 59.60 – 19.90 = RM39.70.", "Harga sehelai seluar = 39.70 ÷ 2 = RM19.85."]}], "open": false, "sample": null}, {"num": 2, "stem": "Suhu purata di Kuala Lumpur ialah 30.5°C pada satu hari. Suhu purata naik 1.8°C setiap hari bagi DUA hari berturut-turut, kemudian menurun 1.3°C setiap hari bagi TIGA hari berturut-turut. Hitung suhu purata di Kuala Lumpur selepas tempoh lima hari itu.", "parts": [{"label": null, "ans": ["30.2"], "steps": ["Jumlah perubahan = (2 × 1.8) – (3 × 1.3) = 3.6 – 3.9 = –0.3°C.", "Suhu akhir = 30.5 – 0.3 = 30.2°C."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 1.4", "title": "Mahir Diri 1.4", "questions": [{"num": 1, "stem": "Dengan menggunakan TIGA perpuluhan berlainan dan DUA operasi berlainan (+, –, ×, ÷), tulis satu pengiraan yang memberikan hasil –2.5.", "parts": [], "open": true, "sample": "Contoh: 1.2 + 1.5 – 5.2 = –2.5; 0.4 – 2.1 + (–0.8) = –2.5; –0.2 × 4.5 ÷ 0.36 = –2.5 (atau jawapan lain yang sah)."}, {"num": 2, "stem": "Bagi setiap pola nombor berikut, lengkapkan dengan perpuluhan yang sesuai.\n(a) –1.2, –0.9, __, –0.3, __\n(b) –2.1, __, –8.4, 16.8, __", "parts": [{"label": "a", "ans": ["-0.6,0"], "steps": ["Corak: setiap nombor bertambah 0.3.", "–1.2, –0.9, –0.6, –0.3, 0.", "Tempat kosong: –0.6, 0."]}, {"label": "b", "ans": ["4.2,-33.6"], "steps": ["Corak: setiap nombor didarab dengan (–2).", "–2.1, 4.2, –8.4, 16.8, –33.6.", "Tempat kosong: 4.2, –33.6."]}], "open": false, "sample": null}, {"num": 3, "stem": "Lengkapkan dengan perpuluhan yang sesuai.\n(a) 3.2 × (–2.1) + 5.8 = 0.5 × [ ]\n(b) –5.12 – (–2.4) ÷ (–0.5) = 1.6 × [ ]", "parts": [{"label": "a", "ans": ["-1.84"], "steps": ["Kira sebelah kiri: 3.2 × (–2.1) = –6.72; –6.72 + 5.8 = –0.92.", "0.5 × x = –0.92 → x = –1.84."]}, {"label": "b", "ans": ["-6.2"], "steps": ["Kira sebelah kiri: (–2.4) ÷ (–0.5) = 4.8; –5.12 – 4.8 = –9.92.", "1.6 × x = –9.92 → x = –6.2."]}], "open": false, "sample": null}, {"num": 4, "stem": "Ramesh membeli 63 biji oren dengan harga RM34.65, dan dibungkus 3 biji sebungkus (21 bungkus). Hitung harga jualan SETIAP bungkus jika dia\n(a) mengalami kerugian RM19.95\n(b) memperoleh keuntungan RM51.45\nselepas jualan semua oren itu.", "parts": [{"label": "a", "ans": ["0.70"], "steps": ["Jumlah jualan = kos – kerugian = 34.65 – 19.95 = RM14.70.", "Harga sebungkus = 14.70 ÷ 21 = RM0.70."]}, {"label": "b", "ans": ["4.10"], "steps": ["Jumlah jualan = kos + keuntungan = 34.65 + 51.45 = RM86.10.", "Harga sebungkus = 86.10 ÷ 21 = RM4.10."]}], "open": false, "sample": null}, {"num": 5, "stem": "Seekor ikan berada 1.34 m di bawah aras laut manakala seekor burung berada 4.32 m di atas aras laut. Seekor penyu berada di bawah aras laut sejauh DUA KALI jarak menegak antara ikan dengan burung. Hitung jarak menegak antara burung dengan penyu.", "parts": [{"label": null, "ans": ["15.64"], "steps": ["Jarak menegak ikan-burung = 4.32 – (–1.34) = 5.66 m.", "Kedudukan penyu = 2 × 5.66 = 11.32 m di bawah aras laut, iaitu –11.32.", "Jarak burung-penyu = 4.32 – (–11.32) = 15.64 m."]}], "open": false, "sample": null}]}, {"group": "1.5a", "title": "Latih Diri 1.5a — Mengenal Nombor Nisbah", "questions": [{"num": 1, "stem": "Tentukan sama ada semua nombor berikut ialah nombor nisbah atau bukan. Terangkan.\n–2/4, 8/7, –1.2/1.5, 7.65, 2 2/5, –4.2", "parts": [{"label": null, "ans": ["ya, nombor nisbah", "nombor nisbah", "ya"], "steps": ["Nombor nisbah ialah nombor yang boleh ditulis dalam bentuk p/q, dengan p dan q integer, q ≠ 0.", "–2/4 = –1/2; 8/7 (sudah dalam bentuk p/q); –1.2/1.5 = –4/5; 7.65 = 153/20; 2 2/5 = 12/5; –4.2 = –21/5.", "Semua nombor ini boleh ditulis dalam bentuk p/q, maka SEMUANYA ialah nombor nisbah."]}], "open": false, "sample": null}]}, {"group": "1.5b", "title": "Latih Diri 1.5b — Gabungan Operasi Nombor Nisbah", "questions": [{"num": 1, "stem": "Nilaikan setiap yang berikut.\n(a) –0.6 + 3/4 × (–1 3/5)\n(b) (2 1/2 – 0.75) ÷ (–1 3/4) + 0.4\n(c) 1.125 + 1 2/3 – 2 5/6 × (–8/27)\n(d) –3.25 ÷ [3 1/5 – (–2 1/6)] + 0.25", "parts": [{"label": "a", "ans": ["-1 4/5"], "steps": ["Darab dahulu: 3/4 × (–1 3/5) = 3/4 × (–8/5) = –24/20 = –1.2.", "–0.6 + (–1.2) = –1.8 = –1 4/5."]}, {"label": "b", "ans": ["-1 1/6"], "steps": ["Kurungan: 2 1/2 – 0.75 = 2.5 – 0.75 = 1.75 = 1 3/4.", "1 3/4 ÷ (–1 3/4) = –1.", "–1 + 0.4 = –0.6 = –3/5.", "(Nota: soalan ini disesuaikan sedikit kerana imbasan buku teks asal kabur pada bahagian ini — semak semula dengan buku fizikal jika (function(){
"use strict";

function normalize(s){
  if (s === null || s === undefined) return "";
  s = String(s).toLowerCase().trim();
  s = s.replace(/rm/g,"").replace(/\s+/g,"").replace(/–/g,"-").replace(/—/g,"-");
  s = s.replace(/,/g,",");
  return s;
}

// Try to parse a value (number, fraction "a/b", mixed "n a/b" already space-stripped as "na/b"? handle both)
function toNumber(s){
  s = normalize(s);
  if (s === "") return null;
  // list form e.g. "-8,0,8" is handled separately (exact string match), not here
  // mixed number with fraction: e.g. "2 1/3" (space kept before normalize strips spaces -> "21/3") ambiguous.
  // We instead require inputs without internal spaces for numeric parse; mixed numbers should be typed like "2+1/3" or as decimal.
  if (/^-?\d+\/\d+$/.test(s)){
    var parts = s.split("/");
    return parseFloat(parts[0])/parseFloat(parts[1]);
  }
  if (/^-?\d+(\.\d+)?$/.test(s)){
    return parseFloat(s);
  }
  return null;
}

function fuzzyNumberMatch(input, accepted){
  var vi = toNumber(input);
  if (vi === null) return false;
  for (var i=0;i<accepted.length;i++){
    var va = toNumber(accepted[i]);
    if (va !== null && Math.abs(vi - va) < 0.005) return true;
  }
  return false;
}

function checkPart(inputRaw, acceptedList){
  var inputN = normalize(inputRaw);
  if (inputN === "") return false;
  for (var i=0;i<acceptedList.length;i++){
    if (normalize(acceptedList[i]) === inputN) return true;
  }
  // allow mixed number typed with a space, e.g. "2 1/3" vs accepted "2 1/3"
  var inputSpaced = String(inputRaw).toLowerCase().trim().replace(/–/g,"-");
  for (var j=0;j<acceptedList.length;j++){
    if (String(acceptedList[j]).toLowerCase().trim() === inputSpaced) return true;
  }
  if (fuzzyNumberMatch(inputRaw, acceptedList)) return true;
  return false;
}

var DATA = window.__LATIHTUBI_DATA__ || [];
var totalQuestions = 0;
DATA.forEach(function(grp){ totalQuestions += grp.questions.length; });

var checkedCount = 0;
var correctPartsCount = 0;
var totalPartsCount = 0;
DATA.forEach(function(grp){
  grp.questions.forEach(function(qq){
    totalPartsCount += qq.open ? 1 : qq.parts.length;
  });
});

function updateProgress(){
  document.getElementById("progressText").textContent = checkedCount + " / " + totalQuestions + " disemak";
  document.getElementById("scoreText").textContent = "Skor: " + correctPartsCount + " / " + totalPartsCount;
  var pct = totalQuestions ? Math.round((checkedCount/totalQuestions)*100) : 0;
  document.getElementById("progressbar").style.width = pct + "%";
}

function stemToHtml(s){
  return s.replace(/\n/g,"<br>");
}

function buildToc(){
  var toc = document.getElementById("toc");
  DATA.forEach(function(grp,idx){
    var btn = document.createElement("button");
    btn.textContent = grp.group;
    btn.onclick = function(){
      document.getElementById("sec-"+idx).scrollIntoView({behavior:"smooth", block:"start"});
    };
    toc.appendChild(btn);
  });
}

function render(){
  var content = document.getElementById("content");
  var html = "";
  DATA.forEach(function(grp, gi){
    html += '<section class="group" id="sec-'+gi+'"><h2>'+grp.title+'</h2>';
    grp.questions.forEach(function(qq, qi){
      var qid = "g"+gi+"q"+qi;
      html += '<div class="qcard" id="card-'+qid+'">';
      html += '<div class="qhead"><span class="qnum">Soalan '+qq.num+'</span><span class="qstatus" id="status-'+qid+'"></span></div>';
      html += '<div class="stem">'+stemToHtml(qq.stem)+(qq.open?'<span class="badge-open">Jawapan Terbuka</span>':'')+'</div>';

      if (qq.open){
        html += '<div class="part"><label>Jwp</label><input type="text" data-qid="'+qid+'" data-part="0" placeholder="Tulis pengiraan anda di sini"><span class="mark" id="mark-'+qid+'-0"></span></div>';
      } else {
        qq.parts.forEach(function(pp, pi){
          var lbl = pp.label ? "("+pp.label+")" : "Jwp";
          html += '<div class="part"><label>'+lbl+'</label><input type="text" data-qid="'+qid+'" data-part="'+pi+'" placeholder="Masukkan jawapan"><span class="mark" id="mark-'+qid+'-'+pi+'"></span></div>';
        });
      }

      html += '<div class="btnrow">';
      html += '<button class="semak" data-action="semak" data-qid="'+qid+'">Semak Jawapan</button>';
      html += '<button class="toggle" data-action="toggle" data-qid="'+qid+'">Lihat Langkah</button>';
      html += '</div>';

      html += '<div class="solution" id="sol-'+qid+'">';
      if (qq.open){
        html += '<h4>Contoh Jawapan (jawapan lain yang sah turut diterima)</h4><p>'+qq.sample+'</p>';
      } else {
        qq.parts.forEach(function(pp, pi){
          var lbl = pp.label ? "("+pp.label+")" : "";
          html += '<h4>Langkah Penyelesaian '+lbl+'</h4><ol>';
          pp.steps.forEach(function(st){ html += '<li>'+st+'</li>'; });
          html += '</ol><div class="final">Jawapan: '+pp.ans[0]+'</div>';
        });
      }
      html += '</div>';
      html += '</div>'; // qcard
    });
    html += '</section>';
  });
  content.innerHTML = html;
}

function findQuestion(qid){
  var m = qid.match(/^g(\d+)q(\d+)$/);
  var gi = parseInt(m[1],10), qi = parseInt(m[2],10);
  return DATA[gi].questions[qi];
}

function onSemak(qid){
  var qq = findQuestion(qid);
  var card = document.getElementById("card-"+qid);
  var inputs = card.querySelectorAll('input[data-qid="'+qid+'"]');
  var alreadyChecked = card.getAttribute("data-checked") === "1";
  var anyCorrectBefore = 0;

  if (qq.open){
    // open-ended: mark as attempted, reveal sample, no correctness scoring beyond attempt
    var val = inputs[0].value.trim();
    var mark = document.getElementById("mark-"+qid+"-0");
    if (val.length > 0){
      mark.textContent = "✅";
      inputs[0].classList.add("correct");
    } else {
      mark.textContent = "";
    }
    document.getElementById("sol-"+qid).classList.add("show");
    if (!alreadyChecked){
      checkedCount++;
      correctPartsCount += 1; // open-ended counts as complete once attempted
      card.setAttribute("data-checked","1");
      updateProgress();
    }
    document.getElementById("status-"+qid).textContent = "📝";
    return;
  }

  var allCorrect = true;
  var correctHere = 0;
  qq.parts.forEach(function(pp, pi){
    var inp = card.querySelector('input[data-part="'+pi+'"]');
    var mark = document.getElementById("mark-"+qid+"-"+pi);
    var ok = checkPart(inp.value, pp.ans);
    inp.classList.remove("correct","wrong");
    if (ok){
      inp.classList.add("correct");
      mark.textContent = "✅";
      correctHere++;
    } else {
      inp.classList.add("wrong");
      mark.textContent = "❌";
      allCorrect = false;
    }
  });

  document.getElementById("sol-"+qid).classList.add("show");
  document.getElementById("status-"+qid).textContent = allCorrect ? "✅" : "❌";

  if (!alreadyChecked){
    checkedCount++;
    correctPartsCount += correctHere;
    card.setAttribute("data-checked","1");
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  } else {
    // recompute delta if they re-check after editing
    var prevCorrect = parseInt(card.getAttribute("data-correct-count")||"0",10);
    correctPartsCount += (correctHere - prevCorrect);
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  }
}

function onToggle(qid){
  var sol = document.getElementById("sol-"+qid);
  sol.classList.toggle("show");
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches('button[data-action="semak"]')){
    onSemak(t.getAttribute("data-qid"));
  } else if (t.matches('button[data-action="toggle"]')){
    onToggle(t.getAttribute("data-qid"));
  }
});

window.addEventListener("scroll", function(){
  document.getElementById("backTop").style.display = window.scrollY > 400 ? "block" : "none";
});

buildToc();
render();
updateProgress();

})();
