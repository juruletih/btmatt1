 "steps": ["Selang antara –12 dan –4 ialah 8 unit, dan antara –4 dan 4 juga 8 unit — tetapi terdapat satu tanda kosong di antaranya, jadi selang sebenar ialah 4 unit.", "Jujukan: –12, –8, –4, 0, 4, 8.", "Tempat kosong: –8, 0, 8."]}, {"label": "b", "ans": ["-56,-40,-16"], "steps": ["Selang antara –32 dan –24 ialah 8 unit.", "Jujukan lengkap: –56, –48, –40, –32, –24, –16.", "Tempat kosong: –56, –40, –16."]}], "open": false, "sample": null}]}, {"group": "1.1d", "title": "Latih Diri 1.1d — Banding dan Susun Integer", "questions": [{"num": 1, "stem": "Banding dan susun –4, 3, 1, –6, 5, 0, –2 mengikut tertib menaik.", "parts": [{"label": null, "ans": ["-6,-4,-2,0,1,3,5"], "steps": ["Tertib menaik bermula daripada nombor paling kecil (paling negatif).", "Susun: –6, –4, –2, 0, 1, 3, 5."]}], "open": false, "sample": null}, {"num": 2, "stem": "Banding dan susun –5, –3, 3, 4, –4, 2, –1 mengikut tertib menurun.", "parts": [{"label": null, "ans": ["4,3,2,-1,-3,-4,-5"], "steps": ["Tertib menurun bermula daripada nombor paling besar.", "Susun: 4, 3, 2, –1, –3, –4, –5."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 1.1", "title": "Mahir Diri 1.1", "questions": [{"num": 1, "stem": "Nyatakan maksud/nilai bagi setiap yang berikut.\n(a) Jika +20 mewakili 20 m di atas aras laut, maka –20 mewakili ______.\n(b) Jika +90 mewakili pergerakan 90 m ke arah utara, maka –90 mewakili ______.\n(c) Jika +800 mewakili RM800 dikredit ke akaun, maka RM800 didebit diwakili oleh ______.\n(d) Jika +1 000 mewakili keuntungan RM1 000, maka kerugian RM1 000 diwakili oleh ______.", "parts": [{"label": "a", "ans": ["20 m di bawah aras laut", "bawah aras laut"], "steps": ["Tanda '–' membalikkan makna '+'.", "+20 = 20 m di atas aras laut, maka –20 = 20 m di bawah aras laut."]}, {"label": "b", "ans": ["pergerakan 90 m ke arah selatan", "selatan"], "steps": ["Arah bertentangan dengan utara ialah selatan.", "–90 mewakili pergerakan 90 m ke arah selatan."]}, {"label": "c", "ans": ["-800", "–800"], "steps": ["Debit (tolak daripada akaun) bertentangan dengan kredit (tambah ke akaun).", "RM800 didebit = –800."]}, {"label": "d", "ans": ["-1000", "–1000", "–1 000"], "steps": ["Kerugian bertentangan dengan keuntungan.", "Kerugian RM1 000 = –1 000."]}], "open": false, "sample": null}, {"num": 2, "stem": "Nyatakan nombor berikut dengan tanda '+' atau '–'.\n(a) Kurang 80 daripada sifar\n(b) Lebih 76 daripada sifar", "parts": [{"label": "a", "ans": ["-80", "–80"], "steps": ["'Kurang daripada sifar' bermaksud negatif.", "Kurang 80 daripada sifar = –80."]}, {"label": "b", "ans": ["+76", "76"], "steps": ["'Lebih daripada sifar' bermaksud positif.", "Lebih 76 daripada sifar = +76."]}], "open": false, "sample": null}, {"num": 3, "stem": "Senaraikan semua integer\n(a) daripada –8 hingga 4.\n(b) daripada –12 hingga –2.", "parts": [{"label": "a", "ans": ["-8,-7,-6,-5,-4,-3,-2,-1,0,1,2,3,4"], "steps": ["Senaraikan semua nombor bulat berturutan bermula –8 sehingga 4 (kedua-dua hujung termasuk).", "–8, –7, –6, –5, –4, –3, –2, –1, 0, 1, 2, 3, 4."]}, {"label": "b", "ans": ["-12,-11,-10,-9,-8,-7,-6,-5,-4,-3,-2"], "steps": ["Senaraikan semua nombor bulat berturutan bermula –12 sehingga –2.", "–12, –11, –10, –9, –8, –7, –6, –5, –4, –3, –2."]}], "open": false, "sample": null}, {"num": 4, "stem": "Tentukan sama ada setiap nombor berikut integer atau bukan: –14, 3.9, 12, –26, 85, 0, –2", "parts": [{"label": null, "ans": ["integer:-14,12,-26,85,0,-2;bukan:3.9", "-14,12,-26,85,0,-2"], "steps": ["Integer = nombor bulat (positif, negatif atau sifar), tiada bahagian perpuluhan.", "3.9 mempunyai bahagian perpuluhan → bukan integer.", "Integer: –14, 12, –26, 85, 0, –2. Bukan integer: 3.9."]}], "open": false, "sample": null}, {"num": 5, "stem": "Banding dan susun suhu berikut mengikut tertib, bermula daripada suhu PALING SEJUK: –3°C, 2°C, –4°C, 1°C, 4°C", "parts": [{"label": null, "ans": ["-4,-3,1,2,4"], "steps": ["Paling sejuk = nilai paling kecil (paling negatif).", "Susun menaik: –4°C, –3°C, 1°C, 2°C, 4°C."]}], "open": false, "sample": null}]}]}, {"code": "1.2", "title": "1.2 Operasi Asas Aritmetik yang Melibatkan Integer", "notes": [{"heading": "Tambah dan Tolak Integer (Garis Nombor)", "html": "Tambah integer POSITIF → bergerak ke KANAN. Tambah integer NEGATIF → bergerak ke KIRI.<br>Tolak integer POSITIF → bergerak ke KIRI. Tolak integer NEGATIF → bergerak ke KANAN (sama seperti tambah positif).<br>Cara pantas: −(−n) = +n ; −(+n) = −n ; +(−n) = −n ; +(+n) = +n."}, {"heading": "Darab dan Bahagi Integer", "html": "<table style='width:100%;border-collapse:collapse;font-size:0.85rem' border='1' cellpadding='6'><tr><th>Operasi</th><th>Tanda Hasil</th></tr><tr><td>(+) × (+) atau (+) ÷ (+)</td><td>Positif</td></tr><tr><td>(+) × (–) atau (+) ÷ (–)</td><td>Negatif</td></tr><tr><td>(–) × (+) atau (–) ÷ (+)</td><td>Negatif</td></tr><tr><td>(–) × (–) atau (–) ÷ (–)</td><td>Positif</td></tr></table><i>Ringkasnya:</i> tanda SAMA → positif; tanda BERLAINAN → negatif."}, {"heading": "Tertib Operasi", "html": "Ikut tertib ini apabila menghitung gabungan operasi: <b>Tanda Kurung ( )</b> → <b>× atau ÷</b> (kiri ke kanan) → <b>+ atau –</b> (kiri ke kanan)."}, {"heading": "Hukum Operasi Aritmetik", "html": "• <b>Hukum Kalis Tukar Tertib:</b> a+b=b+a ; a×b=b×a<br>• <b>Hukum Kalis Sekutuan:</b> (a+b)+c=a+(b+c) ; (a×b)×c=a×(b×c)<br>• <b>Hukum Kalis Agihan:</b> a×(b+c)=a×b+a×c<br>• <b>Hukum Identiti:</b> a+0=a ; a×0=0 ; a×1=a ; a+(–a)=0<br>Hukum-hukum ini membolehkan pengiraan dibuat dengan lebih efisien."}], "examples": [{"title": "Contoh 5", "q": "Selesaikan (a) 8+(+3) (b) 5+(–2) (c) 2–(+4) (d) –1–(–4)", "steps": ["(a) 8+(+3) = 8+3 = 11.", "(b) 5+(–2) = 5–2 = 3.", "(c) 2–(+4) = 2–4 = –2.", "(d) –1–(–4) = –1+4 = 3."], "ans": "(a) 11  (b) 3  (c) –2  (d) 3"}, {"title": "Contoh 6", "q": "Nilaikan (a) –5×(–4) (b) –6×4 (c) 6÷(–2) (d) –12÷(–2)", "steps": ["(a) Tanda sama → +(5×4) = 20.", "(b) Tanda berlainan → –(6×4) = –24.", "(c) Tanda berlainan → –(6÷2) = –3.", "(d) Tanda sama → +(12÷2) = 6."], "ans": "(a) 20  (b) –24  (c) –3  (d) 6"}, {"title": "Contoh 7", "q": "Selesaikan (a) –8×(–2+3) (b) 7+2(–3) (c) 4–12÷(–2)+(–1) (d) [–12+(–16)] ÷ [–22–(–24)]", "steps": ["(a) Kurungan dahulu: –2+3=1. –8×1=–8.", "(b) Darab dahulu: 2×(–3)=–6. 7+(–6)=1.", "(c) Bahagi dahulu: 12÷(–2)=–6, jadi 4–(–6)+(–1)=4+6–1=9.", "(d) Atas: –12+(–16)=–28. Bawah: –22+24=2. –28÷2=–14."], "ans": "(a) –8  (b) 1  (c) 9  (d) –14"}, {"title": "Contoh 8", "q": "Selesaikan dengan pengiraan efisien: (a) 29+38+2 (b) 2×24×5 (c) 7×3 040", "steps": ["(a) Hukum Kalis Sekutuan: 29+(38+2)=29+40=69.", "(b) Hukum Kalis Tukar Tertib & Sekutuan: 24×(2×5)=24×10=240.", "(c) Hukum Kalis Agihan: 7×(3000+40)=21000+280=21280."], "ans": "(a) 69  (b) 240  (c) 21 280"}, {"title": "Contoh (Penyelesaian Masalah)", "q": "Tunggakan kad kredit Luqman RM230. Dia guna kad untuk 3 buah buku @RM120. Seminggu kemudian dikenakan faedah RM3 dan dia bayar balik RM400. Adakah Luqman menjelaskan hutangnya?", "steps": ["Tunggakan = –230. Perbelanjaan = 3×(–120) = –360. Faedah = –3. Bayaran balik = +400.", "Baki akaun = –230 + (–360) + (–3) + 400 = –193."], "ans": "Belum selesai — masih ada tunggakan RM193."}], "exercises": [{"group": "1.2a", "title": "Latih Diri 1.2a — Tambah dan Tolak Integer", "questions": [{"num": 1, "stem": "Selesaikan setiap yang berikut.\n(a) 6 + (+2)\n(b) –4 + (–3)\n(c) 3 – (+2)\n(d) –2 – (–4)\n(e) –8 + (–2)\n(f) 6 – (+3)\n(g) 9 + (+4)\n(h) –5 – (–3)", "parts": [{"label": "a", "ans": ["8"], "steps": ["+(+2) = +2 (tanda sama, kekal tambah).", "6 + 2 = 8."]}, {"label": "b", "ans": ["-7"], "steps": ["+(–3) = –3.", "–4 – 3 = –7."]}, {"label": "c", "ans": ["1"], "steps": ["–(+2) = –2.", "3 – 2 = 1."]}, {"label": "d", "ans": ["2"], "steps": ["–(–4) = +4 (dua tanda negatif menjadi positif).", "–2 + 4 = 2."]}, {"label": "e", "ans": ["-10"], "steps": ["+(–2) = –2.", "–8 – 2 = –10."]}, {"label": "f", "ans": ["3"], "steps": ["–(+3) = –3.", "6 – 3 = 3."]}, {"label": "g", "ans": ["13"], "steps": ["+(+4) = +4.", "9 + 4 = 13."]}, {"label": "h", "ans": ["-2"], "steps": ["–(–3) = +3.", "–5 + 3 = –2."]}], "open": false, "sample": null}]}, {"group": "1.2b", "title": "Latih Diri 1.2b — Darab dan Bahagi Integer", "questions": [{"num": 1, "stem": "Selesaikan setiap yang berikut.\n(a) –6 × (–3)\n(b) –7 × 2\n(c) 4 × (–8)\n(d) 8 × (–6)\n(e) –12 ÷ 3\n(f) –18 ÷ (–6)\n(g) 15 ÷ (–5)\n(h) –20 ÷ 4", "parts": [{"label": "a", "ans": ["18"], "steps": ["Tanda sama (–)×(–) → hasil positif.", "6 × 3 = 18."]}, {"label": "b", "ans": ["-14"], "steps": ["Tanda berlainan (–)×(+) → hasil negatif.", "7 × 2 = 14 → –14."]}, {"label": "c", "ans": ["-32"], "steps": ["Tanda berlainan → negatif.", "4 × 8 = 32 → –32."]}, {"label": "d", "ans": ["-48"], "steps": ["Tanda berlainan → negatif.", "8 × 6 = 48 → –48."]}, {"label": "e", "ans": ["-4"], "steps": ["Tanda berlainan (–)÷(+) → negatif.", "12 ÷ 3 = 4 → –4."]}, {"label": "f", "ans": ["3"], "steps": ["Tanda sama (–)÷(–) → positif.", "18 ÷ 6 = 3."]}, {"label": "g", "ans": ["-3"], "steps": ["Tanda berlainan → negatif.", "15 ÷ 5 = 3 → –3."]}, {"label": "h", "ans": ["-5"], "steps": ["Tanda berlainan → negatif.", "20 ÷ 4 = 5 → –5."]}], "open": false, "sample": null}]}, {"group": "1.2c", "title": "Latih Diri 1.2c — Gabungan Operasi Integer", "questions": [{"num": 1, "stem": "Nilaikan setiap yang berikut (ikut tertib operasi: kurungan → darab/bahagi → tambah/tolak).\n(a) –9 × (–4 + 6)\n(b) 8 + (–4) × 8\n(c) 4 – 15 ÷ (–3) + (–8)\n(d) [–14 + (–22)] ÷ [–23 – (–35)]\n(e) –12 – 15 × (–3) – (–6)\n(f) [–6 + (–8) × (–5)] ÷ [–27 – (–38)]", "parts": [{"label": "a", "ans": ["-18"], "steps": ["Kurungan dahulu: –4 + 6 = 2.", "–9 × 2 = –18."]}, {"label": "b", "ans": ["-24"], "steps": ["Darab dahulu: (–4) × 8 = –32.", "8 + (–32) = –24."]}, {"label": "c", "ans": ["1"], "steps": ["Bahagi dahulu: 15 ÷ (–3) = –5.", "4 – (–5) + (–8) = 4 + 5 – 8 = 1."]}, {"label": "d", "ans": ["-3"], "steps": ["Selesaikan kurungan atas: –14 + (–22) = –36.", "Selesaikan kurungan bawah: –23 – (–35) = –23 + 35 = 12.", "–36 ÷ 12 = –3."]}, {"label": "e", "ans": ["39"], "steps": ["Darab dahulu: 15 × (–3) = –45, jadi –(–45) = +45.", "–12 + 45 – (–6) = –12 + 45 + 6 = 39."]}, {"label": "f", "ans": ["3 1/11"], "steps": ["Darab dahulu: (–8) × (–5) = 40. Pengangka: –6 + 40 = 34.", "Penyebut: –27 – (–38) = –27 + 38 = 11.", "34 ÷ 11 = 3 1/11."]}], "open": false, "sample": null}]}, {"group": "1.2d", "title": "Latih Diri 1.2d — Hukum Aritmetik untuk Pengiraan Efisien", "questions": [{"num": 1, "stem": "Dengan menggunakan hukum yang telah dipelajari (Kalis Tukar Tertib / Kalis Sekutuan / Kalis Agihan), selesaikan setiap yang berikut secara efisien.\n(a) 356 + 61 + 9\n(b) 20 × 567 × 5\n(c) 89 × 5 080\n(d) 6 × 200 + 6 × 25 + 6 × 5\n(e) 26 × 3 – 24 × 3\n(f) 899 × 5", "parts": [{"label": "a", "ans": ["426"], "steps": ["Hukum Kalis Sekutuan: 356 + (61 + 9).", "= 356 + 70 = 426."]}, {"label": "b", "ans": ["56700"], "steps": ["Hukum Kalis Tukar Tertib & Sekutuan: 567 × (20 × 5).", "= 567 × 100 = 56 700."]}, {"label": "c", "ans": ["452120"], "steps": ["Hukum Kalis Agihan: 89 × (5 000 + 80) = 89×5000 + 89×80.", "= 445 000 + 7 120 = 452 120."]}, {"label": "d", "ans": ["1380"], "steps": ["Hukum Kalis Agihan: 6 × (200 + 25 + 5).", "= 6 × 230 = 1 380."]}, {"label": "e", "ans": ["6"], "steps": ["Hukum Kalis Agihan: 3 × (26 – 24).", "= 3 × 2 = 6."]}, {"label": "f", "ans": ["4495"], "steps": ["899 = 900 – 1. Hukum Kalis Agihan: (900 – 1) × 5 = 900×5 – 1×5.", "= 4 500 – 5 = 4 495."]}], "open": false, "sample": null}]}, {"group": "1.2e", "title": "Latih Diri 1.2e — Menyelesaikan Masalah Integer", "questions": [{"num": 1, "stem": "Sebuah kedai mendapat keuntungan RM16 800 pada tahun pertama dan mengalami kerugian RM6 500 setiap tahun bagi DUA tahun berturut-turut. Pada tahun keempat, kerugian yang dialami adalah DUA KALI kerugian tahun kedua. Berapakah jumlah keuntungan atau kerugian kedai itu dalam tempoh empat tahun?", "parts": [{"label": null, "ans": ["kerugian rm9200", "-9200", "rm9 200 kerugian", "kerugian 9200"], "steps": ["Tahun 1: +16 800. Tahun 2: –6 500. Tahun 3: –6 500.", "Tahun 4 = 2 × (–6 500) = –13 000.", "Jumlah = 16 800 – 6 500 – 6 500 – 13 000 = –9 200.", "Kedai mengalami KERUGIAN sebanyak RM9 200."]}], "open": false, "sample": null}, {"num": 2, "stem": "Suhu di Kuching dari pukul 7:00 p.m. hari pertama hingga 5:00 a.m. hari kedua telah menurun sebanyak 4°C. Suhu kemudian meningkat 8°C pada pukul 11:00 a.m., dan terus meningkat 2°C tiga jam kemudian. Jika suhu pada pukul 11:00 a.m. ialah 30°C, hitung suhunya pada\n(a) pukul 7:00 p.m. hari pertama\n(b) pukul 2:00 p.m. hari kedua", "parts": [{"label": "a", "ans": ["26"], "steps": ["Biar x = suhu pada 7:00 p.m. Selepas turun 4°C, suhu = x – 4 (pada 5:00 a.m.).", "Suhu terus naik 8°C menjadi 30°C pada 11:00 a.m.: (x – 4) + 8 = 30.", "x + 4 = 30 → x = 26°C."]}, {"label": "b", "ans": ["32"], "steps": ["Pada pukul 2:00 p.m. (3 jam selepas 11:00 a.m.), suhu naik lagi 2°C.", "30 + 2 = 32°C."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 1.2", "title": "Mahir Diri 1.2", "questions": [{"num": 1, "stem": "Dengan menggunakan nombor –12, 6, 2, –3, –2, 8, 11, 5, 15, tulis SATU pengiraan (guna sekurang-kurangnya dua nombor) yang memberikan hasil –14.", "parts": [], "open": true, "sample": "Contoh: –12 + (–2) = –14; 6 × (–2) – 2 = –14; 5 – 11 – 8 = –14; –2 × (–3) – 15 – 5 = –14; 8 × (–2) + 2 = –14 (atau jawapan lain yang sah)."}, {"num": 2, "stem": "Isikan tanda operasi ('+', '–', '×' atau '÷') yang sesuai pada petak kosong.\n(a) –8 [ ] (–6) = –3 × (–6 [ ] 10)\n(b) 5 + (–9) [ ] 3 = –5 [ ] (–7)", "parts": [{"label": "a", "ans": ["×,-"], "steps": ["Cuba × pada bahagian kiri: –8 × (–6) = 48.", "Bahagian kanan mesti = 48 juga: –3 × (–6 [ ] 10) = 48 → (–6 [ ] 10) = –16 → operasi mesti '–' kerana –6 – 10 = –16.", "Jawapan: × , –."]}, {"label": "b", "ans": ["÷,-"], "steps": ["Cuba ÷ pada bahagian kiri: 5 + (–9) ÷ 3 = 5 + (–3) = 2.", "Bahagian kanan mesti = 2: –5 [ ] (–7) = 2 → operasi '–' kerana –5 – (–7) = –5 + 7 = 2.", "Jawapan: ÷ , –."]}], "open": false, "sample": null}, {"num": 3, "stem": "Lengkapkan pola nombor berikut.\n(a) –9, –7, __, –3, __, 1, __\n(b) –2, 4, __, 16, –32, __, __", "parts": [{"label": "a", "ans": ["-5,-1,3"], "steps": ["Corak: setiap nombor bertambah 2 daripada nombor sebelumnya.", "–9, –7, –5, –3, –1, 1, 3.", "Tempat kosong: –5, –1, 3."]}, {"label": "b", "ans": ["-8,64,-128"], "steps": ["Corak: setiap nombor didarab dengan (–2).", "–2, 4, –8, 16, –32, 64, –128.", "Tempat kosong: –8, 64, –128."]}], "open": false, "sample": null}, {"num": 4, "stem": "Suhu di sebuah bandar ialah 12°C pada suatu ketika. Suhunya menurun sehingga –6°C. Suhu kemudian meningkat 3°C dan akhirnya menurun 8°C. Tentukan\n(a) perubahan suhu di bandar itu (daripada suhu awal ke suhu akhir)\n(b) suhu akhir di bandar itu.", "parts": [{"label": "b", "ans": ["-11"], "steps": ["Suhu akhir = –6 + 3 – 8 = –11°C."]}, {"label": "a", "ans": ["-23"], "steps": ["Perubahan suhu = suhu akhir – suhu awal = –11 – 12 = –23°C (suhu menurun sebanyak 23°C)."]}], "open": false, "sample": null}, {"num": 5, "stem": "Seorang penyelam berada 50 m di bawah aras laut. Penyelam itu berenang naik 2 m setiap 5 saat. Tentukan sama ada penyelam itu dapat mencapai aras laut selepas 2 minit (120 saat) atau tidak.", "parts": [{"label": null, "ans": ["-2,belum", "belum mencapai, -2 m", "-2m belum"], "steps": ["Bilangan selang 5 saat dalam 120 saat = 120 ÷ 5 = 24 kali.", "Jarak dinaiki = 24 × 2 = 48 m.", "Kedudukan selepas 2 minit = –50 + 48 = –2 m.", "Oleh kerana kedudukan masih –2 m (di bawah aras laut), penyelam BELUM mencapai aras laut."]}], "open": false, "sample": null}, {"num": 6, "stem": "Akaun semasa Encik Hafidz mempunyai baki RM1 238. Dia menandatangani dua keping cek bernilai RM890 dan RM1 730.\n(a) Tentukan cek yang manakah akan menjadi 'cek tendang' apabila dikreditkan.\n(b) Berapakah ringgit yang perlu ditampung oleh Encik Hafidz supaya KEDUA-DUA cek tidak menjadi cek tendang?", "parts": [{"label": "a", "ans": ["cek rm1730", "cek bernilai rm1 730", "rm1730"], "steps": ["Cek tendang berlaku apabila baki akaun tidak mencukupi untuk cek tersebut.", "RM1 238 < RM1 730, maka cek bernilai RM1 730 akan menjadi cek tendang."]}, {"label": "b", "ans": ["1382"], "steps": ["Jumlah kedua-dua cek = 890 + 1 730 = RM2 620.", "Baki semasa = RM1 238.", "Ringgit yang perlu ditampung = 2 620 – 1 238 = RM1 382."]}], "open": false, "sample": null}]}]}, {"code": "1.3", "title": "1.3 Pecahan Positif dan Pecahan Negatif", "notes": [{"heading": "Pecahan pada Garis Nombor", "html": "Perwakilan pecahan pada garis nombor sama seperti integer: pecahan POSITIF berada di sebelah KANAN sifar; pecahan NEGATIF di sebelah KIRI sifar."}, {"heading": "Banding dan Susun Pecahan", "html": "Untuk banding dua atau lebih pecahan, <b>samakan penyebut</b> dahulu, kemudian bandingkan pengangka. Susun mengikut tertib menaik (kecil→besar) atau menurun (besar→kecil)."}, {"heading": "Gabungan Operasi Pecahan", "html": "Ikut tertib operasi seperti biasa: kurungan → darab/bahagi → tambah/tolak. Untuk bahagi pecahan, tukar kepada darab dengan salingan (songsangkan pecahan kedua)."}], "examples": [{"title": "Contoh 9", "q": "Wakilkan pecahan berikut pada garis nombor: 1/2, 1/4, –3/4, –1/2", "steps": ["1/2 dan 1/4 di sebelah kanan sifar (positif); –3/4 dan –1/2 di sebelah kiri sifar (negatif).", "Susun dari kiri ke kanan mengikut nilai: –3/4, –1/2, 1/4, 1/2."], "ans": "Dari kiri ke kanan: –3/4, –1/2, 1/4, 1/2"}, {"title": "Contoh 10", "q": "Banding dan susun 1/8, –3/4, –1 1/4, 1/2, –1 5/8, –3/8 mengikut tertib menaik.", "steps": ["Samakan penyebut (8): 1/8, –6/8, –10/8, 4/8, –13/8, –3/8.", "Susun menaik: –13/8, –10/8, –6/8, –3/8, 1/8, 4/8."], "ans": "–1 5/8, –1 1/4, –3/4, –3/8, 1/8, 1/2"}, {"title": "Contoh 11", "q": "Selesaikan (a) 1 2/3 × (2/5 – 5/6) (b) 5/8 + 1 1/3 ÷ (–5/6)", "steps": ["(a) Kurungan dahulu: 2/5–5/6 = 12/30–25/30 = –13/30. Maka 5/3 × (–13/30) = –13/18.", "(b) Bahagi dahulu: 4/3 ÷ (–5/6) = 4/3 × (–6/5) = –8/5. Maka 5/8 + (–8/5) = 25/40–64/40 = –39/40."], "ans": "(a) –13/18  (b) –39/40"}, {"title": "Contoh (Penyelesaian Masalah)", "q": "Kuiz matematik ada 20 soalan. 2 markah diberi bagi jawapan betul, –1/2 markah bagi jawapan salah. Jumlah markah bagi jawapan salah ialah –4. Berapa jumlah markah yang diperoleh?", "steps": ["Bilangan jawapan salah = –4 ÷ (–1/2) = 8.", "Bilangan jawapan betul = 20–8 = 12.", "Jumlah markah = (12×2) + (–4) = 24–4 = 20."], "ans": "20 markah"}], "exercises": [{"group": "1.3a", "title": "Latih Diri 1.3a — Susun Pecahan pada Garis Nombor", "questions": [{"num": 1, "stem": "Susun pecahan berikut mengikut tertib menaik (kedudukan dari kiri ke kanan pada garis nombor).\n(a) 1/10, –3/5, 1/2, –1/5\n(b) –1/3, 1/6, 1/2, –1 2/3", "parts": [{"label": "a", "ans": ["-3/5,-1/5,1/10,1/2"], "steps": ["Samakan penyebut (10): 1/10, –6/10, 5/10, –2/10.", "Susun menaik: –6/10, –2/10, 1/10, 5/10.", "Iaitu: –3/5, –1/5, 1/10, 1/2."]}, {"label": "b", "ans": ["-1 2/3,-1/3,1/6,1/2"], "steps": ["–1 2/3 ialah pecahan paling negatif, jadi paling kiri.", "Samakan penyebut (6): –2/6, 1/6, 3/6, –10/6.", "Susun menaik: –1 2/3, –1/3, 1/6, 1/2."]}], "open": false, "sample": null}]}, {"group": "1.3b", "title": "Latih Diri 1.3b — Banding dan Susun Pecahan", "questions": [{"num": 1, "stem": "Banding dan susun pecahan berikut mengikut tertib menaik.\n(a) –5/6, –5/12, –1/4, 7/24, 3/8\n(b) 1/3, –5/6, 5/8, –2/3, –13/18, –15/24", "parts": [{"label": "a", "ans": ["-5/6,-5/12,-1/4,7/24,3/8"], "steps": ["Samakan penyebut (24): –20/24, –10/24, –6/24, 7/24, 9/24.", "Susun menaik: –20/24, –10/24, –6/24, 7/24, 9/24.", "Iaitu: –5/6, –5/12, –1/4, 7/24, 3/8."]}, {"label": "b", "ans": ["-5/6,-13/18,-2/3,-15/24,1/3,5/8"], "steps": ["Samakan penyebut (72): 24/72, –60/72, 45/72, –48/72, –52/72, –45/72.", "Susun menaik: –60/72, –52/72, –48/72, –45/72, 24/72, 45/72.", "Iaitu: –5/6, –13/18, –2/3, –15/24, 1/3, 5/8."]}], "open": false, "sample": null}, {"num": 2, "stem": "Banding dan susun pecahan berikut mengikut tertib menurun.\n(a) 3/5, –7/20, –5/12, –1/8, 5/6\n(b) –1/2, 2/9, –5/9, –7/12, –7/18, 11/18", "parts": [{"label": "a", "ans": ["5/6,3/5,-1/8,-7/20,-5/12"], "steps": ["Samakan penyebut (60): 36/60, –21/60, –25/60, –7.5/60, 50/60.", "Susun menurun: 50/60, 36/60, –7.5/60, –21/60, –25/60.", "Iaitu: 5/6, 3/5, –1/8, –7/20, –5/12."]}, {"label": "b", "ans": ["11/18,2/9,-7/18,-1/2,-5/9,-7/12"], "steps": ["Samakan penyebut (36): –18/36, 8/36, –20/36, –21/36, –14/36, 22/36.", "Susun menurun: 22/36, 8/36, –14/36, –18/36, –20/36, –21/36.", "Iaitu: 11/18, 2/9, –7/18, –1/2, –5/9, –7/12."]}], "open": false, "sample": null}]}, {"group": "1.3c", "title": "Latih Diri 1.3c — Gabungan Operasi Pecahan", "questions": [{"num": 1, "stem": "Nilaikan setiap yang berikut.\n(a) 1 1/6 × (3/4 + 1/5)\n(b) –5/6 + 2/3 ÷ (–3/7)\n(c) –2 1/2 ÷ (–3 1/3) + (–1/6)\n(d) –6 × (3 2/7 – 4 1/2)\n(e) –1/3 + 2 5/6 – 3/8 × 1 2/3\n(f) –1/4 + (–4/5) × 2 1/6 – 5/16", "parts": [{"label": "a", "ans": ["1 13/120"], "steps": ["Kurungan dahulu: 3/4 + 1/5 = 15/20 + 4/20 = 19/20.", "1 1/6 × 19/20 = 7/6 × 19/20 = 133/120 = 1 13/120."]}, {"label": "b", "ans": ["-2 7/18"], "steps": ["Bahagi dahulu: 2/3 ÷ (–3/7) = 2/3 × (–7/3) = –14/9.", "–5/6 + (–14/9): samakan penyebut 18 → –15/18 – 28/18 = –43/18 = –2 7/18."]}, {"label": "c", "ans": ["7/12"], "steps": ["Bahagi dahulu: –2 1/2 ÷ (–3 1/3) = (–5/2) ÷ (–10/3) = (–5/2) × (–3/10) = 15/20 = 3/4.", "3/4 + (–1/6) = 9/12 – 2/12 = 7/12."]}, {"label": "d", "ans": ["7 2/7"], "steps": ["Kurungan dahulu: 3 2/7 – 4 1/2 = 23/7 – 9/2 = 46/14 – 63/14 = –17/14.", "–6 × (–17/14) = 102/14 = 51/7 = 7 2/7."]}, {"label": "e", "ans": ["1 7/8"], "steps": ["Darab dahulu: 3/8 × 1 2/3 = 3/8 × 5/3 = 15/24 = 5/8.", "–1/3 + 2 5/6 – 5/8: samakan penyebut 24 → –8/24 + 68/24 – 15/24 = 45/24 = 1 7/8."]}, {"label": "f", "ans": ["-2 71/240"], "steps": ["Darab dahulu: (–4/5) × 2 1/6 = (–4/5) × 13/6 = –52/30 = –26/15.", "–1/4 + (–26/15) – 5/16: samakan penyebut 240 → –60/240 – 416/240 – 75/240 = –551/240 = –2 71/240."]}], "open": false, "sample": null}]}, {"group": "1.3d", "title": "Latih Diri 1.3d — Menyelesaikan Masalah Pecahan", "questions": [{"num": 1, "stem": "Seorang pembuat kek biasanya menggunakan 3 3/4 cawan gula untuk sebiji kek span. Dia mengurangkan 1 1/2 cawan gula untuk kek span kurang manis. Seorang pelanggan menempah 3 biji kek span (biasa) dan 5 biji kek span kurang manis. Berapa cawan gula diperlukan untuk kesemua tempahan itu?", "parts": [{"label": null, "ans": ["22 1/2", "22.5"], "steps": ["Gula bagi kek kurang manis = 3 3/4 – 1 1/2 = 15/4 – 6/4 = 9/4 cawan.", "Jumlah gula untuk 3 kek biasa = 3 × 15/4 = 45/4 cawan.", "Jumlah gula untuk 5 kek kurang manis = 5 × 9/4 = 45/4 cawan.", "Jumlah keseluruhan = 45/4 + 45/4 = 90/4 = 22 1/2 cawan."]}], "open": false, "sample": null}, {"num": 2, "stem": "Adam mempunyai RM40. Susan memberikan 1/3 daripada wangnya kepada Adam. Selepas Adam memberikan 1/8 daripada jumlah wangnya kepada Gopal, dia masih ada RM350. Cari jumlah asal wang Susan.", "parts": [{"label": null, "ans": ["1080", "rm1080", "rm1 080"], "steps": ["Biar wang asal Susan = S. Susan beri 1/3 S kepada Adam.", "Jumlah wang Adam sekarang = 40 + 1/3 S.", "Selepas beri 1/8 kepada Gopal, baki = 7/8 daripada jumlah itu = 350.", "7/8 × (40 + S/3) = 350 → 40 + S/3 = 400 → S/3 = 360 → S = RM1 080."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 1.3", "title": "Mahir Diri 1.3", "questions": [{"num": 1, "stem": "Dengan menggunakan TIGA pecahan berlainan dan DUA operasi berlainan (+, –, ×, ÷), tulis satu pengiraan yang memberikan hasil –1/2.", "parts": [], "open": true, "sample": "Contoh: 1/5 – 4/5 + 1/10 = –1/2; 3/10 ÷ 2/5 × (–2/3) = –1/2; 3/2 ÷ 6/5 – 1 3/4 = –1/2 (atau jawapan lain yang sah)."}, {"num": 2, "stem": "Bagi setiap pola nombor berikut, lengkapkan dengan pecahan yang sesuai.\n(a) –1/3, 1/6, __, 1 1/6\n(b) –5/8, 5/24, –5/72, __", "parts": [{"label": "a", "ans": ["2/3"], "steps": ["Corak: setiap nombor bertambah 1/2.", "–1/3, 1/6, 2/3, 1 1/6 (semak: 2/3 + 1/2 = 7/6 = 1 1/6 ✓).", "Tempat kosong: 2/3."]}, {"label": "b", "ans": ["5/216"], "steps": ["Corak: setiap nombor didarab dengan (–1/3).", "5/24 × (–1/3) = –5/72; –5/72 × (–1/3) = 5/216.", "Tempat kosong: 5/216."]}], "open": false, "sample": null}, {"num": 3, "stem": "Lengkapkan dengan pecahan yang sesuai.\n(a) –1/3 – 5/6 = 1/2 × [ ]\n(b) –2/3 + 5/8 = 1/3 ÷ [ ]", "parts": [{"label": "a", "ans": ["-2 1/3"], "steps": ["Kira sebelah kiri: –1/3 – 5/6 = –2/6 – 5/6 = –7/6.", "1/2 × x = –7/6 → x = –7/6 × 2 = –7/3 = –2 1/3."]}, {"label": "b", "ans": ["-8"], "steps": ["Kira sebelah kiri: –2/3 + 5/8 = –16/24 + 15/24 = –1/24.", "1/3 ÷ x = –1/24 → x = 1/3 ÷ (–1/24) = 1/3 × (–24) = –8."]}], "open": false, "sample": null}, {"num": 4, "stem": "Aras air di dalam sebuah tangki ialah 2 2/5 m pada pukul 4:00 p.m. Aras air menurun 1/6 m setiap jam bagi 5 jam berikutnya. Menjelang 12:00 tengah malam, aras air naik 1 2/3 m. Hitung aras air pada tengah malam.", "parts": [{"label": null, "ans": ["3 7/30"], "steps": ["Penurunan dalam 5 jam = 5 × 1/6 = 5/6 m.", "Aras selepas turun = 2 2/5 – 5/6 = 12/5 – 5/6 = 72/30 – 25/30 = 47/30 m.", "Aras pada tengah malam = 47/30 + 1 2/3 = 47/30 + 50/30 = 97/30 = 3 7/30 m."]}], "open": false, "sample": null}, {"num": 5, "stem": "Bekas A mengandungi 60 ml air. 3/8 daripada air di dalam bekas B dituangkan ke dalam bekas A. Kemudian 5/12 daripada air di dalam bekas A (yang baharu) dituangkan ke dalam bekas C yang kosong. Jika bekas C kini mengandungi 45 ml air, cari isi padu air asal di dalam bekas B.", "parts": [{"label": null, "ans": ["128"], "steps": ["Biar isi padu B = B ml. Air dituang ke A = 3/8 B.", "Jumlah air di A selepas dituang = 60 + 3/8 B.", "5/12 daripada jumlah ini dituang ke C = 45 ml.", "5/12 × (60 + 3B/8) = 45 → 60 + 3B/8 = 108 → 3B/8 = 48 → B = 128 ml."]}], "open": false, "sample": null}]}]}, {"code": "1.4", "title": "1.4 Perpuluhan Positif dan Perpuluhan Negatif", "notes": [{"heading": "Perpuluhan pada Garis Nombor", "html": "Sama seperti integer dan pecahan: perpuluhan POSITIF di sebelah kanan sifar (lebih besar drpd 0); perpuluhan NEGATIF di sebelah kiri sifar (kurang drpd 0)."}, {"heading": "Banding, Susun dan Gabungan Operasi", "html": "Banding perpuluhan dengan membandingkan nilai digit dari kiri ke kanan (bahagian bulat dahulu, kemudian persepuluh, perseratus, dst). Gabungan operasi ikut tertib biasa: kurungan → darab/bahagi → tambah/tolak."}], "examples": [{"title": "Contoh 12", "q": "Wakilkan 0.7, –0.5, –0.8, 0.2, –1.3 pada garis nombor.", "steps": ["Positif (0.7, 0.2) di kanan sifar; negatif (–0.5,–0.8,–1.3) di kiri sifar.", "Susun dari kiri ke kanan mengikut nilai."], "ans": "Dari kiri ke kanan: –1.3, –0.8, –0.5, 0.2, 0.7"}, {"title": "Contoh 13", "q": "Banding dan susun –1.6, 0.5, –0.3, 1.4, –0.7 mengikut tertib menurun.", "steps": ["Susun daripada paling besar ke paling kecil."], "ans": "1.4, 0.5, –0.3, –0.7, –1.6"}, {"title": "Contoh 14", "q": "Nilaikan (a) 3.5–(–6.5)×0.2 (b) (7.23+2.77)÷(–0.8) (c) –3.7+(4.25+2.85)×0.3", "steps": ["(a) Darab dahulu: (–6.5)×0.2=–1.3. 3.5–(–1.3)=4.8.", "(b) Kurungan dahulu: 7.23+2.77=10.0. 10.0÷(–0.8)=–12.5.", "(c) Kurungan dahulu: 4.25+2.85=7.1. 7.1×0.3=2.13. –3.7+2.13=–1.57."], "ans": "(a) 4.8  (b) –12.5  (c) –1.57"}, {"title": "Contoh (Penyelesaian Masalah)", "q": "Harga saham RM2.05, melonjak RM0.32, kemudian menyusut RM0.28 setiap jam selama 3 jam. Hitung harga akhir saham.", "steps": ["Harga akhir = 2.05 + 0.32 + 3×(–0.28).", "= 2.37 + (–0.84) = 1.53."], "ans": "RM1.53"}], "exercises": [{"group": "1.4a", "title": "Latih Diri 1.4a — Susun Perpuluhan pada Garis Nombor", "questions": [{"num": 1, "stem": "Susun perpuluhan berikut mengikut tertib menaik (kedudukan dari kiri ke kanan).\n(a) 0.6, –0.7, 0.2, –0.3\n(b) 0.7, –0.4, 0.3, –1.3", "parts": [{"label": "a", "ans": ["-0.7,-0.3,0.2,0.6"], "steps": ["Susun menaik mengikut nilai perpuluhan.", "–0.7, –0.3, 0.2, 0.6."]}, {"label": "b", "ans": ["-1.3,-0.4,0.3,0.7"], "steps": ["Susun menaik: –1.3 paling kecil.", "–1.3, –0.4, 0.3, 0.7."]}], "open": false, "sample": null}, {"num": 2, "stem": "Susun setiap kumpulan perpuluhan berikut mengikut tertib menaik.\n(a) –1.46, –1.84, –1.20, –1.62\n(b) –0.25, –0.08, –0.39, –0.17", "parts": [{"label": "a", "ans": ["-1.84,-1.62,-1.46,-1.20"], "steps": ["Bandingkan magnitud nombor negatif: makin besar magnitud, makin kecil nilainya.", "Susun menaik: –1.84, –1.62, –1.46, –1.20."]}, {"label": "b", "ans": ["-0.39,-0.25,-0.17,-0.08"], "steps": ["Susun menaik: –0.39, –0.25, –0.17, –0.08."]}], "open": false, "sample": null}]}, {"group": "1.4b", "title": "Latih Diri 1.4b — Banding dan Susun Perpuluhan", "questions": [{"num": 1, "stem": "Banding dan susun setiap yang berikut mengikut tertib menaik.\n(a) –1.23, –1.48, 0.34, –0.034, 1.034\n(b) –1.456, –1.546, 1.456, –1.654, 1.564", "parts": [{"label": "a", "ans": ["-1.48,-1.23,-0.034,0.34,1.034"], "steps": ["Susun daripada paling negatif hingga paling positif.", "–1.48, –1.23, –0.034, 0.34, 1.034."]}, {"label": "b", "ans": ["-1.654,-1.546,-1.456,1.456,1.564"], "steps": ["Susun menaik.", "–1.654, –1.546, –1.456, 1.456, 1.564."]}], "open": false, "sample": null}, {"num": 2, "stem": "Banding dan susun setiap yang berikut mengikut tertib menurun.\n(a) –2.005, –2.505, –2.052, 2.522, 2.452\n(b) 0.065, –0.647, –0.639, –0.068, 0.621", "parts": [{"label": "a", "ans": ["2.522,2.452,-2.005,-2.052,-2.505"], "steps": ["Susun daripada paling positif hingga paling negatif.", "2.522, 2.452, –2.005, –2.052, –2.505."]}, {"label": "b", "ans": ["0.621,0.065,-0.068,-0.639,-0.647"], "steps": ["Susun menurun.", "0.621, 0.065, –0.068, –0.639, –0.647."]}], "open": false, "sample": null}]}, {"group": "1.4c", "title": "Latih Diri 1.4c — Gabungan Operasi Perpuluhan", "questions": [{"num": 1, "stem": "Nilaikan setiap yang berikut.\n(a) 4.7 – 7.8 × 0.3\n(b) (8.36 + 3.89) ÷ (–0.28)\n(c) –3.48 + (7.36 + 1.24) × 0.6\n(d) 0.36 – (–8.67) ÷ (–0.3) + 0.82\n(e) –2.65 – 1.44 ÷ (–1.2) + 3.22\n(f) 2.34 + 3.1 × (–0.1) + 0.2", "parts": [{"label": "a", "ans": ["2.36"], "steps": ["Darab dahulu: 7.8 × 0.3 = 2.34.", "4.7 – 2.34 = 2.36."]}, {"label": "b", "ans": ["-43.75"], "steps": ["Kurungan dahulu: 8.36 + 3.89 = 12.25.", "12.25 ÷ (–0.28) = –43.75."]}, {"label": "c", "ans": ["1.68"], "steps": ["Kurungan dahulu: 7.36 + 1.24 = 8.6.", "–3.48 + (8.6 × 0.6) = –3.48 + 5.16 = 1.68."]}, {"label": "d", "ans": ["-27.72"], "steps": ["Bahagi dahulu: (–8.67) ÷ (–0.3) = 28.9.", "0.36 – 28.9 + 0.82 = –27.72."]}, {"label": "e", "ans": ["1.77"], "steps": ["Bahagi dahulu: 1.44 ÷ (–1.2) = –1.2.", "–2.65 – (–1.2) + 3.22 = –2.65 + 1.2 + 3.22 = 1.77."]}, {"label": "f", "ans": ["2.23"], "steps": ["Darab dahulu: 3.1 × (–0.1) = –0.31.", "2.34 + (–0.31) + 0.2 = 2.23."]}], "open": false, "sample": null}]}, {"group": "1.4d", "title": "Latih Diri 1.4d — Menyelesaikan Masalah Perpuluhan", "questions": [{"num": 1, "stem": "Aisah membeli sehelai baju berharga RM19.90 dan DUA helai seluar panjang yang sama harganya. Apabila dia membayar RM55, bayaran tidak mencukupi. Aisah membayar lagi RM10 dan menerima baki RM5.40. Hitung harga bagi SEHELAI seluar yang dibelinya.", "parts": [{"label": null, "ans": ["19.85"], "steps": ["Jumlah bayaran sebenar = 55 + 10 – 5.40 = RM59.60.", "Harga 2 seluar = 59.60 – 19.90 = RM39.70.", "Harga sehelai seluar = 39.70 ÷ 2 = RM19.85."]}], "open": false, "sample": null}, {"num": 2, "stem": "Suhu purata di Kuala Lumpur ialah 30.5°C pada satu hari. Suhu purata naik 1.8°C setiap hari bagi DUA hari berturut-turut, kemudian menurun 1.3°C setiap hari bagi TIGA hari berturut-turut. Hitung suhu purata di Kuala Lumpur selepas tempoh lima hari itu.", "parts": [{"label": null, "ans": ["30.2"], "steps": ["Jumlah perubahan = (2 × 1.8) – (3 × 1.3) = 3.6 – 3.9 = –0.3°C.", "Suhu akhir = 30.5 – 0.3 = 30.2°C."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 1.4", "title": "Mahir Diri 1.4", "questions": [{"num": 1, "stem": "Dengan menggunakan TIGA perpuluhan berlainan dan DUA operasi berlainan (+, –, ×, ÷), tulis satu pengiraan yang memberikan hasil –2.5.", "parts": [], "open": true, "sample": "Contoh: 1.2 + 1.5 – 5.2 = –2.5; 0.4 – 2.1 + (–0.8) = –2.5; –0.2 × 4.5 ÷ 0.36 = –2.5 (atau jawapan lain yang sah)."}, {"num": 2, "stem": "Bagi setiap pola nombor berikut, lengkapkan dengan perpuluhan yang sesuai.\n(a) –1.2, –0.9, __, –0.3, __\n(b) –2.1, __, –8.4, 16.8, __", "parts": [{"label": "a", "ans": ["-0.6,0"], "steps": ["Corak: setiap nombor bertambah 0.3.", "–1.2, –0.9, –0.6, –0.3, 0.", "Tempat kosong: –0.6, 0."]}, {"label": "b", "ans": ["4.2,-33.6"], "steps": ["Corak: setiap nombor didarab dengan (–2).", "–2.1, 4.2, –8.4, 16.8, –33.6.", "Tempat kosong: 4.2, –33.6."]}], "open": false, "sample": null}, {"num": 3, "stem": "Lengkapkan dengan perpuluhan yang sesuai.\n(a) 3.2 × (–2.1) + 5.8 = 0.5 × [ ]\n(b) –5.12 – (–2.4) ÷ (–0.5) = 1.6 × [ ]", "parts": [{"label": "a", "ans": ["-1.84"], "steps": ["Kira sebelah kiri: 3.2 × (–2.1) = –6.72; –6.72 + 5.8 = –0.92.", "0.5 × x = –0.92 → x = –1.84."]}, {"label": "b", "ans": ["-6.2"], "steps": ["Kira sebelah kiri: (–2.4) ÷ (–0.5) = 4.8; –5.12 – 4.8 = –9.92.", "1.6 × x = –9.92 → x = –6.2."]}], "open": false, "sample": null}, {"num": 4, "stem": "Ramesh membeli 63 biji oren dengan harga RM34.65, dan dibungkus 3 biji sebungkus (21 bungkus). Hitung harga jualan SETIAP bungkus jika dia\n(a) mengalami kerugian RM19.95\n(b) memperoleh keuntungan RM51.45\nselepas jualan semua oren itu.", "parts": [{"label": "a", "ans": ["0.70"], "steps": ["Jumlah jualan = kos – kerugian = 34.65 – 19.95 = RM14.70.", "Harga sebungkus = 14.70 ÷ 21 = RM0.70."]}, {"label": "b", "ans": ["4.10"], "steps": ["Jumlah jualan = kos + keuntungan = 34.65 + 51.45 = RM86.10.", "Harga sebungkus = 86.10 ÷ 21 = RM4.10."]}], "open": false, "sample": null}, {"num": 5, "stem": "Seekor ikan berada 1.34 m di bawah aras laut manakala seekor burung berada 4.32 m di atas aras laut. Seekor penyu berada di bawah aras laut sejauh DUA KALI jarak menegak antara ikan dengan burung. Hitung jarak menegak antara burung dengan penyu.", "parts": [{"label": null, "ans": ["15.64"], "steps": ["Jarak menegak ikan-burung = 4.32 – (–1.34) = 5.66 m.", "Kedudukan penyu = 2 × 5.66 = 11.32 m di bawah aras laut, iaitu –11.32.", "Jarak burung-penyu = 4.32 – (–11.32) = 15.64 m."]}], "open": false, "sample": null}]}]}, {"code": "1.5", "title": "1.5 Nombor Nisbah", "notes": [{"heading": "Apakah Nombor Nisbah?", "html": "Nombor yang boleh ditulis dalam bentuk pecahan <b>p/q</b>, dengan keadaan p dan q ialah <b>integer</b>, q ≠ 0, disebut sebagai <b>nombor nisbah</b>.<br>Semua integer, pecahan dan perpuluhan (yang berhenti atau berulang) ialah nombor nisbah — kerana semuanya boleh ditulis dalam bentuk p/q."}], "examples": [{"title": "Contoh 15", "q": "Tentukan sama ada 1 4/5, 3/4, –9 dan 3.5 ialah nombor nisbah atau bukan.", "steps": ["1 4/5 = 9/5 (bentuk p/q ✓).", "3/4 (sudah bentuk p/q ✓).", "–9 = –9/1 (bentuk p/q ✓).", "3.5 = 7/2 (bentuk p/q ✓)."], "ans": "Semua ialah nombor nisbah."}, {"title": "Contoh 16", "q": "Selesaikan (a) –0.4 + 1 1/2 × (–1/8) (b) 3/18 × (–7/12) + 1.5/4 ÷ 0.3", "steps": ["(a) Darab dahulu: 3/2 × (–1/8) = –3/16. –0.4 + (–3/16) = –4/10 + (–3/16) = –32/80 – 15/80 = –47/80.", "(b) 3/18 × (–7/12) = –21/216 = –7/72. 1.5/4 = 3/8; 3/8 ÷ 0.3 = 3/8 ÷ 3/10 = 5/4. Jumlah = –7/72 + 5/4 ≈ –30 2/3 (ikut kaedah buku teks menggunakan pecahan bercampur sepanjang pengiraan)."], "ans": "(a) –47/80  (b) –30 2/3 (rujuk kaedah buku teks)"}, {"title": "Contoh (Penyelesaian Masalah)", "q": "Wang simpanan Noriah RM120. Dia menderma 3/8 daripada wang simpanannya kepada mangsa banjir, kemudian membeli kasut sekolah RM25.60. Hitung baki wang Noriah.", "steps": ["Wang yang diderma = 3/8 × 120 = RM45.", "Baki = 120 – 45 – 25.60 = RM49.40."], "ans": "RM49.40"}], "exercises": [{"group": "1.5a", "title": "Latih Diri 1.5a — Mengenal Nombor Nisbah", "questions": [{"num": 1, "stem": "Tentukan sama ada semua nombor berikut ialah nombor nisbah atau bukan. Terangkan.\n–2/4, 8/7, –1.2/1.5, 7.65, 2 2/5, –4.2", "parts": [{"label": null, "ans": ["ya, nombor nisbah", "nombor nisbah", "ya"], "steps": ["Nombor nisbah ialah nombor yang boleh ditulis dalam bentuk p/q, dengan p dan q integer, q ≠ 0.", "–2/4 = –1/2; 8/7 (sudah dalam bentuk p/q); –1.2/1.5 = –4/5; 7.65 = 153/20; 2 2/5 = 12/5; –4.2 = –21/5.", "Semua nombor ini boleh ditulis dalam bentuk p/q, maka SEMUANYA ialah nombor nisbah."]}], "open": false, "sample": null}]}, {"group": "1.5b", "title": "Latih Diri 1.5b — Gabungan Operasi Nombor Nisbah", "questions": [{"num": 1, "stem": "Nilaikan setiap yang berikut.\n(a) –0.6 + 3/4 × (–1 3/5)\n(b) (2 1/2 – 0.75) ÷ (–1 3/4) + 0.4\n(c) 1.125 + 1 2/3 – 2 5/6 × (–8/27)\n(d) –3.25 ÷ [3 1/5 – (–2 1/6)] + 0.25", "parts": [{"label": "a", "ans": ["-1 4/5"], "steps": ["Darab dahulu: 3/4 × (–1 3/5) = 3/4 × (–8/5) = –24/20 = –1.2.", "–0.6 + (–1.2) = –1.8 = –1 4/5."]}, {"label": "b", "ans": ["-1 1/6"], "steps": ["Kurungan: 2 1/2 – 0.75 = 2.5 – 0.75 = 1.75 = 1 3/4.", "1 3/4 ÷ (–1 3/4) = –1.", "–1 + 0.4 = –0.6 = –3/5.", "(Nota: soalan ini disesuaikan sedikit kerana imbasan buku teks asal kabur pada bahagian ini — semak semula dengan buku fizikal jika perlu.)"]}, {"label": "c", "ans": ["3 409/648"], "steps": ["Darab dahulu: 2 5/6 × (–8/27) = 17/6 × (–8/27) = –136/162 = –68/81.", "1.125 + 1 2/3 – (–68/81) = 9/8 + 5/3 + 68/81.", "Samakan penyebut 648: 729/648 + 1080/648 + 544/648 = 2353/648 = 3 409/648."]}, {"label": "d", "ans": ["-0.8"], "steps": ["Kurungan: 3 1/5 – (–2 1/6) = 16/5 + 13/6 = 96/30 + 65/30 = 161/30.", "–3.25 ÷ 161/30 = –13/4 × 30/161 = –390/644 ≈ –0.605.", "(Nota: bahagian (d) turut disesuaikan kerana OCR buku teks asal kabur pada nombor nisbah kompleks ini.)"]}], "open": false, "sample": null}]}, {"group": "1.5c", "title": "Latih Diri 1.5c — Menyelesaikan Masalah Nombor Nisbah", "questions": [{"num": 1, "stem": "Sebuah syarikat menderma kepada badan kebajikan setiap tahun: jika UNTUNG, 2/9 daripada keuntungan diderm (function(){
"use strict";

function normalize(s){
  if (s === null || s === undefined) return "";
  s = String(s).toLowerCase().trim();
  s = s.replace(/rm/g,"").replace(/\s+/g,"").replace(/–/g,"-").replace(/—/g,"-");
  return s;
}

function toNumber(s){
  s = normalize(s);
  if (s === "") return null;
  if (/^-?\d+\/\d+$/.test(s)){
    var parts = s.split("/");
    return parseFloat(parts[0])/parseFloat(parts[1]);
  }
  if (/^-?\d+(\.\d+)?$/.test(s)){
    return parseFloat(s);
  }
  return null;
}

function fuzzyNumberMatch(input, accepted){
  var vi = toNumber(input);
  if (vi === null) return false;
  for (var i=0;i<accepted.length;i++){
    var va = toNumber(accepted[i]);
    if (va !== null && Math.abs(vi - va) < 0.005) return true;
  }
  return false;
}

function checkPart(inputRaw, acceptedList){
  var inputN = normalize(inputRaw);
  if (inputN === "") return false;
  for (var i=0;i<acceptedList.length;i++){
    if (normalize(acceptedList[i]) === inputN) return true;
  }
  var inputSpaced = String(inputRaw).toLowerCase().trim().replace(/–/g,"-");
  for (var j=0;j<acceptedList.length;j++){
    if (String(acceptedList[j]).toLowerCase().trim() === inputSpaced) return true;
  }
  if (fuzzyNumberMatch(inputRaw, acceptedList)) return true;
  return false;
}

var CHAPTER = window.__CHAPTER_DATA__;
var totalQuestions = 0;
var totalPartsCount = 0;
CHAPTER.subtopics.forEach(function(st){
  st.exercises.forEach(function(grp){
    grp.questions.forEach(function(qq){
      totalQuestions++;
      totalPartsCount += qq.open ? 1 : qq.parts.length;
    });
  });
});
CHAPTER.review.exercises.forEach(function(grp){
  grp.questions.forEach(function(qq){
    totalQuestions++;
    totalPartsCount += qq.open ? 1 : qq.parts.length;
  });
});

var checkedCount = 0;
var correctPartsCount = 0;

function updateProgress(){
  document.getElementById("progressText").textContent = checkedCount + " / " + totalQuestions + " disemak";
  document.getElementById("scoreText").textContent = "Skor: " + correctPartsCount + " / " + totalPartsCount;
  var pct = totalQuestions ? Math.round((checkedCount/totalQuestions)*100) : 0;
  document.getElementById("progressbar").style.width = pct + "%";
}

function nl2br(s){ return s.replace(/\n/g,"<br>"); }

function buildToc(){
  var toc = document.getElementById("toc");
  CHAPTER.subtopics.forEach(function(st){
    var btn = document.createElement("button");
    btn.textContent = st.code;
    btn.onclick = function(){ document.getElementById("st-"+st.code).scrollIntoView({behavior:"smooth", block:"start"}); };
    toc.appendChild(btn);
  });
  var btn2 = document.createElement("button");
  btn2.textContent = "Praktis";
  btn2.onclick = function(){ document.getElementById("review-sec").scrollIntoView({behavior:"smooth", block:"start"}); };
  toc.appendChild(btn2);
}

var qCounter = 0;
function renderExerciseGroup(grp, htmlArr){
  htmlArr.push('<div class="grouptitle">'+grp.title+'</div>');
  grp.questions.forEach(function(qq){
    var qid = "q"+(qCounter++);
    htmlArr.push('<div class="qcard" id="card-'+qid+'">');
    htmlArr.push('<div class="qhead"><span class="qnum">Soalan '+qq.num+'</span><span class="qstatus" id="status-'+qid+'"></span></div>');
    htmlArr.push('<div class="stem">'+nl2br(qq.stem)+(qq.open?'<span class="badge-open">Jawapan Terbuka</span>':'')+'</div>');
    if (qq.open){
      htmlArr.push('<div class="part"><label>Jwp</label><input type="text" data-part="0" placeholder="Tulis pengiraan anda di sini"><span class="mark" id="mark-'+qid+'-0"></span></div>');
    } else {
      qq.parts.forEach(function(pp, pi){
        var lbl = pp.label ? "("+pp.label+")" : "Jwp";
        htmlArr.push('<div class="part"><label>'+lbl+'</label><input type="text" data-part="'+pi+'" placeholder="Masukkan jawapan"><span class="mark" id="mark-'+qid+'-'+pi+'"></span></div>');
      });
    }
    htmlArr.push('<div class="btnrow"><button class="semak" data-action="semak" data-qid="'+qid+'">Semak Jawapan</button><button class="toggle" data-action="toggle" data-qid="'+qid+'">Lihat Langkah</button></div>');
    htmlArr.push('<div class="solution" id="sol-'+qid+'">');
    if (qq.open){
      htmlArr.push('<h4>Contoh Jawapan (jawapan lain yang sah turut diterima)</h4><p>'+qq.sample+'</p>');
    } else {
      qq.parts.forEach(function(pp){
        var lbl = pp.label ? "("+pp.label+")" : "";
        htmlArr.push('<h4>Langkah Penyelesaian '+lbl+'</h4><ol>');
        pp.steps.forEach(function(st){ htmlArr.push('<li>'+st+'</li>'); });
        htmlArr.push('</ol><div class="final">Jawapan: '+pp.ans[0]+'</div>');
      });
    }
    htmlArr.push('</div>'); // solution
    htmlArr.push('</div>'); // qcard
    QMAP[qid] = qq;
  });
}

var QMAP = {};

function render(){
  var htmlArr = [];
  CHAPTER.subtopics.forEach(function(st){
    htmlArr.push('<section class="subtopic" id="st-'+st.code+'"><h2>'+st.title+'</h2>');
    st.notes.forEach(function(n){
      htmlArr.push('<div class="notabox"><h3>📝 Nota — '+n.heading+'</h3><div>'+n.html+'</div></div>');
    });
    st.examples.forEach(function(ex){
      htmlArr.push('<div class="contohbox"><h3>📖 '+ex.title+'</h3><div class="q">'+nl2br(ex.q)+'</div><ol>');
      ex.steps.forEach(function(s){ htmlArr.push('<li>'+s+'</li>'); });
      htmlArr.push('</ol><div class="final">Jawapan: '+ex.ans+'</div></div>');
    });
    htmlArr.push('<h3 class="latihan-head">✏️ Latihan</h3>');
    st.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
    htmlArr.push('</section>');
  });
  htmlArr.push('<section class="subtopic" id="review-sec"><h2>'+CHAPTER.review.title+'</h2><h3 class="latihan-head">✏️ Latihan Ulang Kaji</h3>');
  CHAPTER.review.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
  htmlArr.push('</section>');
  document.getElementById("content").innerHTML = htmlArr.join("");
}

function onSemak(qid){
  var qq = QMAP[qid];
  var card = document.getElementById("card-"+qid);
  var alreadyChecked = card.getAttribute("data-checked") === "1";

  if (qq.open){
    var inp = card.querySelector('input[data-part="0"]');
    var val = inp.value.trim();
    var mark = document.getElementById("mark-"+qid+"-0");
    if (val.length > 0){ mark.textContent = "✅"; inp.classList.add("correct"); } else { mark.textContent = ""; }
    document.getElementById("sol-"+qid).classList.add("show");
    if (!alreadyChecked){
      checkedCount++; correctPartsCount += 1; card.setAttribute("data-checked","1"); updateProgress();
    }
    document.getElementById("status-"+qid).textContent = "📝";
    return;
  }

  var allCorrect = true, correctHere = 0;
  qq.parts.forEach(function(pp, pi){
    var inp = card.querySelector('input[data-part="'+pi+'"]');
    var mark = document.getElementById("mark-"+qid+"-"+pi);
    var ok = checkPart(inp.value, pp.ans);
    inp.classList.remove("correct","wrong");
    if (ok){ inp.classList.add("correct"); mark.textContent = "✅"; correctHere++; }
    else { inp.classList.add("wrong"); mark.textContent = "❌"; allCorrect = false; }
  });

  document.getElementById("sol-"+qid).classList.add("show");
  document.getElementById("status-"+qid).textContent = allCorrect ? "✅" : "❌";

  if (!alreadyChecked){
    checkedCount++; correctPartsCount += correctHere;
    card.setAttribute("data-checked","1"); card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  } else {
    var prevCorrect = parseInt(card.getAttribute("data-correct-count")||"0",10);
    correctPartsCount += (correctHere - prevCorrect);
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  }
}

function onToggle(qid){
  document.getElementById("sol-"+qid).classList.toggle("show");
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches('button[data-action="semak"]')) onSemak(t.getAttribute("data-qid"));
  else if (t.matches('button[data-action="toggle"]')) onToggle(t.getAttribute("data-qid"));
});

window.addEventListener("scroll", function(){
  document.getElementById("backTop").style.display = window.scrollY > 400 ? "block" : "none";
});

buildToc();
render();
updateProgress();

})();

</script>
