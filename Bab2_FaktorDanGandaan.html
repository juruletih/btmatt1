) 30, 72 (e) 36, 90, 108 (f) 42, 54, 84 (g) 140, 256, 348 (h) 27, 45, 60", "parts": [{"label": "a", "ans": ["24"], "steps": ["24 ialah faktor bagi 48, maka FSTB = 24."]}, {"label": "b", "ans": ["18"], "steps": ["18 ialah faktor bagi 54, maka FSTB = 18."]}, {"label": "c", "ans": ["12"], "steps": ["36=2²×3², 96=2⁵×3. FSTB=2²×3=12."]}, {"label": "d", "ans": ["6"], "steps": ["30=2×3×5, 72=2³×3². FSTB=2×3=6."]}, {"label": "e", "ans": ["18"], "steps": ["36=2²×3², 90=2×3²×5, 108=2²×3³. FSTB=2×3²=18."]}, {"label": "f", "ans": ["6"], "steps": ["42=2×3×7, 54=2×3³, 84=2²×3×7. FSTB=2×3=6."]}, {"label": "g", "ans": ["4"], "steps": ["140=2²×5×7, 256=2⁸, 348=2²×3×29. FSTB=2²=4."]}, {"label": "h", "ans": ["3"], "steps": ["27=3³, 45=3²×5, 60=2²×3×5. FSTB=3."]}], "open": false, "sample": null}]}, {"group": "2.1e", "title": "Latih Diri 2.1e — Masalah FSTB", "questions": [{"num": 1, "stem": "Pasukan Kadet Polis menderma 60 kampit beras, 78 botol minyak masak dan 90 botol air mineral kepada mangsa banjir. Semua barang dibahagikan sama rata dalam setiap kotak. Berapakah bilangan kotak yang PALING BANYAK dapat disediakan?", "parts": [{"label": null, "ans": ["6"], "steps": ["Bilangan kotak paling banyak = FSTB(60, 78, 90).", "60=2²×3×5, 78=2×3×13, 90=2×3²×5.", "FSTB = 2×3 = 6 kotak."]}], "open": false, "sample": null}, {"num": 2, "stem": "Mak Minah membuat 45 biji kuih koci, 75 biji kuih tako dan 90 biji karipap. Dia ingin menghidangkan dalam sebilangan pinggan. Berapakah bilangan MAKSIMUM pinggan supaya semua kuih diagihkan sama rata?", "parts": [{"label": null, "ans": ["15"], "steps": ["Bilangan pinggan maksimum = FSTB(45, 75, 90).", "45=3²×5, 75=3×5², 90=2×3²×5.", "FSTB = 3×5 = 15 pinggan."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 2.1", "title": "Mahir Diri 2.1", "questions": [{"num": 1, "stem": "Cari nombor terbesar yang merupakan faktor bagi 45 dan 75.", "parts": [{"label": null, "ans": ["15"], "steps": ["Ini ialah FSTB(45,75).", "45=3²×5, 75=3×5². FSTB=3×5=15."]}], "open": false, "sample": null}, {"num": 2, "stem": "Tulis 1 968 dan 4 968 sebagai pemfaktoran perdana. Seterusnya, cari FSTB bagi kedua-duanya.", "parts": [{"label": null, "ans": ["24"], "steps": ["1 968 = 2×2×2×2×3×41 (2⁴×3×41).", "4 968 = 2×2×2×3×3×3×23 (2³×3³×23).", "FSTB = 2³×3 = 24."]}], "open": false, "sample": null}, {"num": 3, "stem": "FSTB bagi n dan 36 ialah 4. Jika nilai n kurang daripada 36, apakah nilai yang mungkin bagi n?", "parts": [{"label": null, "ans": ["4,8,16,20,28,32"], "steps": ["36=2²×3². n mesti gandaan 4 tetapi TIDAK boleh gandaan 12 (yang akan menaikkan FSTB kepada 12).", "Semak semua gandaan 4 di bawah 36: 4,8,12,16,20,24,28,32.", "FSTB(12,36)=12 ✗, FSTB(24,36)=12 ✗ — kedua ini ditolak.", "Nilai n yang sah: 4, 8, 16, 20, 28, 32."]}], "open": false, "sample": null}, {"num": 4, "stem": "Panjang tiga utas tali masing-masing 192 cm, 242 cm dan 328 cm. Aishah memotong setiap tali kepada bilangan BAHAGIAN yang SAMA (bilangan potongan sama bagi ketiga-tiga tali) tanpa baki. Berapakah bilangan potongan TERBANYAK bagi setiap utas tali?", "parts": [{"label": null, "ans": ["2"], "steps": ["Bilangan potongan (sama bagi ketiga-tiga tali) mestilah pembahagi sepunya bagi 192, 242 dan 328.", "192=2⁶×3, 242=2×11², 328=2³×41.", "FSTB = 2 (satu-satunya faktor perdana sepunya).", "Bilangan potongan terbanyak = 2 bahagian bagi setiap tali."]}], "open": false, "sample": null}, {"num": 5, "stem": "Anita memotong sehelai kertas berukuran 260 cm × 20 cm kepada kepingan segi empat sama tanpa baki. Apakah ukuran kepingan TERBESAR yang mungkin?", "parts": [{"label": null, "ans": ["20"], "steps": ["Ukuran kepingan terbesar = FSTB(260, 20).", "20 ialah faktor bagi 260 (260÷20=13).", "FSTB = 20. Ukuran kepingan = 20 cm × 20 cm."]}], "open": false, "sample": null}]}]}, {"code": "2.2", "title": "2.2 Gandaan, Gandaan Sepunya dan Gandaan Sepunya Terkecil (GSTK)", "notes": [{"heading": "Gandaan dan Gandaan Sepunya", "html": "<b>Gandaan</b> bagi suatu nombor diperoleh dengan mendarab nombor itu dengan 1, 2, 3, … (cth: gandaan 9 ialah 9, 18, 27, …).<br><b>Gandaan sepunya</b> ialah gandaan yang dikongsi oleh dua atau lebih nombor."}, {"heading": "GSTK", "html": "<b>Gandaan Sepunya Terkecil (GSTK)</b> ialah gandaan sepunya yang paling kecil (bukan sifar).<br>Kaedah mencari GSTK: (1) senarai gandaan sepunya, (2) pembahagian berulang, atau (3) pemfaktoran perdana (darab SEMUA faktor perdana terlibat dengan kuasa TERBESAR)."}], "examples": [{"title": "Contoh 9", "q": "Tentukan sama ada (a) 32 gandaan sepunya bagi 2,8 (b) 60 gandaan sepunya bagi 5,15,24 (c) 72 gandaan sepunya bagi 8,9,18,24.", "steps": ["(a) 32÷2=16, 32÷8=4 — tepat → Ya.", "(b) 60÷24=2 baki 12 — tidak tepat → Bukan.", "(c) 72÷8=9,72÷9=8,72÷18=4,72÷24=3 — semua tepat → Ya."], "ans": "(a) Ya (b) Bukan (c) Ya"}, {"title": "Contoh 10", "q": "Senaraikan LIMA gandaan sepunya pertama bagi 2, 3 dan 4.", "steps": ["Gandaan sepunya pertama (GSTK) bagi 2,3,4 ialah 12.", "Gandaan seterusnya ialah gandaan bagi 12: 12,24,36,48,60."], "ans": "12, 24, 36, 48, 60"}, {"title": "Contoh 11", "q": "Tentukan GSTK bagi (a) 2,3 (b) 3,6,9 (c) 3,8,12.", "steps": ["(a) Gandaan 2:2,4,6,8,... Gandaan 3:3,6,9,... → GSTK=6.", "(b) Pembahagian berulang: 3,6,9 ÷3÷2÷3 → GSTK=3×2×3=18.", "(c) Pemfaktoran perdana: 3=3, 8=2³, 12=2²×3 → GSTK=2³×3=24."], "ans": "(a) 6  (b) 18  (c) 24"}, {"title": "Contoh (Penyelesaian Masalah)", "q": "Kopi dijual 6 tin sekotak, teh dijual 9 tin sekotak. Ainun mahu bilangan tin yang SAMA bagi kedua-dua jenis. Berapa kotak PALING KURANG bagi setiap jenis?", "steps": ["GSTK(6,9)=18.", "Kotak kopi = 18÷6=3. Kotak teh = 18÷9=2."], "ans": "3 kotak kopi, 2 kotak teh"}], "exercises": [{"group": "2.2a", "title": "Latih Diri 2.2a — Gandaan Sepunya", "questions": [{"num": 1, "stem": "Tentukan sama ada nombor berikut ialah gandaan sepunya bagi senarai nombor dalam tanda kurung.\n(a) 72 (9, 12)\n(b) 168 (2, 9)\n(c) 360 (4, 6, 24)\n(d) 2 250 (2, 5, 9)\n(e) 9 720 (4, 5, 10, 20)\n(f) 16 416 (6, 9, 12, 24, 36)", "parts": [{"label": "a", "ans": ["ya"], "steps": ["72÷9=8, 72÷12=6 — kedua tepat.", "72 ialah gandaan sepunya."]}, {"label": "b", "ans": ["bukan"], "steps": ["168÷9 tidak tepat.", "168 BUKAN gandaan sepunya."]}, {"label": "c", "ans": ["ya"], "steps": ["360÷4=90, 360÷6=60, 360÷24=15 — semua tepat.", "360 ialah gandaan sepunya."]}, {"label": "d", "ans": ["ya"], "steps": ["2250÷2=1125, 2250÷5=450, 2250÷9=250 — semua tepat.", "2 250 ialah gandaan sepunya."]}, {"label": "e", "ans": ["ya"], "steps": ["9720÷4=2430, ÷5=1944, ÷10=972, ÷20=486 — semua tepat.", "9 720 ialah gandaan sepunya."]}, {"label": "f", "ans": ["ya"], "steps": ["16416÷6=2736, ÷9=1824, ÷12=1368, ÷24=684, ÷36=456 — semua tepat.", "16 416 ialah gandaan sepunya."]}], "open": false, "sample": null}, {"num": 2, "stem": "Senaraikan LIMA gandaan sepunya bagi setiap senarai nombor berikut.\n(a) 2, 5 (b) 3, 5 (c) 18, 22 (d) 3, 5, 8 (e) 2, 3, 6, 8 (f) 4, 8, 12, 15 (g) 6, 15, 20, 24 (h) 4, 9, 12, 15, 18", "parts": [{"label": "a", "ans": ["10,20,30,40,50"], "steps": ["GSTK(2,5)=10.", "Gandaan sepunya: 10,20,30,40,50."]}, {"label": "b", "ans": ["15,30,45,60,75"], "steps": ["GSTK(3,5)=15.", "15,30,45,60,75."]}, {"label": "c", "ans": ["198,396,594,792,990"], "steps": ["GSTK(18,22)=198.", "198,396,594,792,990."]}, {"label": "d", "ans": ["120,240,360,480,600"], "steps": ["GSTK(3,5,8)=120.", "120,240,360,480,600."]}, {"label": "e", "ans": ["24,48,72,96,120"], "steps": ["GSTK(2,3,6,8)=24.", "24,48,72,96,120."]}, {"label": "f", "ans": ["120,240,360,480,600"], "steps": ["GSTK(4,8,12,15)=120.", "120,240,360,480,600."]}, {"label": "g", "ans": ["120,240,360,480,600"], "steps": ["GSTK(6,15,20,24)=120.", "120,240,360,480,600."]}, {"label": "h", "ans": ["180,360,540,720,900"], "steps": ["GSTK(4,9,12,15,18)=180.", "180,360,540,720,900."]}], "open": false, "sample": null}]}, {"group": "2.2b", "title": "Latih Diri 2.2b — GSTK", "questions": [{"num": 1, "stem": "Dengan menggunakan kaedah yang sesuai, cari GSTK bagi setiap senarai nombor berikut.\n(a) 16, 18 (b) 10, 15 (c) 6, 8 (d) 18, 60 (e) 6, 15, 18 (f) 8, 14, 32 (g) 9, 12, 21 (h) 4, 15, 60", "parts": [{"label": "a", "ans": ["144"], "steps": ["16=2⁴, 18=2×3². GSTK=2⁴×3²=144."]}, {"label": "b", "ans": ["30"], "steps": ["10=2×5, 15=3×5. GSTK=2×3×5=30."]}, {"label": "c", "ans": ["24"], "steps": ["6=2×3, 8=2³. GSTK=2³×3=24."]}, {"label": "d", "ans": ["180"], "steps": ["18=2×3², 60=2²×3×5. GSTK=2²×3²×5=180."]}, {"label": "e", "ans": ["90"], "steps": ["6=2×3, 15=3×5, 18=2×3². GSTK=2×3²×5=90."]}, {"label": "f", "ans": ["224"], "steps": ["8=2³, 14=2×7, 32=2⁵. GSTK=2⁵×7=224."]}, {"label": "g", "ans": ["252"], "steps": ["9=3², 12=2²×3, 21=3×7. GSTK=2²×3²×7=252."]}, {"label": "h", "ans": ["60"], "steps": ["60 ialah gandaan bagi 4 dan 15. GSTK=60."]}], "open": false, "sample": null}]}, {"group": "2.2c", "title": "Latih Diri 2.2c — Masalah GSTK", "questions": [{"num": 1, "stem": "Satu lampu neon mengelip setiap 9 saat manakala satu lagi mengelip setiap 12 saat. Jika kedua-duanya mengelip serentak ketika suis dihidupkan, selepas berapa saat kedua-duanya mengelip serentak sekali lagi?", "parts": [{"label": null, "ans": ["36"], "steps": ["Masa serentak seterusnya = GSTK(9,12).", "9=3², 12=2²×3. GSTK=2²×3²=36 saat."]}], "open": false, "sample": null}, {"num": 2, "stem": "Rantai kunci dijual 10 utas sepeket, magnet peti sejuk dijual 6 keping sepeket. Berapakah bilangan rantai kunci MINIMUM yang perlu dibeli supaya bilangan magnet boleh dibungkus secukupnya dengan semua rantai kunci?", "parts": [{"label": null, "ans": ["30"], "steps": ["Bilangan minimum supaya kedua-dua jenis sama = GSTK(10,6).", "10=2×5, 6=2×3. GSTK=2×3×5=30.", "Rantai kunci minimum yang perlu dibeli = 30 utas (3 peket)."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 2.2", "title": "Mahir Diri 2.2", "questions": [{"num": 1, "stem": "Cari nombor terkecil yang boleh dibahagi tepat dengan 8 dan 20.", "parts": [{"label": null, "ans": ["40"], "steps": ["Ini ialah GSTK(8,20).", "8=2³, 20=2²×5. GSTK=2³×5=40."]}], "open": false, "sample": null}, {"num": 2, "stem": "GSTK bagi n dan 6 ialah 72. Cari nilai n.", "parts": [{"label": null, "ans": ["72"], "steps": ["72=2³×3². 6=2×3.", "Untuk GSTK(n,6)=72, n mesti membekalkan 2³ dan 3² (kerana 6 cuma ada 2¹ dan 3¹).", "Nilai n yang paling mudah dan sah ialah n = 72 (kerana GSTK(72,6)=72)."]}], "open": false, "sample": null}, {"num": 3, "stem": "Sharif mendaki bukit setiap 12 hari dan berenang setiap 8 hari. Jika hari ini dia mendaki bukit dan juga berenang, berapa hari kemudian dia melakukan kedua-duanya pada hari yang sama sekali lagi?", "parts": [{"label": null, "ans": ["24"], "steps": ["Ini ialah GSTK(12,8).", "12=2²×3, 8=2³. GSTK=2³×3=24 hari."]}], "open": false, "sample": null}, {"num": 4, "stem": "Nurul, Hui Ling dan Gopal masing-masing diberi reben yang sama panjang. Mereka memotong reben itu kepada keratan sama panjang: 15 cm, 25 cm dan 30 cm masing-masing, tiada baki. Berapakah panjang reben TERPENDEK yang mungkin diberikan kepada mereka?", "parts": [{"label": null, "ans": ["150"], "steps": ["Panjang reben asal mesti gandaan sepunya bagi 15, 25 dan 30.", "15=3×5, 25=5², 30=2×3×5. GSTK=2×3×5²=150.", "Panjang reben terpendek yang mungkin = 150 cm."]}], "open": false, "sample": null}]}]}], "review": {"title": "Marilah Praktis — Ulang Kaji Bab 2", "exercises": [{"group": "Marilah Praktis", "title": "Marilah Praktis — Ulang Kaji Bab 2", "questions": [{"num": 1, "stem": "Cari GSTK bagi 2, 3, 4, 5 dan 6.", "parts": [{"label": null, "ans": ["60"], "steps": ["2=2,3=3,4=2²,5=5,6=2×3.", "GSTK perlu 2²,3,5 → 2²×3×5=60."]}], "open": false, "sample": null}, {"num": 2, "stem": "Cari FSTB bagi 36, 42, 56, 72 dan 96.", "parts": [{"label": null, "ans": ["2"], "steps": ["36=2²3², 42=2×3×7, 56=2³×7, 72=2³3², 96=2⁵×3.", "Kuasa 2 minimum di antara semua = 2¹ (dari 42). Tiada faktor perdana lain yang sepunya kepada SEMUA nombor.", "FSTB = 2."]}], "open": false, "sample": null}, {"num": 3, "stem": "Satu nombor boleh dibahagi tepat dengan 12 dan 30. Apakah nilai TERKECIL bagi nombor itu?", "parts": [{"label": null, "ans": ["60"], "steps": ["Nilai terkecil = GSTK(12,30).", "12=2²×3, 30=2×3×5. GSTK=2²×3×5=60."]}], "open": false, "sample": null}, {"num": 4, "stem": "FSTB bagi m dan 54 ialah 6. Cari nilai TERBESAR bagi m dengan keadaan m kurang daripada 54.", "parts": [{"label": null, "ans": ["48"], "steps": ["54=2×3³. m=6k dengan gcd(k,9)=1 dan k<9 (kerana m<54).", "k boleh 1,2,4,5,7,8 (bukan gandaan 3).", "k terbesar=8 → m=6×8=48."]}], "open": false, "sample": null}, {"num": 5, "stem": "GSTK bagi 36, 56 dan n ialah 1 512. Apakah nilai TERKECIL bagi n?", "parts": [{"label": null, "ans": ["27"], "steps": ["1512=2³×3³×7. 36=2²×3², 56=2³×7. GSTK(36,56)=2³×3²×7=504.", "n mesti membekalkan 3³ (kerana 504 hanya ada 3²).", "Nilai n terkecil = 3³ = 27."]}], "open": false, "sample": null}, {"num": 6, "stem": "Terangkan, dengan memberi contoh, dalam keadaan apa GSTK bagi dua nombor adalah SAMA dengan hasil darab kedua-dua nombor itu.", "parts": [], "open": true, "sample": "GSTK dua nombor sama dengan hasil darabnya apabila kedua-dua nombor itu TIDAK mempunyai faktor sepunya selain 1 (FSTB=1), iaitu nombor tersebut 'saling perdana'. Contoh: 2 dan 3 — GSTK(2,3)=6=2×3."}, {"num": 7, "stem": "GSTK bagi dua nombor ialah 60 dan FSTB bagi dua nombor itu ialah 6. Cari dua nombor yang mungkin.", "parts": [{"label": null, "ans": ["6,60", "6 dan 60", "12,30", "12 dan 30"], "steps": ["Biar nombor = 6x dan 6y dengan gcd(x,y)=1.", "GSTK = 6xy = 60 → xy = 10.", "Pasangan (x,y) yang selaras (gcd=1) dengan hasil darab 10: (1,10) atau (2,5).", "Nombor yang mungkin: 6 dan 60, ATAU 12 dan 30."]}], "open": false, "sample": null}, {"num": 8, "stem": "Jam A dipasang berbunyi setiap 15 minit, jam B setiap 25 minit. Jika kedua-dua jam berbunyi serentak pada pukul 4:00 p.m., bilakah kedua-duanya berbunyi serentak sekali lagi?", "parts": [{"label": null, "ans": ["5:15 p.m.", "5:15pm"], "steps": ["GSTK(15,25)=75 minit = 1 jam 15 minit.", "4:00 p.m. + 1 jam 15 minit = 5:15 p.m."]}], "open": false, "sample": null}, {"num": 9, "stem": "Sebuah bilik berukuran 7.5 m × 9.6 m. Apakah saiz jubin segi empat sama TERBESAR (dalam cm) yang boleh digunakan supaya jubin-jubin menutupi keseluruhan lantai?", "parts": [{"label": null, "ans": ["30"], "steps": ["Tukar ke cm: 750 cm × 960 cm.", "Saiz jubin terbesar = FSTB(750, 960).", "750=2×3×5³, 960=2⁶×3×5. FSTB=2×3×5=30.", "Saiz jubin: 30 cm × 30 cm."]}], "open": false, "sample": null}, {"num": 10, "stem": "Kafeteria hidangkan kuih kacang setiap 4 hari dan burger setiap 6 hari. Jika kedua-duanya dihidangkan pada hari Isnin, pada hari apakah kedua-dua jenis makanan dihidangkan sekali lagi?", "parts": [{"label": null, "ans": ["hari sabtu kedua", "sabtu kedua"], "steps": ["GSTK(4,6)=12 hari.", "12 hari selepas Isnin: 7 hari = 1 minggu (jatuh pada Isnin lagi), baki 5 hari lagi → jatuh pada hari Sabtu minggu berikutnya.", "Jawapan: hari Sabtu KEDUA (minggu kedua)."]}], "open": false, "sample": null}, {"num": 11, "stem": "Ai Lin menyediakan buku skrap menggunakan 24 keping gambar foto dan 42 keping keratan akhbar, semuanya digunakan, dengan setiap muka surat mempunyai bilangan gambar dan keratan yang SAMA.\n(a) Berapakah muka surat PALING BANYAK boleh dibuat?\n(b) Berapa keping gambar foto dan keratan akhbar pada SETIAP muka surat?", "parts": [{"label": "a", "ans": ["6"], "steps": ["Muka surat paling banyak = FSTB(24,42).", "24=2³×3, 42=2×3×7. FSTB=2×3=6."]}, {"label": "b", "ans": ["4 gambar dan 7 keratan", "4 keping gambar foto dan 7 keping keratan akhbar"], "steps": ["Gambar setiap muka surat = 24÷6=4.", "Keratan setiap muka surat = 42÷6=7."]}], "open": false, "sample": null}]}]}};

  return s;
}

function toNumber(s){
  s = normalize(s);
  if (s === "") return null;
  if (/^-?\d+\/\d+$/.test(s)){
    var parts = s.split("/");
    return parseFloat(parts[0])/parseFloat(parts[1]);
  }
  if (/^-?\d+(\.\d+)?$/.test(s)){
    return parseFloat(s);
  }
  return null;
}

function fuzzyNumberMatch(input, accepted){
  var vi = toNumber(input);
  if (vi === null) return false;
  for (var i=0;i<accepted.length;i++){
    var va = toNumber(accepted[i]);
    if (va !== null && Math.abs(vi - va) < 0.005) return true;
  }
  return false;
}

function checkPart(inputRaw, acceptedList){
  var inputN = normalize(inputRaw);
  if (inputN === "") return false;
  for (var i=0;i<acceptedList.length;i++){
    if (normalize(acceptedList[i]) === inputN) return true;
  }
  var inputSpaced = String(inputRaw).toLowerCase().trim().replace(/–/g,"-");
  for (var j=0;j<acceptedList.length;j++){
    if (String(acceptedList[j]).toLowerCase().trim() === inputSpaced) return true;
  }
  if (fuzzyNumberMatch(inputRaw, acceptedList)) return true;
  return false;
}

var CHAPTER = window.__CHAPTER_DATA__;
var totalQuestions = 0;
var totalPartsCount = 0;
CHAPTER.subtopics.forEach(function(st){
  st.exercises.forEach(function(grp){
    grp.questions.forEach(function(qq){
      totalQuestions++;
      totalPartsCount += qq.open ? 1 : qq.parts.length;
    });
  });
});
CHAPTER.review.exercises.forEach(function(grp){
  grp.questions.forEach(function(qq){
    totalQuestions++;
    totalPartsCount += qq.open ? 1 : qq.parts.length;
  });
});

var checkedCount = 0;
var correctPartsCount = 0;

function updateProgress(){
  document.getElementById("progressText").textContent = checkedCount + " / " + totalQuestions + " disemak";
  document.getElementById("scoreText").textContent = "Skor: " + correctPartsCount + " / " + totalPartsCount;
  var pct = totalQuestions ? Math.round((checkedCount/totalQuestions)*100) : 0;
  document.getElementById("progressbar").style.width = pct + "%";
}

function nl2br(s){ return s.replace(/\n/g,"<br>"); }

function buildToc(){
  var toc = document.getElementById("toc");
  CHAPTER.subtopics.forEach(function(st){
    var btn = document.createElement("button");
    btn.textContent = st.code;
    btn.onclick = function(){ document.getElementById("st-"+st.code).scrollIntoView({behavior:"smooth", block:"start"}); };
    toc.appendChild(btn);
  });
  var btn2 = document.createElement("button");
  btn2.textContent = "Praktis";
  btn2.onclick = function(){ document.getElementById("review-sec").scrollIntoView({behavior:"smooth", block:"start"}); };
  toc.appendChild(btn2);
}

var qCounter = 0;
function renderExerciseGroup(grp, htmlArr){
  htmlArr.push('<div class="grouptitle">'+grp.title+'</div>');
  grp.questions.forEach(function(qq){
    var qid = "q"+(qCounter++);
    htmlArr.push('<div class="qcard" id="card-'+qid+'">');
    htmlArr.push('<div class="qhead"><span class="qnum">Soalan '+qq.num+'</span><span class="qstatus" id="status-'+qid+'"></span></div>');
    htmlArr.push('<div class="stem">'+nl2br(qq.stem)+(qq.open?'<span class="badge-open">Jawapan Terbuka</span>':'')+'</div>');
    if (qq.open){
      htmlArr.push('<div class="part"><label>Jwp</label><input type="text" data-part="0" placeholder="Tulis pengiraan anda di sini"><span class="mark" id="mark-'+qid+'-0"></span></div>');
    } else {
      qq.parts.forEach(function(pp, pi){
        var lbl = pp.label ? "("+pp.label+")" : "Jwp";
        htmlArr.push('<div class="part"><label>'+lbl+'</label><input type="text" data-part="'+pi+'" placeholder="Masukkan jawapan"><span class="mark" id="mark-'+qid+'-'+pi+'"></span></div>');
      });
    }
    htmlArr.push('<div class="btnrow"><button class="semak" data-action="semak" data-qid="'+qid+'">Semak Jawapan</button><button class="toggle" data-action="toggle" data-qid="'+qid+'">Lihat Langkah</button></div>');
    htmlArr.push('<div class="solution" id="sol-'+qid+'">');
    if (qq.open){
      htmlArr.push('<h4>Contoh Jawapan (jawapan lain yang sah turut diterima)</h4><p>'+qq.sample+'</p>');
    } else {
      qq.parts.forEach(function(pp){
        var lbl = pp.label ? "("+pp.label+")" : "";
        htmlArr.push('<h4>Langkah Penyelesaian '+lbl+'</h4><ol>');
        pp.steps.forEach(function(st){ htmlArr.push('<li>'+st+'</li>'); });
        htmlArr.push('</ol><div class="final">Jawapan: '+pp.ans[0]+'</div>');
      });
    }
    htmlArr.push('</div>'); // solution
    htmlArr.push('</div>'); // qcard
    QMAP[qid] = qq;
  });
}

var QMAP = {};

function setTitles(){
  var t = "Bab " + CHAPTER.chapterCode + " — " + CHAPTER.chapterTitle;
  document.getElementById("chapTitleText").textContent = t;
  document.getElementById("pageTitle").textContent = t + " | Matematik Tingkatan 1";
}

function render(){
  setTitles();
  var htmlArr = [];
  CHAPTER.subtopics.forEach(function(st){
    htmlArr.push('<section class="subtopic" id="st-'+st.code+'"><h2>'+st.title+'</h2>');
    st.notes.forEach(function(n){
      htmlArr.push('<div class="notabox"><h3>📝 Nota — '+n.heading+'</h3><div>'+n.html+'</div></div>');
    });
    st.examples.forEach(function(ex){
      htmlArr.push('<div class="contohbox"><h3>📖 '+ex.title+'</h3><div class="q">'+nl2br(ex.q)+'</div><ol>');
      ex.steps.forEach(function(s){ htmlArr.push('<li>'+s+'</li>'); });
      htmlArr.push('</ol><div class="final">Jawapan: '+ex.ans+'</div></div>');
    });
    htmlArr.push('<h3 class="latihan-head">✏️ Latihan</h3>');
    st.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
    htmlArr.push('</section>');
  });
  htmlArr.push('<section class="subtopic" id="review-sec"><h2>'+CHAPTER.review.title+'</h2><h3 class="latihan-head">✏️ Latihan Ulang Kaji</h3>');
  CHAPTER.review.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
  htmlArr.push('</section>');
  document.getElementById("content").innerHTML = htmlArr.join("");
}

function onSemak(qid){
  var qq = QMAP[qid];
  var card = document.getElementById("card-"+qid);
  var alreadyChecked = card.getAttribute("data-checked") === "1";

  if (qq.open){
    var inp = card.querySelector('input[data-part="0"]');
    var val = inp.value.trim();
    var mark = document.getElementById("mark-"+qid+"-0");
    if (val.length > 0){ mark.textContent = "✅"; inp.classList.add("correct"); } else { mark.textContent = ""; }
    document.getElementById("sol-"+qid).classList.add("show");
    if (!alreadyChecked){
      checkedCount++; correctPartsCount += 1; card.setAttribute("data-checked","1"); updateProgress();
    }
    document.getElementById("status-"+qid).textContent = "📝";
    return;
  }

  var allCorrect = true, correctHere = 0;
  qq.parts.forEach(function(pp, pi){
    var inp = card.querySelector('input[data-part="'+pi+'"]');
    var mark = document.getElementById("mark-"+qid+"-"+pi);
    var ok = checkPart(inp.value, pp.ans);
    inp.classList.remove("correct","wrong");
    if (ok){ inp.classList.add("correct"); mark.textContent = "✅"; correctHere++; }
    else { inp.classList.add("wrong"); mark.textContent = "❌"; allCorrect = false; }
  });

  document.getElementById("sol-"+qid).classList.add("show");
  document.getElementById("status-"+qid).textContent = allCorrect ? "✅" : "❌";

  if (!alreadyChecked){
    checkedCount++; correctPartsCount += correctHere;
    card.setAttribute("data-checked","1"); card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  } else {
    var prevCorrect = parseInt(card.getAttribute("data-correct-count")||"0",10);
    correctPartsCount += (correctHere - prevCorrect);
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  }
}

function onToggle(qid){
  document.getElementById("sol-"+qid).classList.toggle("show");
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches('button[data-action="semak"]')) onSemak(t.getAttribute("data-qid"));
  else if (t.matches('button[data-action="toggle"]')) onToggle(t.getAttribute("data-qid"));
});

window.addEventListener("scroll", function(){
  document.getElementById("backTop").style.display = window.scrollY > 400 ? "block" : "none";
});

buildToc();
render();
updateProgress();

})();

</script>
