n": false, "sample": null}, {"num": 6, "stem": "Luas tapak sebuah piramid segi empat sama ialah 52 900 m². Cari panjang sisi tapak piramid itu.", "parts": [{"label": null, "ans": ["230"], "steps": ["Panjang sisi = √52 900.", "230 × 230 = 52 900.", "Panjang sisi = 230 m."]}], "open": false, "sample": null}, {"num": 7, "stem": "Anggarkan nilai bagi setiap yang berikut.\n(a) 297²\n(b) 51.9²\n(c) (–0.038)²\n(d) (–8.12)²\n(e) √14\n(f) √220\n(g) √8.3\n(h) √0.5", "parts": [{"label": "a", "ans": ["90000"], "steps": ["297 ≈ 300 → 300² = 90 000."]}, {"label": "b", "ans": ["2500"], "steps": ["51.9 ≈ 50 → 50² = 2 500."]}, {"label": "c", "ans": ["0.0016"], "steps": ["–0.038 ≈ –0.04 → (–0.04)² = 0.0016."]}, {"label": "d", "ans": ["64"], "steps": ["–8.12 ≈ –8 → (–8)² = 64."]}, {"label": "e", "ans": ["4"], "steps": ["14 antara 9(3²) & 16(4²), lebih hampir 16 → ≈4."]}, {"label": "f", "ans": ["15"], "steps": ["220 antara 196(14²) & 225(15²), lebih hampir 225 → ≈15."]}, {"label": "g", "ans": ["3"], "steps": ["8.3 antara 4(2²) & 9(3²), lebih hampir 9 → ≈3."]}, {"label": "h", "ans": ["0.7"], "steps": ["0.5 antara 0.49(0.7²) & 0.64(0.8²), lebih hampir 0.49 → ≈0.7."]}], "open": false, "sample": null}, {"num": 8, "stem": "100 orang ahli kebudayaan membuat formasi.\n(a) Apabila membentuk SATU segi empat sama, berapa orang pada setiap baris?\n(b) Pada suatu ketika, mereka membentuk DUA segi empat sama serentak. Tentukan bilangan pada setiap baris bagi setiap segi empat sama.", "parts": [{"label": "a", "ans": ["10"], "steps": ["√100 = 10 orang setiap baris."]}, {"label": "b", "ans": ["6,8"], "steps": ["Cari dua kuasa dua sempurna yang berjumlah 100: 36+64=100.", "√36=6, √64=8.", "Bilangan pada setiap baris: 6 orang dan 8 orang."]}], "open": false, "sample": null}]}]}, {"code": "3.2", "title": "3.2 Kuasa Tiga dan Punca Kuasa Tiga", "notes": [{"heading": "Kuasa Tiga dan Kuasa Tiga Sempurna", "html": "<b>Kuasa tiga</b> bagi n ialah n×n×n, ditulis n³. Contoh: 2³=8.<br><b>Kuasa tiga sempurna</b> ialah hasil kuasa tiga suatu integer (1,8,27,64,125,…).<br>Sahkan dengan pemfaktoran perdana: jika faktor perdana boleh dikumpulkan dalam TIGA kumpulan sama, nombor itu kuasa tiga sempurna."}, {"heading": "Punca Kuasa Tiga", "html": "<b>Punca kuasa tiga</b> (∛) ialah songsangan bagi kuasa tiga. Jika n³=m, maka ∛m=n.<br>Punca kuasa tiga nombor positif sentiasa positif; punca kuasa tiga nombor negatif sentiasa negatif."}, {"heading": "Menganggar Kuasa Tiga dan Punca Kuasa Tiga", "html": "Sama seperti kuasa dua: cari DUA kuasa tiga sempurna berdekatan untuk anggaran ∛n, atau bundarkan n kepada nombor mudah untuk anggaran n³."}], "examples": [{"title": "Contoh 9", "q": "Tentukan sama ada (a) 64 (b) 240 ialah kuasa tiga sempurna.", "steps": ["(a) 64=2×2×2×2×2×2=(2×2)³? Sebenarnya 64=4³=2⁶, boleh dikumpulkan dalam 3 kumpulan sama (2×2 setiap kumpulan).", "(b) 240=2⁴×3×5, tidak boleh dikumpulkan dalam 3 kumpulan sama."], "ans": "(a) 64 ialah kuasa tiga sempurna. (b) 240 bukan kuasa tiga sempurna."}, {"title": "Contoh 10", "q": "Lengkapkan: (a) 4×4×4=64, maka ∛64=? (b) (–0.5)³=–0.125, maka ∛(–0.125)=? (c) (1/6)³=1/216, maka ∛(1/216)=?", "steps": ["(a) ∛64 = 4.", "(b) ∛(–0.125) = –0.5.", "(c) ∛(1/216) = 1/6."], "ans": "(a) 4 (b) –0.5 (c) 1/6"}, {"title": "Contoh 11", "q": "Cari nilai TANPA kalkulator: (a) 4³ (b) 0.2³ (c) (–3/5)³", "steps": ["(a) 4×4×4=64.", "(b) 0.2×0.2×0.2=0.008.", "(c) (–3/5)³=–27/125."], "ans": "(a) 64 (b) 0.008 (c) –27/125"}, {"title": "Contoh 12", "q": "Dengan kalkulator: (a) 18³ (b) (–4 1/2)³ (c) (–6.3)³", "steps": ["(a) 18³=5832.", "(b) (–9/2)³=–729/8=–91 1/8.", "(c) (–6.3)³=–250.047."], "ans": "(a) 5832 (b) –91 1/8 (c) –250.047"}, {"title": "Contoh 13", "q": "Cari nilai TANPA kalkulator: (a) ∛64 (b) ∛216", "steps": ["(a) 4³=64, maka ∛64=4.", "(b) 216=(2×3)×(2×3)×(2×3)=6³, maka ∛216=6."], "ans": "(a) 4 (b) 6"}, {"title": "Contoh 14", "q": "Cari nilai TANPA kalkulator: (a) ∛(8/125) (b) ∛(–81/192) (c) ∛(3 3/8)", "steps": ["(a) (2/5)³=8/125, maka=2/5.", "(b) Permudah –81/192=–27/64=(–3/4)³, maka=–3/4.", "(c) 3 3/8=27/8=(3/2)³, maka=3/2=1 1/2."], "ans": "(a) 2/5 (b) –3/4 (c) 1 1/2"}, {"title": "Contoh 15", "q": "Cari nilai TANPA kalkulator: (a) ∛0.027 (b) ∛(–0.008)", "steps": ["(a) 0.3³=0.027, maka=0.3.", "(b) (–0.2)³=–0.008, maka=–0.2."], "ans": "(a) 0.3 (b) –0.2"}, {"title": "Contoh 16", "q": "Dengan kalkulator, 2 t.p.: (a) ∛24 (b) ∛(–104.8) (c) ∛(–1 2/9)", "steps": ["(a) ∛24≈2.88.", "(b) ∛(–104.8)≈–4.71.", "(c) ∛(–1.2222)≈–1.07."], "ans": "(a) 2.88 (b) –4.71 (c) –1.07"}, {"title": "Contoh 17", "q": "Anggarkan (a) 4.2³ (b) ∛180", "steps": ["(a) 4.2 antara 4 dan 5, jadi 4.2³ antara 64 dan 125, lebih hampir 64.", "(b) 180 antara kuasa tiga sempurna 125(5³) dan 216(6³), lebih hampir 216."], "ans": "(a) ≈64 (b) ∛180 ≈ 6"}, {"title": "Contoh (Penyelesaian Masalah)", "q": "Pengukir memahat blok kayu kubus bersisi 6 cm, mengeluarkan kubus kecil. Isi padu blok yang tinggal ialah 189 cm³. Cari panjang tepi kubus kecil yang dikeluarkan.", "steps": ["Isi padu blok asal = 6³ = 216 cm³.", "Isi padu kubus kecil = 216 – 189 = 27 cm³.", "Panjang tepi kubus kecil = ∛27 = 3 cm."], "ans": "3 cm"}], "exercises": [{"group": "3.2a", "title": "Latih Diri 3.2a — Kuasa Tiga Sempurna", "questions": [{"num": 1, "stem": "Dengan pemfaktoran perdana, tentukan sama ada setiap nombor berikut ialah kuasa tiga sempurna atau bukan.\n(a) 27\n(b) 45\n(c) 215\n(d) 343", "parts": [{"label": "a", "ans": ["ya"], "steps": ["27 = 3×3×3, boleh dikumpulkan dalam TIGA kumpulan sama.", "27 IALAH kuasa tiga sempurna."]}, {"label": "b", "ans": ["bukan"], "steps": ["45 = 3×3×5, tidak boleh dikumpulkan dalam 3 kumpulan sama.", "45 BUKAN kuasa tiga sempurna."]}, {"label": "c", "ans": ["bukan"], "steps": ["215 = 5×43, tidak boleh dikumpulkan dalam 3 kumpulan sama.", "215 BUKAN kuasa tiga sempurna."]}, {"label": "d", "ans": ["ya"], "steps": ["343 = 7×7×7, boleh dikumpulkan dalam TIGA kumpulan sama.", "343 IALAH kuasa tiga sempurna."]}], "open": false, "sample": null}] function normalize(s){

function toNumber(s){

    return parseFloat(parts[0])/parseFloat(parts[1]);

function fuzzyNumberMatch(input, accepted){
  var vi = toNumber(input);

    toc.appendChild(btn);
  });
  var btn2 = document.createElement("button");
  btn2.textContent = "Praktis";
  btn2.onclick = function(){ document.getElementById("review-sec").scrollIntoView({behavior:"smooth", block:"start"}); };
  toc.appendChild(btn2);
}

var qCounter = 0;
function renderExerciseGroup(grp, htmlArr){
  htmlArr.push('<div class="grouptitle">'+grp.title+'</div>');
  grp.questions.forEach(function(qq){
    var qid = "q"+(qCounter++);
    htmlArr.push('<div class="qcard" id="card-'+qid+'">');
    htmlArr.push('<div class="qhead"><span class="qnum">Soalan '+qq.num+'</span><span class="qstatus" id="status-'+qid+'"></span></div>');
    htmlArr.push('<div class="stem">'+nl2br(qq.stem)+(qq.open?'<span class="badge-open">Jawapan Terbuka</span>':'')+'</div>');
    if (qq.open){
      htmlArr.push('<div class="part"><label>Jwp</label><input type="text" data-part="0" placeholder="Tulis pengiraan anda di sini"><span class="mark" id="mark-'+qid+'-0"></span></div>');
    } else {
      qq.parts.forEach(function(pp, pi){
        var lbl = pp.label ? "("+pp.label+")" : "Jwp";
        htmlArr.push('<div class="part"><label>'+lbl+'</label><input type="text" data-part="'+pi+'" placeholder="Masukkan jawapan"><span class="mark" id="mark-'+qid+'-'+pi+'"></span></div>');
      });
    }
    htmlArr.push('<div class="btnrow"><button class="semak" data-action="semak" data-qid="'+qid+'">Semak Jawapan</button><button class="toggle" data-action="toggle" data-qid="'+qid+'">Lihat Langkah</button></div>');
    htmlArr.push('<div class="solution" id="sol-'+qid+'">');
    if (qq.open){
      htmlArr.push('<h4>Contoh Jawapan (jawapan lain yang sah turut diterima)</h4><p>'+qq.sample+'</p>');
    } else {
      qq.parts.forEach(function(pp){
        var lbl = pp.label ? "("+pp.label+")" : "";
        htmlArr.push('<h4>Langkah Penyelesaian '+lbl+'</h4><ol>');
        pp.steps.forEach(function(st){ htmlArr.push('<li>'+st+'</li>'); });
        htmlArr.push('</ol><div class="final">Jawapan: '+pp.ans[0]+'</div>');
      });
    }
    htmlArr.push('</div>'); // solution
    htmlArr.push('</div>'); // qcard
    QMAP[qid] = qq;
  });
}

var QMAP = {};

function setTitles(){
  var t = "Bab " + CHAPTER.chapterCode + " — " + CHAPTER.chapterTitle;
  document.getElementById("chapTitleText").textContent = t;
  document.getElementById("pageTitle").textContent = t + " | Matematik Tingkatan 1";
}

function render(){
  setTitles();
  var htmlArr = [];
  CHAPTER.subtopics.forEach(function(st){
    htmlArr.push('<section class="subtopic" id="st-'+st.code+'"><h2>'+st.title+'</h2>');
    st.notes.forEach(function(n){
      htmlArr.push('<div class="notabox"><h3>📝 Nota — '+n.heading+'</h3><div>'+n.html+'</div></div>');
    });
    st.examples.forEach(function(ex){
      htmlArr.push('<div class="contohbox"><h3>📖 '+ex.title+'</h3><div class="q">'+nl2br(ex.q)+'</div><ol>');
      ex.steps.forEach(function(s){ htmlArr.push('<li>'+s+'</li>'); });
      htmlArr.push('</ol><div class="final">Jawapan: '+ex.ans+'</div></div>');
    });
    htmlArr.push('<h3 class="latihan-head">✏️ Latihan</h3>');
    st.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
    htmlArr.push('</section>');
  });
  htmlArr.push('<section class="subtopic" id="review-sec"><h2>'+CHAPTER.review.title+'</h2><h3 class="latihan-head">✏️ Latihan Ulang Kaji</h3>');
  CHAPTER.review.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
  htmlArr.push('</section>');
  document.getElementById("content").innerHTML = htmlArr.join("");
}

function onSemak(qid){
  var qq = QMAP[qid];
  var card = document.getElementById("card-"+qid);
  var alreadyChecked = card.getAttribute("data-checked") === "1";

  if (qq.open){
    var inp = card.querySelector('input[data-part="0"]');
    var val = inp.value.trim();
    var mark = document.getElementById("mark-"+qid+"-0");
    if (val.length > 0){ mark.textContent = "✅"; inp.classList.add("correct"); } else { mark.textContent = ""; }
    document.getElementById("sol-"+qid).classList.add("show");
    if (!alreadyChecked){
      checkedCount++; correctPartsCount += 1; card.setAttribute("data-checked","1"); updateProgress();
    }
    document.getElementById("status-"+qid).textContent = "📝";
    return;
  }

  var allCorrect = true, correctHere = 0;
  qq.parts.forEach(function(pp, pi){
    var inp = card.querySelector('input[data-part="'+pi+'"]');
    var mark = document.getElementById("mark-"+qid+"-"+pi);
    var ok = checkPart(inp.value, pp.ans);
    inp.classList.remove("correct","wrong");
    if (ok){ inp.classList.add("correct"); mark.textContent = "✅"; correctHere++; }
    else { inp.classList.add("wrong"); mark.textContent = "❌"; allCorrect = false; }
  });

  document.getElementById("sol-"+qid).classList.add("show");
  document.getElementById("status-"+qid).textContent = allCorrect ? "✅" : "❌";

  if (!alreadyChecked){
    checkedCount++; correctPartsCount += correctHere;
    card.setAttribute("data-checked","1"); card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  } else {
    var prevCorrect = parseInt(card.getAttribute("data-correct-count")||"0",10);
    correctPartsCount += (correctHere - prevCorrect);
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  }
}

function onToggle(qid){
  document.getElementById("sol-"+qid).classList.toggle("show");
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches('button[data-action="semak"]')) onSemak(t.getAttribute("data-qid"));
  else if (t.matches('button[data-action="toggle"]')) onToggle(t.getAttribute("data-qid"));
});

window.addEventListener("scroll", function(){
  document.getElementById("backTop").style.display = window.scrollY > 400 ? "block" : "none";
});

buildToc();
render();
updateProgress();

})();

</script>
