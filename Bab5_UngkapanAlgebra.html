window.__CHAPTER_DATA__ = {"chapterCode": "5", "chapterTitle": "Ungkapan Algebra", "subtopics": [{"code": "5.1", "title": "5.1 Pemboleh Ubah dan Ungkapan Algebra", "notes": [{"heading": "Pemboleh Ubah", "html": "<b>Pemboleh ubah</b> ialah huruf yang mewakili kuantiti yang TIDAK diketahui nilainya. Ia boleh bernilai <b>TETAP</b> (tidak berubah pada bila-bila masa) atau <b>BERUBAH</b> (berubah mengikut masa/situasi)."}, {"heading": "Ungkapan dan Sebutan Algebra", "html": "<b>Ungkapan algebra</b> ialah gabungan nombor dan pemboleh ubah (cth: x+3, 2xy). Setiap bahagian yang dipisahkan oleh + atau – dipanggil <b>sebutan</b>.<br>Sebutan algebra boleh ditulis sebagai hasil darab pemboleh ubah dan <b>pekali</b>-nya (nombor/faktor lain di hadapan)."}, {"heading": "Sebutan Serupa dan Tidak Serupa", "html": "<b>Sebutan serupa</b> mempunyai pemboleh ubah SAMA dengan kuasa SAMA (cth: 2x, –3x). <b>Sebutan tidak serupa</b> mempunyai pemboleh ubah atau kuasa berbeza (cth: 2x, 3y)."}], "examples": [{"title": "Contoh 1", "q": "Wakilkan dengan huruf: (a) Kadar faedah setahun simpanan tetap bank. (b) Masa perjalanan Faizal ke sekolah setiap hari.", "steps": ["(a) k=kadar faedah. TETAP kerana kadar faedah simpanan tetap tidak berubah dalam tempoh setahun.", "(b) t=masa perjalanan. BERUBAH kerana masa perjalanan berbeza setiap hari."], "ans": "(a) k, tetap (b) t, berubah"}, {"title": "Contoh 2", "q": "Yusri beli 5 epal @x sen dan 8 oren @y sen. Tulis ungkapan jumlah bayaran.", "steps": ["Harga epal=5×x=5x. Harga oren=8×y=8y."], "ans": "5x+8y"}, {"title": "Contoh 3", "q": "Diberi x=3, y=2, cari nilai 8x–5y+7.", "steps": ["8(3)–5(2)+7 = 24–10+7 = 21."], "ans": "21"}, {"title": "Contoh 4", "q": "1/3 murid lelaki ialah ahli Kadet, 9 murid perempuan BUKAN ahli. (a) Ungkapan jumlah ahli. (b) Jika 12 lelaki, 16 perempuan, cari jumlah ahli.", "steps": ["(a) x=lelaki, y=perempuan. Jumlah ahli = x/3 + (y–9).", "(b) 12/3+16–9 = 4+7 = 11."], "ans": "(a) x/3+y–9 (b) 11"}, {"title": "Contoh 5", "q": "Kenal pasti sebutan: (a) x+5x (b) x/8–7y (c) pq–2q+13 (d) m²–2m+n–6", "steps": ["(a) x, 5x.", "(b) x/8, 7y.", "(c) pq, 2q, 13.", "(d) m², 2m, n, 6."], "ans": "Senarai sebutan bagi setiap ungkapan seperti di atas"}, {"title": "Contoh 6", "q": "Dalam –3k²mn, nyatakan pekali bagi (a) k²mn (b) –mn (c) 3k²", "steps": ["(a) –3k²mn=–3×k²mn → pekali=–3.", "(b) =3k²×(–mn) → pekali=3k².", "(c) =(–mn)×3k² → pekali=–mn."], "ans": "(a) –3 (b) 3k² (c) –mn"}, {"title": "Contoh 7", "q": "Serupa atau tidak: (a) 4xy,xy² (b) 12pq,12pr (c) 3abc,0.5bca (d) –7h,6h²", "steps": ["(a) kuasa y berbeza → tidak serupa.", "(b) pemboleh ubah berbeza (q vs r) → tidak serupa.", "(c) abc=bca → serupa.", "(d) kuasa h berbeza → tidak serupa."], "ans": "(a) tidak serupa (b) tidak serupa (c) serupa (d) tidak serupa"}], "exercises": [{"group": "5.1a", "title": "Latih Diri 5.1a — Pemboleh Ubah", "questions": [{"num": 1, "stem": "Wakilkan setiap pemboleh ubah berikut dengan huruf yang sesuai. Tentukan sama ada ia bernilai TETAP atau BERUBAH, dengan justifikasi.\n(a) Jisim badan setiap murid di dalam kelas anda.\n(b) Markah Zaini dalam satu ujian Matematik.\n(c) Jarak antara rumah Arman dengan sekolahnya.\n(d) Suhu di puncak Gunung Kinabalu dalam sehari.", "parts": [{"label": "a", "ans": ["berubah"], "steps": ["k = jisim badan setiap murid.", "BERUBAH kerana jisim badan setiap murid dalam kelas berbeza-beza."]}, {"label": "b", "ans": ["tetap"], "steps": ["x = markah Zaini dalam ujian itu.", "TETAP kerana ia hanya markah bagi SATU ujian sahaja (nilai tunggal, tidak berubah selepas itu)."]}, {"label": "c", "ans": ["tetap"], "steps": ["h = jarak rumah Arman ke sekolah.", "TETAP kerana jarak itu sama pada setiap kali perjalanan."]}, {"label": "d", "ans": ["berubah"], "steps": ["c = suhu di puncak Gunung Kinabalu.", "BERUBAH kerana suhu sentiasa berubah sepanjang hari."]}], "open": false, "sample": null}]}, {"group": "5.1b", "title": "Latih Diri 5.1b — Menerbitkan Ungkapan Algebra", "questions": [{"num": 1, "stem": "Tulis satu ungkapan algebra bagi setiap situasi berikut.\n(a) Tolak 7 daripada suatu nombor, x.\n(b) Hasil tambah y dan z dibahagi dengan 9.\n(c) Jumlah orang bagi x buah khemah, setiap khemah 4 orang.\n(d) Puan Neo beli m kg ikan kerisi @RMp/kg dan n kg ikan cencaru @RMq/kg. Jumlah bayaran?\n(e) Umur Nazmi h tahun, Jagjit k tahun, Izhar 2× umur Jagjit. Beza umur Nazmi dengan Izhar?", "parts": [{"label": "a", "ans": ["x-7"], "steps": ["'Tolak 7 daripada x' = x – 7."]}, {"label": "b", "ans": ["(y+z)/9"], "steps": ["Hasil tambah y dan z = y+z, dibahagi 9 = (y+z)/9."]}, {"label": "c", "ans": ["4x"], "steps": ["x khemah × 4 orang setiap khemah = 4x."]}, {"label": "d", "ans": ["mp+nq"], "steps": ["Harga kerisi = m×p = mp. Harga cencaru = n×q = nq.", "Jumlah = mp + nq."]}, {"label": "e", "ans": ["h-2k"], "steps": ["Izhar = 2k. Beza = Nazmi – Izhar = h – 2k."]}], "open": false, "sample": null}]}, {"group": "5.1c", "title": "Latih Diri 5.1c — Nilai Ungkapan Algebra", "questions": [{"num": 1, "stem": "Diberi p=5, q=2, r=–4, cari nilai bagi\n(a) 2p+q\n(b) 3q–4r+8\n(c) 5(p–r)\n(d) r/2 + 7q – 3", "parts": [{"label": "a", "ans": ["12"], "steps": ["2(5)+2 = 10+2 = 12."]}, {"label": "b", "ans": ["30"], "steps": ["3(2)–4(–4)+8 = 6+16+8 = 30."]}, {"label": "c", "ans": ["45"], "steps": ["5(5–(–4)) = 5(9) = 45."]}, {"label": "d", "ans": ["9"], "steps": ["(–4)/2 + 7(2) – 3 = –2+14–3 = 9."]}], "open": false, "sample": null}, {"num": 2, "stem": "Encik Adnan derma 8 kampit beras @x kg, Encik Tan derma 4 kampit @y kg.\n(a) Ungkapan jumlah jisim beras.\n(b) Jika x=5, y=10, hitung jumlah jisim.", "parts": [{"label": "a", "ans": ["8x+4y"], "steps": ["Jumlah = 8×x + 4×y = 8x+4y."]}, {"label": "b", "ans": ["80"], "steps": ["8(5)+4(10) = 40+40 = 80 kg."]}], "open": false, "sample": null}, {"num": 3, "stem": "Jane beli m keping dan Kamalesh beli n keping kad Hari Raya @RMp sekeping.\n(a) Ungkapan beza bayaran mereka.\n(b) Jika m=8, n=6, p=1.5, cari beza bayaran.", "parts": [{"label": "a", "ans": ["p(m-n)"], "steps": ["Bayaran Jane=mp, Kamalesh=np. Beza = mp–np = p(m–n) (atau p(n–m))."]}, {"label": "b", "ans": ["3"], "steps": ["1.5×(8–6) = 1.5×2 = RM3."]}], "open": false, "sample": null}]}, {"group": "5.1d", "title": "Latih Diri 5.1d — Sebutan dan Pekali", "questions": [{"num": 1, "stem": "Kenal pasti SEMUA sebutan bagi setiap ungkapan.\n(a) 6k + 2k\n(b) x² – 9xy\n(c) ab/3 + 2a – 5b\n(d) 4pq – 7x/2 + 8p²q – 1", "parts": [{"label": "a", "ans": ["6k,2k"], "steps": ["Sebutan: 6k dan 2k."]}, {"label": "b", "ans": ["x²,9xy"], "steps": ["Sebutan: x² dan 9xy."]}, {"label": "c", "ans": ["ab/3,2a,5b"], "steps": ["Sebutan: ab/3, 2a dan 5b."]}, {"label": "d", "ans": ["4pq,7x/2,8p²q,1"], "steps": ["Sebutan: 4pq, 7x/2, 8p²q dan 1."]}], "open": false, "sample": null}, {"num": 2, "stem": "Dalam sebutan –8xy², nyatakan pekali bagi\n(a) xy²\n(b) 8x\n(c) y²\n(d) –x", "parts": [{"label": "a", "ans": ["-8"], "steps": ["–8xy² = –8 × xy². Pekali xy² ialah –8."]}, {"label": "b", "ans": ["-y²"], "steps": ["–8xy² = (–y²) × 8x. Pekali 8x ialah –y²."]}, {"label": "c", "ans": ["-8x"], "steps": ["–8xy² = (–8x) × y². Pekali y² ialah –8x."]}, {"label": "d", "ans": ["8y²"], "steps": ["–8xy² = 8y² × (–x). Pekali –x ialah 8y²."]}], "open": false, "sample": null}]}, {"group": "5.1e", "title": "Latih Diri 5.1e — Sebutan Serupa dan Tidak Serupa", "questions": [{"num": 1, "stem": "Kenal pasti sama ada SERUPA atau TIDAK SERUPA.\n(a) 5k, –0.1k\n(b) 4y, y²\n(c) 4srt, 11rts\n(d) 3ab/2, –8bc", "parts": [{"label": "a", "ans": ["serupa"], "steps": ["Pemboleh ubah sama (k), kuasa sama (1) → SERUPA."]}, {"label": "b", "ans": ["tidak serupa"], "steps": ["Kuasa y berbeza (1 vs 2) → TIDAK SERUPA."]}, {"label": "c", "ans": ["serupa"], "steps": ["srt sama dengan rts (tertib huruf tidak penting) → SERUPA."]}, {"label": "d", "ans": ["tidak serupa"], "steps": ["Pemboleh ubah berbeza (ab vs bc) → TIDAK SERUPA."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 5.1", "title": "Mahir Diri 5.1", "questions": [{"num": 1, "stem": "Encik Gan melabur wang dalam Amanah Saham, menerima dividen mengikut kadar tahunan. Wakilkan pemboleh ubah dengan huruf sesuai, dan terangkan sama ada tetap/berubah.", "parts": [], "open": true, "sample": "k = wang yang dilaburkan (TETAP, kerana ia jumlah pelaburan awal sahaja). d = dividen yang diberi (BERUBAH, kerana kadar dividen berubah mengikut ekonomi semasa setiap tahun)."}, {"num": 2, "stem": "Tembikai 5 kg dan 2 biji durian (jisim sama) di atas penimbang menunjukkan bacaan m kg. Tulis ungkapan jisim SEBIJI durian.", "parts": [{"label": null, "ans": ["(m-5)/2"], "steps": ["Jisim 2 durian = m–5.", "Jisim sebiji durian = (m–5)/2 kg."]}], "open": false, "sample": null}, {"num": 3, "stem": "Taman segi empat tepat x m × y m. Kawasan segi empat sama bersisi 15 m ditanam bunga; selebihnya batu bata. Tulis ungkapan luas kawasan batu bata.", "parts": [{"label": null, "ans": ["xy-225"], "steps": ["Luas taman = xy m².", "Luas kawasan bunga = 15² = 225 m².", "Luas batu bata = xy – 225 m²."]}], "open": false, "sample": null}, {"num": 4, "stem": "(a) Diberi x=5, y=–2, cari nilai xy + x/2 – 6y.\n(b) Diberi a=7, b=3, c=–4, cari nilai 3(b–a) – 5ac + 14.", "parts": [{"label": "a", "ans": ["4 1/2"], "steps": ["xy = (5)(–2) = –10. x/2 = 2.5. –6y = 12.", "–10+2.5+12 = 4.5 = 4 1/2."]}, {"label": "b", "ans": ["142"], "steps": ["3(b–a) = 3(3–7) = –12.", "–5ac = –5(7)(–4) = 140.", "–12+140+14 = 142."]}], "open": false, "sample": null}, {"num": 5, "stem": "Azlan ada n keping syiling: x keping 10 sen, 3x keping 20 sen, selebihnya 50 sen.\n(a) Ungkapan bilangan syiling 50 sen.\n(b) Jika x=6 dan bilangan 50 sen = 2× bilangan 20 sen, cari jumlah wang.", "parts": [{"label": "a", "ans": ["n-4x"], "steps": ["Bilangan 50 sen = n – x – 3x = n – 4x."]}, {"label": "b", "ans": ["22.20"], "steps": ["Bilangan 20 sen = 3x = 18. Bilangan 50 sen = 2×18 = 36.", "n = 36 + 4x = 36+24 = 60 (semakan).", "Jumlah wang = (6×10)+(18×20)+(36×50) sen = 60+360+1800 = 2220 sen = RM22.20."]}], "open": false, "sample": null}, {"num": 6, "stem": "Reben p cm dipotong 3 bahagian: pertama x cm, kedua 2x cm.\n(a) Ungkapan panjang bahagian ketiga.\n(b) Jika x=10 dan bahagian kedua = 4× bahagian ketiga, cari nilai p.", "parts": [{"label": "a", "ans": ["p-3x"], "steps": ["Bahagian ketiga = p – x – 2x = p – 3x."]}, {"label": "b", "ans": ["35"], "steps": ["Bahagian kedua = 2x = 20 cm. Bahagian ketiga = 20÷4 = 5 cm.", "p = x+2x+bahagian ketiga = 10+20+5 = 35."]}], "open": false, "sample": null}, {"num": 7, "stem": "Dalam sebutan –10abc, nyatakan SATU pasangan pekali dan pemboleh ubah yang mungkin.", "parts": [], "open": true, "sample": "Contoh: pekali=–10, pemboleh ubah=abc. ATAU pekali=–10a, pemboleh ubah=bc. ATAU pekali=–10ab, pemboleh ubah=c. (Beberapa jawapan sah lain diterima.)"}]}]}, {"code": "5.2", "title": "5.2 Ungkapan Algebra yang Melibatkan Operasi Asas Aritmetik", "notes": [{"heading": "Tambah dan Tolak", "html": "Kumpulkan SEBUTAN SERUPA dahulu, kemudian tambah/tolak. Ingat: tanda '–' di depan kurungan MENUKAR tanda semua sebutan di dalamnya."}, {"heading": "Pendaraban Berulang", "html": "a×a×a...×a (n kali) = aⁿ. Ini turut berlaku untuk ungkapan: (a+b)×(a+b)×...(n kali) = (a+b)ⁿ."}, {"heading": "Darab dan Bahagi Sebutan Tunggal", "html": "Untuk darab: kumpulkan nombor dengan nombor, pemboleh ubah sama dengan pemboleh ubah sama (tambah kuasa).<br>Untuk bahagi: tulis sebagai pecahan, batalkan faktor sepunya (tolak kuasa)."}], "examples": [{"title": "Contoh 8", "q": "Permudahkan (a) (3x+5y)+(8x–y–9) (b) (12mn–4p)+(6+7p)–(10mn+p–2)", "steps": ["(a) 3x+8x+5y–y–9 = 11x+4y–9.", "(b) 12mn–10mn–4p+7p–p+6+2 = 2mn+2p+8."], "ans": "(a) 11x+4y–9 (b) 2mn+2p+8"}, {"title": "Contoh 9", "q": "Permudahkan (a) m×m×m×m (b) (x+7)×(x+7) (c) (p–3q)×(p–3q)×(p–3q)", "steps": ["(a) pendaraban berulang 4 kali.", "(b) pendaraban berulang 2 kali.", "(c) pendaraban berulang 3 kali."], "ans": "(a) m⁴ (b) (x+7)² (c) (p–3q)³"}, {"title": "Contoh 10", "q": "Tulis dalam pendara {"label": null, "ans": ["4a²b"], "steps": ["Panjang = luas ÷ lebar = 12a³b² ÷ 3ab = 4a²b cm."]}], "open": false, "sample": null}]}]}], "review": {"title": "Marilah Praktis — Ulang Kaji Bab 5", "exercises": [{"group": "Marilah Praktis", "title": "Marilah Praktis — Ulang Kaji Bab 5", "questions": [{"num": 1, "stem": "Diberi (3x²+7y–1)–(x²+2y–5)+(6x²–y) = ax²+by+c. Cari nilai a, b, c.", "parts": [{"label": null, "ans": ["a=8,b=4,c=4"], "steps": ["3x²+7y–1–x²–2y+5+6x²–y.", "x²: 3–1+6=8. y: 7–2–1=4. konstan: –1+5=4.", "a=8, b=4, c=4."]}], "open": false, "sample": null}, {"num": 2, "stem": "Pavathy beli x m kain batik @RM12/m dan y m kain langsir @RM7/m, bayar RM120. Ungkapkan bakinya.", "parts": [{"label": null, "ans": ["120-12x-7y"], "steps": ["Kos = 12x+7y.", "Baki = 120 – 12x – 7y."]}], "open": false, "sample": null}, {"num": 3, "stem": "Jika p³+2q=–5 dan 4px=6, cari nilai p³–(4px–2q).", "parts": [{"label": null, "ans": ["-11"], "steps": ["p³–(4px–2q) = p³–4px+2q = (p³+2q)–4px = –5–6 = –11."]}], "open": false, "sample": null}, {"num": 4, "stem": "Kumar beli 4 nanas @RMx, bayar RM20, terima baki 80 sen. Cari harga sebiji nanas.", "parts": [{"label": null, "ans": ["4.80"], "steps": ["4x = 20–0.80 = 19.20.", "x = 19.20÷4 = RM4.80."]}], "open": false, "sample": null}, {"num": 5, "stem": "Su Lin dapat 2× markah Daud, jumlah markah mereka 3k. Hafiz dapat 10 markah lebih daripada Su Lin. Nyatakan markah Hafiz dalam sebutan k.", "parts": [{"label": null, "ans": ["2k+10"], "steps": ["2Daud+Daud=3k → Daud=k, Su Lin=2k.", "Hafiz = Su Lin+10 = 2k+10."]}], "open": false, "sample": null}, {"num": 6, "stem": "Zuriana beli m cucuk sate @RMx bagi 5 cucuk, terima baki 80 sen. Kemudian beli 2m keping otak-otak @RMy sekeping, terima baki 60 sen.\n(a) Ungkapan jumlah bayaran sate dan otak-otak.\n(b) Jika m=10, x=4, y=1.2, cari jumlah wang diterima Zuriana daripada ibunya.", "parts": [{"label": "a", "ans": ["mx/5+2my"], "steps": ["Bayaran sate = (m/5)×x = mx/5. Bayaran otak-otak = 2m×y = 2my.", "Jumlah = mx/5 + 2my."]}, {"label": "b", "ans": ["33.40"], "steps": ["Perbelanjaan = 10(4)/5 + 2(10)(1.2) = 8+24 = 32.", "Jumlah wang = perbelanjaan + baki (0.80+0.60=1.40) = 32+1.40 = RM33.40."]}], "open": false, "sample": null}, {"num": 7, "stem": "Suatu nombor ditambah 7, hasilnya x. Nombor itu dibahagi 2, hasilnya y. Terangkan cara menentukan nilai x+y jika nombor itu diketahui.", "parts": [], "open": true, "sample": "Katakan nombor itu = n. Maka x=n+7 dan y=n/2. Jadi x+y = (n+7)+n/2 = 3n/2+7. Gantikan nilai n yang diketahui untuk dapatkan x+y."}, {"num": 8, "stem": "Kedai beli 120 lampu filamen @RMp dan 180 lampu LED @RMq. Jual secara promosi: 2 filamen+3 LED @RM(3h+4k) sebungkus, menjual SEMUA lampu. Ungkapkan keuntungan dalam sebutan p,q,h,k.", "parts": [{"label": null, "ans": ["60(3h+4k-2p-3q)", "180h+240k-120p-180q"], "steps": ["Bilangan bungkusan = 120÷2 = 60 (juga = 180÷3 = 60, konsisten).", "Jumlah jualan = 60×(3h+4k) = 180h+240k.", "Jumlah kos = 120p+180q.", "Keuntungan = 180h+240k–120p–180q = 60(3h+4k–2p–3q)."]}], "open": false, "sample": null}, {"num": 9, "stem": "Kebun Norhaimi: kawasan segi empat tepat belum dibaja berukuran melibatkan sebutan (xy+7), (2xy–1), (xy–x) dan (4x+3) meter pada pelbagai sisi. Ungkapkan panjang dawai pagar yang diperlukan mengelilingi kawasan sayur-sayuran dalam sebutan x dan y.", "parts": [{"label": null, "ans": ["6xy+8x+18"], "steps": ["Jumlahkan semua sisi luar kawasan sayur-sayuran (keliling) berdasarkan ukuran yang diberi dalam rajah asal.", "Hasil akhir (mengikut skema jawapan buku teks) = 6xy + 8x + 18 meter.", "(Nota: konfigurasi tepat rajah tidak dapat disahkan sepenuhnya daripada imbasan teks — sila rujuk rajah dalam buku fizikal untuk susunan sebenar setiap sisi.)"]}], "open": false, "sample": null}, {"num": 10, "stem": "Suhu ditukar Celsius ke Fahrenheit dengan (9/5)T+32. Cecair dipanaskan daripada 18°C ke 33°C. Berapakah PERUBAHAN suhu dalam °F?", "parts": [{"label": null, "ans": ["27"], "steps": ["Perub (function(){
"use strict";

function normalize(s){
  if (s === null || s === undefined) return "";
  s = String(s).toLowerCase().trim();
  s = s.replace(/rm/g,"").replace(/\s+/g,"").replace(/–/g,"-").replace(/—/g,"-");
  return s;
}

function toNumber(s){
  s = normalize(s);
  if (s === "") return null;
  if (/^-?\d+\/\d+$/.test(s)){
    var parts = s.split("/");
    return parseFloat(parts[0])/parseFloat(parts[1]);
  }
  if (/^-?\d+(\.\d+)?$/.test(s)){
    return parseFloat(s);
  }
  return null;
}

function fuzzyNumberMatch(input, accepted){
  var vi = toNumber(input);
  if (vi === null) return false;
  for (var i=0;i<accepted.length;i++){
    var va = toNumber(accepted[i]);
    if (va !== null && Math.abs(vi - va) < 0.005) return true;
  }
  return false;
}

function checkPart(inputRaw, acceptedList){
  var inputN = normalize(inputRaw);
  if (inputN === "") return false;
  for (var i=0;i<acceptedList.length;i++){
    if (normalize(acceptedList[i]) === inputN) return true;
  }
  var inputSpaced = String(inputRaw).toLowerCase().trim().replace(/–/g,"-");
  for (var j=0;j<acceptedList.length;j++){
    if (String(acceptedList[j]).toLowerCase().trim() === inputSpaced) return true;
  }
  if (fuzzyNumberMatch(inputRaw, acceptedList)) return true;
  return false;
}

    htmlArr.push('<div class="stem">'+nl2br(qq.stem)+(qq.open?'<span class="badge-open">Jawapan Terbuka</span>':'')+'</div>');
    if (qq.open){
      htmlArr.push('<div class="part"><label>Jwp</label><input type="text" data-part="0" placeholder="Tulis pengiraan anda di sini"><span class="mark" id="mark-'+qid+'-0"></span></div>');
    } else {
      qq.parts.forEach(function(pp, pi){
        var lbl = pp.label ? "("+pp.label+")" : "Jwp";
        htmlArr.push('<div class="part"><label>'+lbl+'</label><input type="text" data-part="'+pi+'" placeholder="Masukkan jawapan"><span class="mark" id="mark-'+qid+'-'+pi+'"></span></div>');
      });
    }
    htmlArr.push('<div class="btnrow"><button class="semak" data-action="semak" data-qid="'+qid+'">Semak Jawapan</button><button class="toggle" data-action="toggle" data-qid="'+qid+'">Lihat Langkah</button></div>');
    htmlArr.push('<div class="solution" id="sol-'+qid+'">');
    if (qq.open){
      htmlArr.push('<h4>Contoh Jawapan (jawapan lain yang sah turut diterima)</h4><p>'+qq.sample+'</p>');
    } else {
      qq.parts.forEach(function(pp){
        var lbl = pp.label ? "("+pp.label+")" : "";
        htmlArr.push('<h4>Langkah Penyelesaian '+lbl+'</h4><ol>');
        pp.steps.forEach(function(st){ htmlArr.push('<li>'+st+'</li>'); });
        htmlArr.push('</ol><div class="final">Jawapan: '+pp.ans[0]+'</div>');
      });
    }
    htmlArr.push('</div>'); // solution
    htmlArr.push('</div>'); // qcard
    QMAP[qid] = qq;
  });
}

var QMAP = {};

function setTitles(){
  var t = "Bab " + CHAPTER.chapterCode + " — " + CHAPTER.chapterTitle;
  document.getElementById("chapTitleText").textContent = t;
  document.getElementById("pageTitle").textContent = t + " | Matematik Tingkatan 1";
}

function render(){
  setTitles();
  var htmlArr = [];
  CHAPTER.subtopics.forEach(function(st){
    htmlArr.push('<section class="subtopic" id="st-'+st.code+'"><h2>'+st.title+'</h2>');
    st.notes.forEach(function(n){
      htmlArr.push('<div class="notabox"><h3>📝 Nota — '+n.heading+'</h3><div>'+n.html+'</div></div>');
    });
    st.examples.forEach(function(ex){
      htmlArr.push('<div class="contohbox"><h3>📖 '+ex.title+'</h3><div class="q">'+nl2br(ex.q)+'</div><ol>');
      ex.steps.forEach(function(s){ htmlArr.push('<li>'+s+'</li>'); });
      htmlArr.push('</ol><div class="final">Jawapan: '+ex.ans+'</div></div>');
    });
    htmlArr.push('<h3 class="latihan-head">✏️ Latihan</h3>');
    st.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
    htmlArr.push('</section>');
  });
  htmlArr.push('<section class="subtopic" id="review-sec"><h2>'+CHAPTER.review.title+'</h2><h3 class="latihan-head">✏️ Latihan Ulang Kaji</h3>');
  CHAPTER.review.exercises.forEach(function(grp){ renderExerciseGroup(grp, htmlArr); });
  htmlArr.push('</section>');
  document.getElementById("content").innerHTML = htmlArr.join("");
}

function onSemak(qid){
  var qq = QMAP[qid];
  var card = document.getElementById("card-"+qid);
  var alreadyChecked = card.getAttribute("data-checked") === "1";

  if (qq.open){
    var inp = card.querySelector('input[data-part="0"]');
    var val = inp.value.trim();
    var mark = document.getElementById("mark-"+qid+"-0");
    if (val.length > 0){ mark.textContent = "✅"; inp.classList.add("correct"); } else { mark.textContent = ""; }
    document.getElementById("sol-"+qid).classList.add("show");
    if (!alreadyChecked){
      checkedCount++; correctPartsCount += 1; card.setAttribute("data-checked","1"); updateProgress();
    }
    document.getElementById("status-"+qid).textContent = "📝";
    return;
  }

  var allCorrect = true, correctHere = 0;
  qq.parts.forEach(function(pp, pi){
    var inp = card.querySelector('input[data-part="'+pi+'"]');
    var mark = document.getElementById("mark-"+qid+"-"+pi);
    var ok = checkPart(inp.value, pp.ans);
    inp.classList.remove("correct","wrong");
    if (ok){ inp.classList.add("correct"); mark.textContent = "✅"; correctHere++; }
    else { inp.classList.add("wrong"); mark.textContent = "❌"; allCorrect = false; }
  });

  document.getElementById("sol-"+qid).classList.add("show");
  document.getElementById("status-"+qid).textContent = allCorrect ? "✅" : "❌";

  if (!alreadyChecked){
    checkedCount++; correctPartsCount += correctHere;
    card.setAttribute("data-checked","1"); card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  } else {
    var prevCorrect = parseInt(card.getAttribute("data-correct-count")||"0",10);
    correctPartsCount += (correctHere - prevCorrect);
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  }
}

function onToggle(qid){
  document.getElementById("sol-"+qid).classList.toggle("show");
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches('button[data-action="semak"]')) onSemak(t.getAttribute("data-qid"));
  else if (t.matches('button[data-action="toggle"]')) onToggle(t.getAttribute("data-qid"));
});

window.addEventListener("scroll", function(){
  document.getElementById("backTop").style.display = window.scrollY > 400 ? "block" : "none";
});

buildToc();
render();
updateProgress();

})();

</script>
