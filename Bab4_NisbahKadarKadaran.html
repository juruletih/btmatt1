<script>
window.__CHAPTER_DATA__ = {"chapterCode": "4", "chapterTitle": "Nisbah, Kadar dan Kadaran", "subtopics": [{"code": "4.1", "title": "4.1 Nisbah", "notes": [{"heading": "Nisbah Dua dan Tiga Kuantiti", "html": "<b>Nisbah</b> membandingkan dua atau lebih kuantiti jenis SAMA dalam unit yang SAMA, ditulis a:b atau a:b:c. Nisbah TIDAK mempunyai unit.<br>Jika unit berbeza, tukar kepada unit sama dahulu sebelum menulis nisbah."}, {"heading": "Nisbah Setara", "html": "<b>Nisbah setara</b> diperoleh dengan mendarab atau membahagi SETIAP bahagian nisbah dengan nombor bulat yang sama. Contoh: 1:2 = 2:4 = 6:12."}, {"heading": "Bentuk Termudah", "html": "Nisbah a:b dalam <b>bentuk termudah</b> apabila a dan b tiada faktor sepunya kecuali 1. Bahagikan dengan FSTB, atau darabkan dengan GSTK jika melibatkan pecahan/perpuluhan."}], "examples": [{"title": "Contoh 1", "q": "Wakilkan nisbah 0.02 m kepada 3 cm kepada 4.6 cm dalam bentuk a:b:c.", "steps": ["Tukar kepada cm: 2 cm, 3 cm, 4.6 cm.", "Darab dengan 10 (buang perpuluhan): 20:30:46.", "Bahagi dengan FSTB=2: 10:15:23."], "ans": "10 : 15 : 23"}, {"title": "Contoh 2", "q": "Antara 9:15, 5:3, 54:90, 1/2:5/6 — manakah setara dengan 27:45?", "steps": ["27:45 ÷3 = 9:15 (setara).", "27:45 ÷9 = 3:5 (BUKAN 5:3, jadi 5:3 tidak setara).", "27:45 ×2 = 54:90 (setara).", "27:45 ÷54 = 1/2:5/6 (setara)."], "ans": "9:15, 54:90, dan 1/2:5/6 setara dengan 27:45 (5:3 bukan)"}, {"title": "Contoh 3", "q": "Puan Habibah campur 4 cawan cuka dengan 8 cawan air. Tentukan DUA nisbah setara.", "steps": ["4:8 ×2 = 8:16.", "4:8 ÷2 = 2:4."], "ans": "8:16 dan 2:4"}, {"title": "Contoh 4", "q": "Ungkapkan dalam bentuk termudah: (a) 800g:1.8kg (b) 32:24:20 (c) 3/5:7/10 (d) 0.04:0.12:0.56", "steps": ["(a) 800g:1800g ÷200 = 4:9.", "(b) ÷FSTB(4) = 8:6:5.", "(c) ×GSTK(10) = 6:7.", "(d) ×100=4:12:56, ÷FSTB(4)=1:3:14."], "ans": "(a) 4:9 (b) 8:6:5 (c) 6:7 (d) 1:3:14"}], "exercises": [{"group": "4.1a", "title": "Latih Diri 4.1a — Nisbah Tiga Kuantiti", "questions": [{"num": 1, "stem": "Wakilkan hubungan antara tiga kuantiti berikut dalam bentuk a : b : c.\n(a) 2 minggu kepada 16 hari kepada 1 minggu\n(b) 0.1 kg kepada 50 g kepada 0.25 kg\n(c) 4 minit kepada 120 saat kepada 1.6 jam\n(d) 3 1/5 m kepada 480 cm kepada 6400 mm", "parts": [{"label": "a", "ans": ["14:16:7"], "steps": ["Tukar kepada unit sama (hari): 2 minggu=14 hari, 16 hari, 1 minggu=7 hari.", "Nisbah = 14 : 16 : 7."]}, {"label": "b", "ans": ["2:1:5"], "steps": ["Tukar kepada g: 100 g, 50 g, 250 g.", "Bahagi dengan FSTB=50: 2 : 1 : 5."]}, {"label": "c", "ans": ["2:1:48"], "steps": ["Tukar kepada saat: 240 s, 120 s, 5760 s (1.6 jam = 1.6×3600).", "Bahagi dengan FSTB=120: 2 : 1 : 48."]}, {"label": "d", "ans": ["2:3:4"], "steps": ["Tukar kepada mm: 3200 mm, 4800 mm, 6400 mm.", "Bahagi dengan FSTB=1600: 2 : 3 : 4."]}], "open": false, "sample": null}, {"num": 2, "stem": "Tahir membayar RM5.60 untuk nasi beriani, RM1.20 untuk teh dan 30 sen untuk kuih. Wakilkan hubungan harga dalam bentuk a : b : c.", "parts": [{"label": null, "ans": ["56:12:3"], "steps": ["Tukar kepada sen: 560 sen, 120 sen, 30 sen.", "Bahagi dengan FSTB=10: 56 : 12 : 3."]}], "open": false, "sample": null}]}, {"group": "4.1b", "title": "Latih Diri 4.1b — Nisbah Setara", "questions": [{"num": 1, "stem": "Antara berikut, kenal pasti nisbah yang SETARA dengan 18 : 24 : 45.\n3 : 4 : 9   36 : 48 : 90   0.6 : 0.8 : 1.5   2/5 : 8/15 : 1", "parts": [{"label": null, "ans": ["36:48:90, 0.6:0.8:1.5, 2/5:8/15:1"], "steps": ["Bahagi 18:24:45 dengan 3: 6:8:15. Darab 3:4:9 dengan 3: 9:12:27 — TIDAK setara.", "18:24:45 × 2 = 36:48:90 — SETARA.", "18:24:45 ÷ 30 = 0.6:0.8:1.5 — SETARA.", "18:24:45 ÷ 45 = 2/5:8/15:1 — SETARA.", "Maka nisbah setara: 36:48:90, 0.6:0.8:1.5, dan 2/5:8/15:1."]}], "open": false, "sample": null}, {"num": 2, "stem": "Kenal pasti dan tentukan DUA nisbah setara bagi 3 : 9.", "parts": [{"label": null, "ans": ["1:3,6:18"], "steps": ["3:9 ÷ 3 = 1:3.", "3:9 × 2 = 6:18.", "Dua nisbah setara: 1:3 dan 6:18 (atau jawapan sah lain)."]}], "open": false, "sample": null}, {"num": 3, "stem": "Seorang pekerja membancuh konkrit dengan 10 bahagian simen, 20 bahagian pasir dan 30 bahagian batu kelikir. Kenal pasti DUA nisbah setara yang mungkin.", "parts": [{"label": null, "ans": ["1:2:3,2:4:6"], "steps": ["10:20:30 ÷ 10 = 1:2:3.", "10:20:30 ÷ 5 = 2:4:6.", "Dua nisbah setara: 1:2:3 dan 2:4:6 (atau jawapan sah lain)."]}], "open": false, "sample": null}]}, {"group": "4.1c", "title": "Latih Diri 4.1c — Bentuk Termudah Nisbah", "questions": [{"num": 1, "stem": "Ungkapkan setiap nisbah berikut dalam bentuk termudah.\n(a) 240 g : 1.6 kg\n(b) 30 : 42 : 48\n(c) 2/5 : 8/9\n(d) 0.09 : 0.12 : 0.24", "parts": [{"label": "a", "ans": ["3:20"], "steps": ["Tukar unit: 240 g : 1600 g.", "Bahagi dengan FSTB=80: 3 : 20."]}, {"label": "b", "ans": ["5:7:8"], "steps": ["Bahagi dengan FSTB=6: 5 : 7 : 8."]}, {"label": "c", "ans": ["9:20"], "steps": ["Darab dengan GSTK(5,9)=45: 18 : 40.", "Bahagi dengan FSTB=2: 9 : 20."]}, {"label": "d", "ans": ["3:4:8"], "steps": ["Darab dengan 100: 9 : 12 : 24.", "Bahagi dengan FSTB=3: 3 : 4 : 8."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 4.1", "title": "Mahir Diri 4.1", "questions": [{"num": 1, "stem": "Tiga segi empat sama A, B, C bersisi 2 cm, 3 cm, 4 cm.\n(a)(i) Nisbah panjang sisi A:B:C\n(a)(ii) Nisbah perimeter A:B:C\n(a)(iii) Nisbah luas A:B:C\n(b) Tulis satu nisbah setara berdasarkan (a)(iii).\n(c) Apakah hubungan antara nombor dalam nisbah luas dengan nisbah panjang sisi?", "parts": [{"label": "i", "ans": ["2:3:4"], "steps": ["Panjang sisi terus dibandingkan: 2:3:4."]}, {"label": "ii", "ans": ["8:12:16"], "steps": ["Perimeter = 4×sisi setiap satu: 8:12:16 (nisbah sama dengan 2:3:4 ×4)."]}, {"label": "iii", "ans": ["4:9:16"], "steps": ["Luas = sisi² setiap satu: 4:9:16."]}, {"label": "b", "ans": ["8:18:32"], "steps": ["4:9:16 × 2 = 8:18:32 (atau gandaan lain yang sah)."]}, {"label": "c", "ans": ["kuasa dua"], "steps": ["Nombor dalam nisbah luas ialah KUASA DUA nombor sepadan dalam nisbah panjang sisi (2²=4, 3²=9, 4²=16)."]}], "open": false, "sample": null}, {"num": 2, "stem": "Mekanik menggunakan bicu berdaya 120 paun untuk mengangkat kereta berjisim 1350 kg. Nyatakan nisbah jisim kereta kepada daya, dalam bentuk termudah. (1 paun = 0.45 kg)", "parts": [{"label": null, "ans": ["25:1"], "steps": ["Daya = 120 paun = 120×0.45 = 54 kg.", "Nisbah = 1350 : 54.", "Bahagi dengan FSTB=54: 25 : 1."]}], "open": false, "sample": null}, {"num": 3, "stem": "Jadual murid: Kelas 1 Amanah (12L,16P), 1 Bestari (9L,20P), 1 Cekap (9L,12P).\n(a) Kelas manakah mempunyai nisbah perempuan:lelaki SAMA?\n(b) Tulis nisbah perempuan Amanah:Bestari:Cekap.\n(c) Jika Amanah & Bestari digabung semasa PJPK, cari nisbah perempuan:lelaki gabungan (bentuk termudah).", "parts": [{"label": "a", "ans": ["amanah dan cekap"], "steps": ["Amanah: 16:12=4:3. Bestari: 20:9 (tak dapat dipermudah ke 4:3). Cekap: 12:9=4:3.", "Kelas 1 Amanah dan 1 Cekap mempunyai nisbah SAMA (4:3)."]}, {"label": "b", "ans": ["16:20:12"], "steps": ["Terus bandingkan bilangan perempuan setiap kelas: 16:20:12."]}, {"label": "c", "ans": ["12:7"], "steps": ["Gabungan: perempuan=16+20=36, lelaki=12+9=21.", "36:21 ÷ 3 = 12:7."]}], "open": false, "sample": null}, {"num": 4, "stem": "Kenal pasti nisbah setara bagi 1 : 5.", "parts": [], "open": true, "sample": "Contoh nisbah setara bagi 1:5 ialah 2:10, 3:15, atau sebarang gandaan k:5k dengan k>0."}, {"num": 5, "stem": "Kenal pasti DUA nisbah setara bagi setiap pecahan bahagian berlorek dalam suatu rajah, jika nisbah asasnya (a) 5:9 (b) 5:12.", "parts": [{"label": "a", "ans": ["15:27"], "steps": ["5:9 × 3 = 15:27."]}, {"label": "b", "ans": ["10:24,15:36"], "steps": ["5:12 × 2 = 10:24.", "5:12 × 3 = 15:36."]}], "open": false, "sample": null}, {"num": 6, "stem": "Pekebun sediakan medium semaian dengan 3 bahagian tanah loam, 2 bahagian tanah organik, 1 bahagian pasir sungai. Kenal pasti DUA nisbah setara yang mungkin.", "parts": [{"label": null, "ans": ["6:4:2,18:12:6"], "steps": ["3:2:1 × 2 = 6:4:2.", "3:2:1 × 6 = 18:12:6.", "(atau jawapan sah lain)"]}], "open": false, "sample": null}]}]}, {"code": "4.2", "title": "4.2 Kadar", "notes": [{"heading": "Apakah Kadar?", "html": "<b>Kadar</b> ialah kes khas nisbah yang membandingkan DUA kuantiti dengan UNIT BERBEZA. Contoh: 285 km/3 jam (jarak & masa)."}, {"heading": "Menukar Unit Kadar", "html": "Untuk banding kadar, tukar kepada unit SAMA dahulu (cth: kg/m³ ke g/cm³, atau m/s ke km/j) sebelum membuat perbandingan."}], "examples": [{"title": "Contoh 5", "q": "Nyatakan kadar dan kuantiti terlibat: (a) Fatin beli 2kg mangga RM10 (b) Kereta guna 1 liter petrol untuk 12km.", "steps": ["(a) Kadar=RM10/2kg. Kuantiti: jisim(kg), wang(RM).", "(b) Kadar=12km/1liter. Kuantiti: jarak(km), isipadu(liter)."], "ans": "(a) RM10/2kg (b) 12km/1liter"}, {"title": "Contoh 6", "q": "(a) Tukar 5 m/s kepada km/j. (b) Tukar ketumpatan 2700 kg/m³ kepada g/cm³.", "steps": ["(a) 5m/s = 5÷1000 km ÷ (1/3600) jam = 5×3600/1000 = 18 km/j.", "(b) 2700kg/m³ = 2700×1000g ÷ (100×100×100)cm³ = 2.7 g/cm³."], "ans": "(a) 18 km/j (b) 2.7 g/cm³"}], "exercises": [{"group": "4.2a", "title": "Latih Diri 4.2a — Mengenal Kadar", "questions": [{"num": 1, "stem": "Nyatakan kadar dan DUA kuantiti (termasuk unit) yang terlibat.\n(a) Tambang kereta api 2 penumpang dewasa JB-KL ialah RM154.\n(b) 20 liter air mengalir keluar setiap kali dipam.\n(c) Yuran tuisyen Haruiri RM240 untuk 4 mata pelajaran.\n(d) Baja untuk kebun 10 hektar ialah RM500.\n(e) Gandar enjin berputar 600 putaran dalam 3 saat.", "parts": [{"label": "a", "ans": ["rm154/2 penumpang; wang(rm) dan bilangan penumpang"], "steps": ["Kadar = RM154/2 orang penumpang.", "Kuantiti: jumlah wang (RM) dan bilangan penumpang (orang)."]}, {"label": "b", "ans": ["20 liter/1 kali; isipadu(liter) dan bilangan kali"], "steps": ["Kadar = 20 liter/1 kali pam.", "Kuantiti: isi padu (liter) dan bilangan kali pam."]}, {"label": "c", "ans": ["rm240/4 matapelajaran; wang(rm) dan bilangan matapelajaran"], "steps": ["Kadar = RM240/4 mata pelajaran.", "Kuantiti: jumlah wang (RM) dan bilangan mata pelajaran."]}, {"label": "d", "ans": ["rm500/10 hektar; wang(rm) dan luas(hektar)"], "steps": ["Kadar = RM500/10 hektar.", "Kuantiti: jumlah wang (RM) dan luas (hektar)."]}, {"label": "e", "ans": ["600 putaran/3 saat; bilangan putaran dan masa(saat)"], "steps": ["Kadar = 600 putaran/3 saat.", "Kuantiti: bilangan putaran dan masa (saat)."]}], "open": false, "sample": null}, {"num": 2, "stem": "Objek A bergerak 25 m per saat manakala Objek B bergerak 8 km per jam. Tukarkan unit untuk menentukan objek yang lebih laju.", "parts": [{"label": null, "ans": ["objek a"], "steps": ["Tukar A ke km/j: 25 m/s = 25×3600/1000 = 90 km/j.", "B = 8 km/j.", "90 km/j > 8 km/j, maka OBJEK A lebih laju."]}], "open": false, "sample": null}, {"num": 3, "stem": "Jisim per unit luas sejenis kepingan logam ialah 3 kg per m². Nyatakan kadar itu dalam g per 100 cm².", "parts": [{"label": null, "ans": ["30"], "steps": ["1 m² = 10 000 cm². 3 kg = 3000 g.", "Kadar = 3000 g ÷ 10 000 cm² = 0.3 g per cm² = 30 g per 100 cm²."]}], "open": false, "sample": null}, {"num": 4, "stem": "Sebuah ladang kelapa sawit guna baja pada kadar 350 kg per hektar. Nyatakan dalam g per m². [1 hektar = 10 000 m²]", "parts": [{"label": null, "ans": ["35"], "steps": ["350 kg = 350 000 g.", "Kadar = 350 000 g ÷ 10 000 m² = 35 g per m²."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 4.2", "title": "Mahir Diri 4.2", "questions": [{"num": 1, "stem": "Seketul aluminium berisi padu 5 cm³ mempunyai jisim 13.5 g. Cari ketumpatan aluminium itu dalam g per cm³.", "parts": [{"label": null, "ans": ["2.7"], "steps": ["Ketumpatan = jisim ÷ isi padu = 13.5 ÷ 5 = 2.7 g/cm³."]}], "open": false, "sample": null}, {"num": 2, "stem": "Jadual jisim orang utan: Borneo (lahir 0.3 kg, 60 hari 6.3 kg), Sumatera (lahir 0.7 kg, 60 hari 7.7 kg).\n(a)(i) Nisbah jisim lahir:60hari bagi kedua-dua spesies.\n(a)(ii) Kadar pertumbuhan kedua-dua spesies (kg per 60 hari).\n(b) Nyatakan dua kuantiti yang terlibat dalam kadar (a)(ii).", "parts": [{"label": "i", "ans": ["borneo 1:21, sumatera 1:11"], "steps": ["Borneo: 0.3:6.3 ÷0.3 = 1:21.", "Sumatera: 0.7:7.7 ÷0.7 = 1:11."]}, {"label": "ii", "ans": ["borneo 6kg/60hari, sumatera 7kg/60hari"], "steps": ["Pertambahan Borneo = 6.3–0.3 = 6 kg dalam 60 hari.", "Pertambahan Sumatera = 7.7–0.7 = 7 kg dalam 60 hari."]}, {"label": "b", "ans": ["jisim(kg) dan masa(hari)"], "steps": ["Dua kuantiti: jisim (kg) dan masa (hari)."]}], "open": false, "sample": null}, {"num": 3, "stem": "Susu kotak: 250 ml @RM2.25, 500 ml @RM4.00, 1 liter @RM7.50.\n(a) Tulis kadar harga setiap susu.\n(b) Harga per liter bagi susu 500 ml.\n(c) Susu manakah paling menjimatkan? Justifikasikan.", "parts": [{"label": "a", "ans": ["rm2.25/250ml, rm4.00/500ml, rm7.50/1000ml"], "steps": ["Kadar harga: RM2.25/250ml, RM4.00/500ml, RM7.50/1000ml (terus daripada data)."]}, {"label": "b", "ans": ["8.00"], "steps": ["RM4.00/500ml × 2 = RM8.00 per liter."]}, {"label": "c", "ans": ["susu kotak 1 liter"], "steps": ["250ml: RM2.25×4=RM9.00/liter. 500ml: RM8.00/liter (dari (b)). 1 liter: RM7.50/liter.", "Susu kotak 1 liter PALING MENJIMATKAN kerana harga per liternya paling rendah."]}], "open": false, "sample": null}]}]}, {"code": "4.3", "title": "4.3 Kadaran", "notes": [{"heading": "Apakah Kadaran?", "html": "<b>Kadaran</b> ialah hubungan yang menyatakan KESAMAAN antara dua nisbah atau dua kadar, ditulis dalam bentuk pecahan: a/b = c/d."}, {"heading": "Mencari Nilai Tidak Diketahui", "html": "3 kaedah utama: (1) <b>Kaedah unitari</b> — cari nilai bagi SATU unit dahulu. (2) <b>Kaedah kadaran</b> — darab/bahagi kedua-dua bahagian dengan faktor sama. (3) <b>Kaedah pendaraban silang</b> — jika a/b=c/d, maka a×d=b×c."}], "examples": [{"title": "Contoh 7", "q": "Tulis kadaran: (a) 10 kacang 17g, 30 kacang 51g. (b) 1cm peta mewakili 50km, 23.6cm mewakili 1180km.", "steps": ["(a) 17g/10biji = 51g/30biji.", "(b) 50km/1cm = 1180km/23.6cm."], "ans": "(a) 17/10=51/30 (b) 50/1=1180/23.6"}, {"title": "Contoh 8", "q": "Kos elektrik 43.6 sen bagi 2 kWj. Kos untuk 30 kWj?", "steps": ["Kaedah unitari: 1 kWj = 43.6÷2 = 21.8 sen. 30 kWj = 30×21.8 = 654 sen.", "Kaedah pendaraban silang: 43.6/2 = x/30 → x = 43.6×30÷2 = 654."], "ans": "654 sen = RM6.54"}], "exercises": [{"group": "4.3a", "title": "Latih Diri 4.3a — Menulis Kadaran", "questions": [{"num": 1, "stem": "Tulis satu kadaran bagi setiap situasi berikut.\n(a) 3 biji bola RM5, maka 12 biji bola RM20.\n(b) 4 blok kayu tinggi 24 cm, 13 blok tinggi 78 cm.\n(c) 13 murid lelaki:15 murid perempuan setiap kelas; 65 lelaki maka 75 perempuan.", "parts": [{"label": "a", "ans": ["rm5/3biji=rm20/12biji"], "steps": ["Kadaran: RM5/3 biji = RM20/12 biji."]}, {"label": "b", "ans": ["24cm/4blok=78cm/13blok"], "steps": ["Kadaran: 24 cm/4 blok = 78 cm/13 blok."]}, {"label": "c", "ans": ["13lelaki/15perempuan=65lelaki/75perempuan"], "steps": ["Kadaran: 13 lelaki/15 perempuan = 65 lelaki/75 perempuan."]}], "open": false, "sample": null}]}, {"group": "4.3b", "title": "Latih Diri 4.3b — Nilai Tidak Diketahui dalam Kadaran", "questions": [{"num": 1, "stem": "200 pemain dalam 8 pasukan ragbi (sama rata). Tentukan bilangan pemain dalam 2 pasukan.", "parts": [{"label": null, "ans": ["50"], "steps": ["Kaedah unitari: 1 pasukan = 200÷8 = 25 pemain.", "2 pasukan = 2×25 = 50 pemain."]}], "open": false, "sample": null}, {"num": 2, "stem": "Amir buat 60 tekan tubi dalam 3 minit. Berapa kali dalam 5 minit (kadar sama)?", "parts": [{"label": null, "ans": ["100"], "steps": ["Kadar = 60÷3 = 20 kali/minit.", "Dalam 5 minit = 5×20 = 100 kali."]}], "open": false, "sample": null}, {"num": 3, "stem": "Peladang tanam 3 pokok cili per 0.5 m². Berapa pokok cili dalam kawasan 85 m²?", "parts": [{"label": null, "ans": ["510"], "steps": ["Kadar = 3÷0.5 = 6 pokok/m².", "85 m² × 6 = 510 pokok cili."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 4.3", "title": "Mahir Diri 4.3", "questions": [{"num": 1, "stem": "Gear besar berputar 4 kali apabila gear kecil berputar 18 kali. Berapa kali gear besar berputar jika gear kecil berputar 54 kali?", "parts": [{"label": null, "ans": ["12"], "steps": ["Kadaran: 4/18 = x/54.", "x = 4×54÷18 = 12 kali."]}], "open": false, "sample": null}, {"num": 2, "stem": "Tukang kebun ambil 0.5 jam memotong rumput kawasan 20m×15m, upah RM30/jam. Berapa upah untuk kawasan 40m×30m?", "parts": [{"label": null, "ans": ["60"], "steps": ["Luas asal = 300 m². Luas baharu = 1200 m² (4× lebih besar).", "Masa baharu = 0.5×4 = 2 jam.", "Upah = 2×RM30 = RM60."]}], "open": false, "sample": null}, {"num": 3, "stem": "Jika 175 ml minyak zaitun perlukan 50 ml cuka, berapa ml cuka perlu bagi 300 ml minyak zaitun (kadar sama)?", "parts": [{"label": null, "ans": ["85.71", "600/7"], "steps": ["Kadaran: 175/50 = 300/x.", "x = 300×50÷175 = 85.71 ml (2 d.p.)."]}], "open": false, "sample": null}]}]}, {"code": "4.4", "title": "4.4 Nisbah, Kadar dan Kadaran", "notes": [{"heading": "Menggabungkan Nisbah", "html": "Untuk cari p:q:r apabila diberi p:q dan q:r berasingan, SAMAKAN nilai q dahulu (guna GSTK jika perlu), kemudian gabungkan."}, {"heading": "Menyelesaikan Masalah Anggaran (Tangkap-Tanda-Lepas)", "html": "Kaedah anggaran populasi: (bilangan bertanda ditangkap semula) / (jumlah ditangkap semula) = (jumlah ditanda asal) / (populasi keseluruhan)."}], "examples": [{"title": "Contoh 9", "q": "Jika p:q=7:3 dan q:r=3:5, cari p:q:r.", "steps": ["Nilai q (3) sudah sama pada kedua-dua nisbah."], "ans": "p:q:r = 7:3:5"}, {"title": "Contoh 10", "q": "Nisbah buku cerita:rujukan=2:5. Nisbah rujukan:majalah=3:2. Cari cerita:rujukan:majalah.", "steps": ["Samakan nilai 'rujukan': GSTK(5,3)=15.", "2:5=6:15 (×3). 3:2=15:10 (×5)."], "ans": "6:15:10"}, {"title": "Contoh 11", "q": "Nisbah tepung:air=5:3. Jika tepung 480g, cari jisim air.", "steps": ["1 bahagian = 480÷5 = 96g.", "Air = 3×96 = 288g."], "ans": "288 g"}, {"title": "Contoh 12", "q": "Derma kantin:SyarikatBukuJaya:PIBG = 2:6:5. PIBG derma RM900. Cari derma kantin dan Syarikat Buku Jaya.", "steps": ["1 bahagian = 900÷5 = RM180.", "Kantin = 2×180=RM360. Syarikat Buku Jaya = 6×180=RM1080."], "ans": "RM360 dan RM1080"}, {"title": "Contoh 13", "q": "Dawai 12cm dibahagi 3 bahagian PQ,QR,RS. PQ:QR=3:2, RS=2cm. Cari PQ:QR:RS.", "steps": ["PR = 12–2 = 10cm.", "Jumlah bahagian PQ+QR = 5. 1 bahagian = 10÷5=2cm.", "PQ=3×2=6cm, QR=2×2=4cm."], "ans": "PQ:QR:RS = 6:4:2 = 3:2:1"}, {"title": "Contoh 14", "q": "Denyutan jantung 420 kali dalam 4 minit. Cari denyutan dalam 12 minit.", "steps": ["Kadaran: 420/4 = x/12.", "x = 420×12÷4 = 1260."], "ans": "1260 kali"}, {"title": "Contoh 15", "q": "Kaedah tangkap-tanda: 24 siput ditanda, tangkap semula 30 ekor dengan 5 bertanda. Anggarkan populasi.", "steps": ["5/30 = 24/x.", "x = 24×30÷5 = 144."], "ans": "144 ekor"}], "exercises": [{"group": "4.4a", "title": "Latih Diri 4.4a — Menggabungkan Nisbah", "questions": [{"num": 1, "stem": "Jika p : q = 2 : 9 dan q : r = 9 : 7, cari nisbah p : q : r.", "parts": [{"label": null, "ans": ["2:9:7"], "steps": ["Nilai q (9) sudah SAMA dalam kedua-dua nisbah, terus gabungkan.", "p : q : r = 2 : 9 : 7."]}], "open": false, "sample": null}, {"num": 2, "stem": "Wang derma P:Q = 2:3, Q:R = 4:1. Cari nisbah P:Q:R.", "parts": [{"label": null, "ans": ["8:12:3"], "steps": ["Samakan nilai Q: GSTK(3,4)=12.", "P:Q=2:3=8:12 (×4). Q:R=4:1=12:3 (×3).", "P:Q:R = 8:12:3."]}], "open": false, "sample": null}]}, {"group": "4.4b", "title": "Latih Diri 4.4b — Mencari Nilai daripada Nisbah", "questions": [{"num": 1, "stem": "Nisbah harga baju kebaya:kurung = 7:4. Baju kebaya RM84. Cari harga baju kurung.", "parts": [{"label": null, "ans": ["48"], "steps": ["1 bahagian = 84÷7 = RM12.", "Baju kurung = 4×12 = RM48."]}], "open": false, "sample": null}, {"num": 2, "stem": "Nisbah jisim Encik Arif:anak = 3:2. Jisim anak 42 kg. Cari jisim Encik Arif.", "parts": [{"label": null, "ans": ["63"], "steps": ["1 bahagian = 42÷2 = 21 kg.", "Encik Arif = 3×21 = 63 kg."]}], "open": false, "sample": null}, {"num": 3, "stem": "Zanariah:Rusita:Hanifah bayar hadiah mengikut nisbah 5:3:2. Hanifah bayar RM50. Cari jumlah bayaran Zanariah dan Rusita.", "parts": [{"label": null, "ans": ["200"], "steps": ["1 bahagian = 50÷2 = RM25.", "Zanariah = 5×25 = RM125. Rusita = 3×25 = RM75.", "Jumlah = 125+75 = RM200."]}], "open": false, "sample": null}, {"num": 4, "stem": "Kadir:Chandran:Ping Wei jawab soalan mengikut nisbah 4:6:3. Chandran jawab 30 soalan. Cari jumlah soalan dijawab Kadir dan Ping Wei.", "parts": [{"label": null, "ans": ["35"], "steps": ["1 bahagian = 30÷6 = 5.", "Kadir = 4×5 = 20. Ping Wei = 3×5 = 15.", "Jumlah = 20+15 = 35 soalan."]}], "open": false, "sample": null}, {"num": 5, "stem": "42 murid daftar 3 kelab: Komputer, Robotik, Taekwondo. Bilangan Robotik = 1/3 bilangan Komputer. Bilangan Taekwondo = 14. Cari nisbah Komputer:Robotik:Taekwondo.", "parts": [{"label": null, "ans": ["3:1:2"], "steps": ["K + K/3 + 14 = 42 → (4K/3) = 28 → K = 21.", "Robotik = 21/3 = 7.", "Nisbah = 21:7:14 ÷7 = 3:1:2."]}], "open": false, "sample": null}]}, {"group": "4.4c", "title": "Latih Diri 4.4c — Nilai daripada Kadar", "questions": [{"num": 1, "stem": "Berjalan bakar 2.9 kalori/minit. Berapa kalori dibakar dalam 20 minit?", "parts": [{"label": null, "ans": ["58"], "steps": ["2.9 × 20 = 58 kalori."]}], "open": false, "sample": null}, {"num": 2, "stem": "6 kotak jus limau RM12.25. Tentukan harga 24 kotak.", "parts": [{"label": null, "ans": ["49.00"], "steps": ["24 kotak = 4× lebih banyak daripada 6 kotak.", "Harga = 4 × RM12.25 = RM49.00."]}], "open": false, "sample": null}, {"num": 3, "stem": "8 cawan tepung buat 60 keping biskut. Berapa cawan perlu untuk 15 keping (kadar sama)?", "parts": [{"label": null, "ans": ["2"], "steps": ["Kadar = 8÷60 cawan/keping.", "15 keping = 15×8/60 = 2 cawan."]}], "open": false, "sample": null}, {"num": 4, "stem": "USD1 = RM3.90. Ahmad beri RM200, terima balik RM5 serta mata wang USD. Berapa USD diterima?", "parts": [{"label": null, "ans": ["50"], "steps": ["RM digunakan untuk USD = 200–5 = RM195.", "USD = 195 ÷ 3.90 = 50."]}], "open": false, "sample": null}]}, {"group": "4.4d", "title": "Latih Diri 4.4d — Anggaran Populasi dan Nisbah", "questions": [{"num": 1, "stem": "Kajian ikan tasik: tangkapan pertama 60 ekor ditanda. Tangkapan kedua: 5 ekor bertanda, 20 ekor tidak bertanda. Anggarkan populasi ikan.", "parts": [{"label": null, "ans": ["300"], "steps": ["Tangkapan kedua keseluruhan = 5+20 = 25 ekor.", "Kadaran: 5/25 = 60/x.", "x = 60×25÷5 = 300 ekor."]}], "open": false, "sample": null}, {"num": 2, "stem": "Pasukan bola sepak main 28 perlawanan, menang 4 daripada setiap 7 perlawanan.\n(a) Berapa kali kalah?\n(b) Nisbah menang:kalah.\n(c) Jika trend berlanjutan, anggarkan kekalahan selepas menang 20 perlawanan.", "parts": [{"label": "a", "ans": ["12"], "steps": ["Menang = 28×(4/7) = 16.", "Kalah = 28–16 = 12 kali."]}, {"label": "b", "ans": ["4:3"], "steps": ["Menang:Kalah = 16:12 = 4:3."]}, {"label": "c", "ans": ["15"], "steps": ["Jika menang 20, kalah = 20×(3/4) = 15 kali."]}], "open": false, "sample": null}]}, {"group": "Mahir Diri 4.4", "title": "Mahir Diri 4.4", "questions": [{"num": 1, "stem": "Setiap 12 pengakap diselia 1 guru. 90 pengakap sertai kem. Bilangan MINIMUM guru pengiring?", "parts": [{"label": null, "ans": ["8"], "steps": ["90 ÷ 12 = 7.5.", "Bundarkan ke ATAS (kerana perlu penyeliaan penuh) = 8 orang guru."]}], "open": false, "sample": null}, {"num": 2, "stem": "Akmal, Bakri, Cadin kongsi kos RM4200. Cadin bayar RM2100. Kos Akmal = 3/4 kos Bakri. Cari nisbah Akmal:Bakri:Cadin.", "parts": [{"label": null, "ans": ["3:4:7"], "steps": ["Akmal+Bakri = 4200–2100 = RM2100.", "Akmal = (3/4)Bakri, jadi (3/4)B + B = 2100 → (7/4)B=2100 → B=1200, A=900.", "Nisbah = 900:1200:2100 ÷300 = 3:4:7."]}], "open": false, "sample": null}, {"num": 3, "stem": "Harga ikan: Bawal RM1.50/100g, Cencaru RM3. "use strict";

function normalize(s){
  if (s === null || s === undefined) return "";
  s = String(s).toLowerCase().trim();
  s = s.replace(/rm/g,"").replace(/\s+/g,"").replace(/–/g,"-").replace(/—/g,"-");
  return s;
}

function toNumber(s){
  s = normalize(s);
  if (s === "") return null;
  if (/^-?\d+\/\d+$/.test(s)){
    var parts = s.split("/");
    return parseFloat(parts[0])/parseFloat(parts[1]);
  }
  if (/^-?\d+(\.\d+)?$/.test(s)){
    return parseFloat(s);
  }
  return null;
}

function fuzzyNumberMatch(input, accepted){
  var vi = toNumber(input);
  if (vi === null) return false;
  for (var i=0;i<accepted.length;i++){
    var va = toNumber(accepted[i]);
    if (va !== null && Math.abs(vi - va) < 0.005) return true;
  }
  return false;
}

function checkPart(inputRaw, acceptedList){
  var inputN = normalize(inputRaw);
  if (inputN === "") return false;
  for (var i=0;i<acceptedList.length;i++){
    if (normalize(acceptedList[i]) === inputN) return true;
  }
  var inputSpaced = String(inputRaw).toLowerCase().trim().replace(/–/g,"-");
  for (var j=0;j<acceptedList.length;j++){
    if (String(acceptedList[j]).toLowerCase().trim() === inputSpaced) return true;
  }
  if (fuzzyNumberMatch(inputRaw, acceptedList)) return true;
  return false;
}

    var val = inp.value.trim();
    var mark = document.getElementById("mark-"+qid+"-0");
    if (val.length > 0){ mark.textContent = "✅"; inp.classList.add("correct"); } else { mark.textContent = ""; }
    document.getElementById("sol-"+qid).classList.add("show");
    if (!alreadyChecked){
      checkedCount++; correctPartsCount += 1; card.setAttribute("data-checked","1"); updateProgress();
    }
    document.getElementById("status-"+qid).textContent = "📝";
    return;
  }

  var allCorrect = true, correctHere = 0;
  qq.parts.forEach(function(pp, pi){
    var inp = card.querySelector('input[data-part="'+pi+'"]');
    var mark = document.getElementById("mark-"+qid+"-"+pi);
    var ok = checkPart(inp.value, pp.ans);
    inp.classList.remove("correct","wrong");
    if (ok){ inp.classList.add("correct"); mark.textContent = "✅"; correctHere++; }
    else { inp.classList.add("wrong"); mark.textContent = "❌"; allCorrect = false; }
  });

  document.getElementById("sol-"+qid).classList.add("show");
  document.getElementById("status-"+qid).textContent = allCorrect ? "✅" : "❌";

  if (!alreadyChecked){
    checkedCount++; correctPartsCount += correctHere;
    card.setAttribute("data-checked","1"); card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  } else {
    var prevCorrect = parseInt(card.getAttribute("data-correct-count")||"0",10);
    correctPartsCount += (correctHere - prevCorrect);
    card.setAttribute("data-correct-count", correctHere);
    updateProgress();
  }
}

function onToggle(qid){
  document.getElementById("sol-"+qid).classList.toggle("show");
}

document.addEventListener("click", function(e){
  var t = e.target;
  if (t.matches('button[data-action="semak"]')) onSemak(t.getAttribute("data-qid"));
  else if (t.matches('button[data-action="toggle"]')) onToggle(t.getAttribute("data-qid"));
});

window.addEventListener("scroll", function(){
  document.getElementById("backTop").style.display = window.scrollY > 400 ? "block" : "none";
});

buildToc();
render();
updateProgress();

})();

</script>
</body>
</html>
